    try {
      if (what === 'test') { const r = await window.SoulveeOS.accounts.test(a.id); toast(r.account.status === 'ok' ? `${accountName(a)} is connected` : r.account.error); }
      if (what === 'toggle') { await window.SoulveeOS.accounts.update(a.id, { enabled: !a.enabled }); toast(a.enabled ? `${accountName(a)} switched off` : `${accountName(a)} switched on`); }
      if (what === 'remove') { if (!confirm(`Remove ${accountName(a)} from Soulvee OS? Its conversations here are deleted too. Nothing changes on ${networkOf(a.provider).name} itself.`)) { setBusy(''); return; } await window.SoulveeOS.accounts.remove(a.id); toast(`${accountName(a)} removed`); }
    } catch (e) { toast(e.message); }
    setBusy(''); load(false);
  };
  const counts = groups.map(g => `${g.list.length} ${networkOf(g.id).name}`).join(' · ');
  return html`<div className="space-y-6">
    <${Section} title="Accounts" sub="Every Page, profile, channel, number and mailbox you run, managed in one place. Connect as many of each as you have." action=${html`<${Btn} small kind="ghost" onClick=${() => load(true)}>Refresh</${Btn}>`}>
      ${all.length > 0 && html`<p className=${'text-xs ' + muted}>${all.length} connected: ${counts}${unread ? ` · ${unread} unread in the inbox` : ''}</p>`}
      ${data.bufferError && html`<p className="text-xs text-amber-700 dark:text-amber-300">${data.bufferError}</p>`}
    <//>
    ${all.length === 0 && html`<${Card}><${Empty} title="Nothing connected yet">Connect your Facebook Pages, Instagram, Threads, X, LinkedIn, Telegram, WhatsApp, Reddit, Gmail or Signal below. Posts can then go out from Content, and messages land in the Inbox.<//><//>`}
    ${groups.map(g => html`<div key=${g.id} className="space-y-2">
      <div className="flex items-center gap-2"><${NetBadge} id=${g.id} /><p className="font-semibold text-sm">${networkOf(g.id).name}</p><span className=${'text-xs ' + muted}>· ${g.list.length}</span></div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">${g.list.map(a => {
        const done = accountActivity(store.data.content, a.id);
        const soon = a.expiresAt && Date.parse(a.expiresAt) - Date.now() < 7 * 864e5 && a.provider === 'linkedin';
        return html`<${Card} key=${a.id}>
          <div className="flex items-start gap-3">
            ${a.avatar ? html`<img src=${a.avatar} alt="" className="w-10 h-10 rounded-xl object-cover shrink-0 bg-slate-100 dark:bg-white/10" />` : html`<${NetBadge} id=${a.provider} big />`}
            <div className="min-w-0 flex-1">
              <p className="font-semibold truncate">${accountName(a)}</p>
              <p className=${'text-xs truncate ' + muted}>${[a.label ? a.name : '', a.handle, KIND[a.kind] || '', a.via === 'buffer' ? 'via Buffer' : '', a.meta && a.meta.page && a.provider === 'instagram' ? 'linked to ' + a.meta.page : ''].filter(Boolean).join(' · ')}</p>
              <div className="flex gap-1.5 mt-1.5 flex-wrap">
                ${a.enabled === false ? html`<${Pill} tone="amber">switched off</${Pill}>` : a.status === 'error' ? html`<${Pill} tone="red">needs attention</${Pill}>` : html`<${Pill} tone="green">connected</${Pill}>`}
                ${a.can && a.can.publish && html`<${Pill}>posts</${Pill}>`}${a.can && a.can.inbox && html`<${Pill}>inbox</${Pill}>`}
                ${(a.brands || []).map(b => html`<${BrandChip} key=${b} id=${b} />`)}
              </div>
            </div>
          </div>
          ${a.error && html`<p className="text-xs mt-2 text-rose-600 dark:text-rose-400">${a.error}</p>`}
          ${soon && html`<p className="text-xs mt-2 text-amber-700 dark:text-amber-300">This sign-in ends ${fmtDate(a.expiresAt)}. Reconnect before then to keep posting.</p>`}
          ${(done.next || done.sent > 0) && html`<p className=${'text-xs mt-2 ' + muted}>${done.next ? `Next: "${done.next.post.title || 'post'}" ${fmtSlot(done.next.r.runAt)}` : ''}${done.next && done.sent ? ' · ' : ''}${done.sent ? `${done.sent} posted from Soulvee OS${done.last ? ', last ' + fmtDate(done.last) : ''}` : ''}</p>`}
          <div className="flex gap-2 mt-3 flex-wrap">
            <${Btn} small kind="ghost" onClick=${() => setEditing(a)}>Brands${a.via === 'buffer' ? '' : ' & name'}</${Btn}>
            ${a.via !== 'buffer' && html`<${Btn} small kind="ghost" disabled=${!!busy} onClick=${() => act(a, 'test')}>${busy === a.id + 'test' ? 'Testing…' : 'Test'}</${Btn}>`}
            ${a.provider === 'telegram' && a.kind === 'bot' && html`<${Btn} small kind="ghost" onClick=${() => setForm({ provider: data.providers.find(p => p.id === 'telegram'), via: a.id })}>+ Channels</${Btn}>`}
            ${a.via !== 'buffer' && html`<${Btn} small kind="ghost" disabled=${!!busy} onClick=${() => act(a, 'toggle')}>${a.enabled === false ? 'Switch on' : 'Switch off'}</${Btn}>`}
            ${a.via !== 'buffer' && html`<${Btn} small kind="danger" disabled=${!!busy} onClick=${() => act(a, 'remove')}>Remove</${Btn}>`}
            ${a.via === 'buffer' && html`<a href="https://publish.buffer.com" target="_blank" rel="noopener" className="px-3 py-1.5 text-xs rounded-xl bg-slate-100 dark:bg-white/10 font-medium">Manage in Buffer</a>`}
          </div>
        <//>`;
      })}</div>
    </div>`)}

    <${Section} title="Connect" sub="Each platform needs its own developer app or token. The README's platform guide has the steps for each.">
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">${data.providers.map(p => html`<${Card} key=${p.id}>
        <div className="flex items-start gap-3">
          <div className="flex -space-x-1.5 shrink-0">${p.platforms.map(id => html`<${NetBadge} key=${id} id=${id} />`)}</div>
          <div className="min-w-0 flex-1"><p className="font-semibold text-sm">${p.name}</p><p className=${'text-xs ' + muted}>${p.does}</p></div>
        </div>
        <p className=${'text-[11px] mt-2 ' + muted}>${p.note}</p>
        ${p.id === 'whatsapp' && html`<div className="mt-2 p-2 rounded-lg text-[11px] bg-slate-50 dark:bg-white/5 space-y-0.5 break-all">
          <p><span className="font-semibold">Webhook address:</span> ${p.webhook.url}</p>
          <p><span className="font-semibold">Verify token:</span> ${p.webhook.verifyToken}</p>
          ${!p.webhook.publicUrl && html`<p className="text-amber-700 dark:text-amber-300">Set PUBLIC_URL to this server's public https address, so Meta can deliver messages.</p>`}
        </div>`}
        <div className="flex gap-2 mt-3 flex-wrap">
          ${p.viaBuffer ? (data.bufferConnected ? html`<a href="https://publish.buffer.com" target="_blank" rel="noopener" className="px-3 py-1.5 text-xs rounded-xl bg-slate-100 dark:bg-white/10 font-medium">Add ${p.name} in Buffer</a>` : html`<span className=${'text-xs ' + muted}>Add BUFFER_API_KEY to the server first.</span>`) : null}
          ${p.oauth === true && html`<${Btn} small onClick=${() => signIn(p)} disabled=${busy === p.id}>${busy === p.id ? 'Opening…' : 'Sign in with ' + (p.id === 'gmail' ? 'Google' : p.name.split(' ')[0])}</${Btn}>`}
          ${p.oauth === false && p.env && html`<span className=${'text-xs ' + muted}>To sign in, add ${p.env} to the server's .env and restart it.</span>`}
          ${!p.viaBuffer && p.fields.length > 0 && html`<${Btn} small kind=${p.oauth ? 'ghost' : 'primary'} onClick=${() => setForm({ provider: p })}>${p.id === 'meta' ? 'Paste a token' : 'Connect'}</${Btn}>`}
        </div>
      <//>`)}</div>
      <p className=${'text-xs ' + muted}>Sign-ins come back to ${data.redirect}<span className="font-mono">platform</span>. Register that address (for example ${data.redirect}meta) in each developer app.</p>
    <//>
    ${form && html`<${ConnectModal} provider=${form.provider} via=${form.via} toast=${toast} onClose=${() => setForm(null)} onDone=${() => { setForm(null); load(false); }} />`}
    ${editing && html`<${AccountEditModal} account=${editing} onClose=${() => setEditing(null)} onSave=${f => save(editing, f)} />`}
  </div>`;
}

/* ---------------- Inbox ---------------- */
const SOURCE_FOR = { whatsapp: 'WhatsApp', instagram: 'Instagram', gmail: 'Email', linkedin: 'LinkedIn', tiktok: 'TikTok' };
// The CRM contact a conversation is with: a saved link first, then the phone, email or handle.
function contactForPeer(contacts, c) {
  const p = c.peer || {};
  const handle = v => bare(v).replace(/^u\//i, '').toLowerCase();
  return contacts.find(x => (x.links || []).some(l => l.provider === c.provider && String(l.id) === String(p.id)))
    || (p.phone && contacts.find(x => [x.phone, x.whatsapp, x.signal].some(n => samePhone(n, p.phone))))
    || (p.email && contacts.find(x => x.email && normEmail(x.email) === normEmail(p.email)))
    || (c.provider === 'telegram' && p.handle && contacts.find(x => x.telegram && handle(x.telegram) === handle(p.handle)))
    || (c.provider === 'instagram' && p.handle && contacts.find(x => x.instagram && handle(x.instagram) === handle(p.handle)))
    || (c.provider === 'reddit' && p.id && contacts.find(x => x.reddit && handle(x.reddit) === String(p.id).toLowerCase()))
    || null;
}
// A new contact from the person in a conversation, with what the platform told us about them.
function contactFromPeer(c, brands) {
  const p = c.peer || {};
  return {
    ...blankContact(),
    name: p.name || p.handle || p.phone || p.email || 'New contact',
    phone: p.phone || '',
    email: p.email || '',
    whatsapp: c.provider === 'whatsapp' ? p.phone || '' : '',
    signal: c.provider === 'signal' ? p.phone || '' : '',
    telegram: c.provider === 'telegram' ? p.handle || '' : '',
    instagram: c.provider === 'instagram' ? p.handle || '' : '',
    reddit: c.provider === 'reddit' && p.id ? 'u/' + p.id : '',
    source: SOURCE_FOR[c.provider] || 'Direct',
    brands: brands || [],
    links: p.id ? [{ provider: c.provider, id: String(p.id) }] : [],
  };
}
const ago = iso => { const s = (Date.now() - Date.parse(iso)) / 1000; if (!(s >= 0)) return ''; if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h'; return Math.floor(s / 86400) + 'd'; };

function InboxView({ store, caps, toast, openKey, setOpenKey, onUnread, go, openContact }) {
  const [list, setList] = useState(null);
  const [err, setErr] = useState('');
  const [filter, setFilter] = useState('all');
  const [q, setQ] = useState('');
  const [convo, setConvo] = useState(null);
  const [text, setText] = useState('');
  const [template, setTemplate] = useState('');
  const [busy, setBusy] = useState('');
  const [linking, setLinking] = useState(false);
  const endRef = useRef(null);
  const load = async () => { try { const r = await window.SoulveeOS.inbox.list(); setList(r.conversations); onUnread(r.unread); setErr(''); return r; } catch (e) { setErr(e.message); return null; } };
  const open = async key => {
    try {
      const r = await window.SoulveeOS.inbox.get(key);
      setConvo(r.conversation); setText(''); setTemplate(''); setLinking(false);
      if (r.conversation.unread) { await window.SoulveeOS.inbox.read(key); load(); }
    } catch (e) { toast(e.message); }
  };
  useEffect(() => { load(); const t = setInterval(load, 15000); return () => clearInterval(t); }, []);
  useEffect(() => { if (openKey) { open(openKey); setOpenKey(null); } }, [openKey]);
  useEffect(() => { if (endRef.current && endRef.current.scrollIntoView) endRef.current.scrollIntoView({ block: 'end' }); }, [convo && convo.messages && convo.messages.length]);
  useEffect(() => {
    if (!convo) return undefined;
    const t = setInterval(() => window.SoulveeOS.inbox.get(convo.key).then(r => setConvo(c => (c && c.key === r.conversation.key ? r.conversation : c)), () => {}), 15000);
    return () => clearInterval(t);
  }, [convo && convo.key]);

  if (err && !list) return html`<${Section} title="Inbox"><${Card}><${Empty} title="The inbox isn't available here">${err}<//><//><//>`;
  if (!list) return html`<${Section} title="Inbox"><${Card}><p className=${'text-sm ' + muted}>Loading messages…</p><//><//>`;
  const sync = async () => { setBusy('sync'); try { const r = await window.SoulveeOS.inbox.sync(); setList(r.conversations); onUnread(r.unread); toast(r.added ? `${r.added} new message${r.added === 1 ? '' : 's'}` : 'No new messages'); } catch (e) { toast(e.message); } setBusy(''); };
  const nets = [...new Set(list.map(c => c.provider))];
  const needle = q.trim().toLowerCase();
  const shown = list.filter(c => (filter === 'all' || (filter === 'unread' ? c.unread > 0 : c.provider === filter)) && (!needle || [c.peer.name, c.peer.handle, c.peer.phone, c.peer.email, c.subject, c.lastText, c.account].join(' ').toLowerCase().includes(needle)));
  const who = convo && contactForPeer(store.data.contacts, convo);
  const late = convo && convo.provider === 'whatsapp' && (!convo.lastInboundAt || Date.now() - Date.parse(convo.lastInboundAt) > 24 * 3600e3);
  const send = async () => {
    if (!convo || busy) return;
    setBusy('send');
    try {
      const r = await window.SoulveeOS.inbox.reply(convo.key, late && template.trim() ? { template: { name: template.trim(), language: 'en' } } : { text });
      setConvo(r.conversation); setText(''); setTemplate(''); load();
    } catch (e) { toast(e.message); }
    setBusy('');
  };
  const draft = async () => {
    if (!caps.sample || !convo || busy) return;
    setBusy('draft');
    const brand = (convo.brands || [])[0] || (who && (who.brands || [])[0]) || 'smc';
    const history = convo.messages.slice(-12).map(m => `${m.dir === 'in' ? (convo.peer.name || 'Them') : 'Soulvee'}: ${m.text}`).join('\n');
    try {
      const r = await caps.sample(`${voiceFor(brand)}
Draft Soulvee's next reply in this ${networkOf(convo.provider).name} conversation${convo.subject ? ` (subject: "${convo.subject}")` : ''}. Answer what they asked, move things towards a booking or sale where it fits, and keep it short and natural for ${networkOf(convo.provider).name}. Plain text only. Don't invent prices, dates or availability that aren't in the conversation or below.
${who ? `What the CRM knows: ${contactLabel(who)}, stage ${lifecycleOf(who.stage).name}${(who.tags || []).length ? ', tags ' + who.tags.join(', ') : ''}${who.notes ? '. Notes: ' + who.notes : ''}.` : ''}
Offers and prices: ${store.data.offers.filter(o => o.status !== 'retired' && (!brand || o.brand === brand)).slice(0, 6).map(o => `${o.name} (${(o.tiers || []).filter(t => num(t.price) > 0).map(t => t.name + ' ' + ngn(t.price)).join(', ') || 'price on request'})`).join('; ') || 'none listed'}.
Conversation, oldest first:
${history}`, { effort: 'low' });
      setText((r.text || '').trim());
    } catch (e) { toast(sampleMessage(e)); }
    setBusy('');
  };
  const addContact = async () => {
    const made = await store.add('contacts', contactFromPeer(convo, convo.brands));
    toast(`${made.name} added to your contacts`);
  };
  const linkTo = async id => {
    const c = store.data.contacts.find(x => x.id === id);
    if (!c) return;
    const p = convo.peer || {};
    const patch = { links: [...(c.links || []).filter(l => !(l.provider === convo.provider && String(l.id) === String(p.id))), ...(p.id ? [{ provider: convo.provider, id: String(p.id) }] : [])] };
    const fill = contactFromPeer(convo, []);
    ['phone', 'email', 'whatsapp', 'signal', 'telegram', 'instagram', 'reddit'].forEach(k => { if (fill[k] && !c[k]) patch[k] = fill[k]; });
    await store.update('contacts', c.id, patch);
    setLinking(false);
    toast(`Linked to ${c.name}`);
  };
  const people = [...store.data.contacts].sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const listPane = html`<div className=${'space-y-3 ' + (convo ? 'hidden lg:block' : '')}>
    <input className=${inputCls} aria-label="Search messages" value=${q} onChange=${e => setQ(e.target.value)} placeholder="Search people and messages" />
    <${Chips} value=${filter} onChange=${setFilter} options=${[{ v: 'all', l: 'All' }, { v: 'unread', l: 'Unread' }, ...nets.map(n => ({ v: n, l: networkOf(n).name }))]} />
    ${list.length === 0 ? html`<${Card}><${Empty} title="No messages yet">Connect WhatsApp, Facebook Pages, Instagram, Telegram, Gmail, Reddit or Signal in Accounts. New messages arrive here within a minute.<//><${Btn} small kind="ghost" onClick=${() => go('accounts')}>Open Accounts</${Btn}><//>` : shown.length === 0 ? html`<${Card}><${Empty} title="Nothing matches">Try another filter.<//><//>` : html`<${Card} className="!p-0 overflow-hidden">${shown.map(c => html`<button key=${c.key} onClick=${() => open(c.key)} className=${'w-full text-left flex gap-3 px-4 py-3 border-b last:border-0 border-slate-100 dark:border-white/5 ' + (convo && convo.key === c.key ? 'bg-violet-50 dark:bg-violet-500/10' : 'hover:bg-slate-50 dark:hover:bg-white/5')}>
      <${NetBadge} id=${c.provider} />
      <div className="min-w-0 flex-1">
        <div className="flex justify-between gap-2"><p className=${'text-sm truncate ' + (c.unread ? 'font-bold' : 'font-medium')}>${c.peer.name || c.peer.handle || 'Unknown'}</p><span className=${'text-[11px] shrink-0 ' + muted}>${ago(c.lastAt)}</span></div>
        <p className=${'text-xs truncate ' + (c.unread ? '' : muted)}>${c.lastDir === 'out' ? 'You: ' : ''}${c.subject && c.provider === 'gmail' ? c.subject + ' — ' : ''}${c.lastText}</p>
        <p className=${'text-[11px] truncate ' + muted}>${c.account}</p>
      </div>
      ${c.unread > 0 && html`<span className="self-center shrink-0 min-w-[1.25rem] h-5 px-1.5 rounded-full bg-violet-600 text-white text-[11px] font-bold flex items-center justify-center" aria-label=${c.unread + ' unread'}>${c.unread}</span>`}
    </button>`)}<//>`}
  </div>`;
  const pane = convo && html`<${Card} className="!p-0 overflow-hidden flex flex-col">
    <div className="flex items-start gap-3 p-4 border-b border-slate-100 dark:border-white/10">
      <button className="lg:hidden text-sm text-violet-500 shrink-0" onClick=${() => setConvo(null)} aria-label="Back to conversations">←</button>
      <${NetBadge} id=${convo.provider} />
      <div className="min-w-0 flex-1">
        <p className="font-semibold truncate">${convo.peer.name || convo.peer.handle || 'Unknown'}</p>
        <p className=${'text-xs truncate ' + muted}>${[convo.peer.handle, convo.peer.phone, convo.peer.email, networkOf(convo.provider).name + ' · ' + convo.account].filter(Boolean).join(' · ')}</p>
        <div className="mt-1.5 flex flex-wrap gap-2 items-center text-xs">
          ${who ? html`<button className="font-medium text-violet-500" onClick=${() => openContact(who)}>Contact: ${who.name}</button>` : html`<${Btn} small kind="ghost" onClick=${addContact}>Add to contacts</${Btn}><${Btn} small kind="ghost" onClick=${() => setLinking(v => !v)}>Link to a contact</${Btn}>`}
        </div>
        ${linking && html`<div className="mt-2 w-full max-w-xs"><${Select} value="" onChange=${linkTo} options=${[{ v: '', l: 'Choose a contact…' }, ...people.map(c => ({ v: c.id, l: contactLabel(c) }))]} /></div>`}
      </div>
    </div>
    <div className="p-4 space-y-2 max-h-[52vh] overflow-y-auto">
      ${convo.subject && html`<p className=${'text-xs font-medium ' + muted}>${convo.subject}</p>`}
      ${convo.messages.map(m => html`<div key=${m.id} className=${'flex ' + (m.dir === 'out' ? 'justify-end' : 'justify-start')}>
        <div className=${'max-w-[85%] rounded-2xl px-3.5 py-2 text-sm whitespace-pre-wrap break-words ' + (m.dir === 'out' ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white' : 'bg-slate-100 dark:bg-white/10')}>
          ${m.author && html`<p className="text-[11px] font-semibold opacity-80">${m.author}</p>`}${m.text}
          <p className=${'text-[10px] mt-1 ' + (m.dir === 'out' ? 'text-white/75' : muted)}>${fmtDateTime(m.at)}${m.status && m.dir === 'out' ? ' · ' + m.status : ''}${m.error ? ' · ' + m.error : ''}</p>
        </div>
      </div>`)}
      <div ref=${endRef}></div>
    </div>
    <div className="p-3 border-t border-slate-100 dark:border-white/10 space-y-2">
      ${late && html`<p className="text-xs text-amber-700 dark:text-amber-300">More than 24 hours have passed since they last wrote, so WhatsApp only allows an approved template. Enter its name to send it, or wait for them to write again.</p>`}
      ${late ? html`<input className=${inputCls} aria-label="Template name" value=${template} onChange=${e => setTemplate(e.target.value)} placeholder="Approved template name, e.g. follow_up" />` : html`<textarea rows="3" className=${inputCls + ' resize-none'} aria-label="Reply" value=${text} onChange=${e => setText(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send(); }} placeholder=${'Reply on ' + networkOf(convo.provider).name + '…'}></textarea>`}
      <div className="flex gap-2 justify-end flex-wrap">
        ${caps.sample && !late && html`<${Btn} small kind="ghost" onClick=${draft} disabled=${!!busy}>${busy === 'draft' ? 'Drafting…' : '✦ Draft reply'}</${Btn}>`}
        <${Btn} small onClick=${send} disabled=${!!busy || (late ? !template.trim() : !text.trim())}>${busy === 'send' ? 'Sending…' : late ? 'Send template' : 'Send'}</${Btn}>
      </div>
    </div>
  <//>`;
  return html`<div className="space-y-4">
    <${Section} title="Inbox" sub="WhatsApp, Messenger, Instagram, Telegram, Gmail, Reddit and Signal messages in one place. Replies go out from the account each message came in on." action=${html`<${Btn} small kind="ghost" onClick=${sync} disabled=${busy === 'sync'}>${busy === 'sync' ? 'Checking…' : 'Check now'}</${Btn}>`} />
    <div className="grid grid-cols-1 lg:grid-cols-5 gap-4 items-start">
      <div className="lg:col-span-2">${listPane}</div>
      <div className="lg:col-span-3">${pane || html`<div className="hidden lg:block"><${Card}><${Empty} title="Pick a conversation">Its messages and a reply box open here.<//><//></div>`}</div>
    </div>
  </div>`;
}

/* ---------------- Content Studio ---------------- */
const PLATFORMS = SHARED.PLATFORMS;
const platformOf = SHARED.platformOf;
const POST_STATUS = ['idea', 'draft', 'approved', 'scheduled', 'posted', 'failed'];
const STATUS_TONE = { idea: 'slate', draft: 'blue', approved: 'violet', scheduled: 'amber', posted: 'green', failed: 'red' };
const YT_CATEGORY = SHARED.YT_CATEGORY;
const SERVICE_LABEL = { instagram: 'Instagram', tiktok: 'TikTok', facebook: 'Facebook', linkedin: 'LinkedIn', twitter: 'X', threads: 'Threads', youtube: 'YouTube', pinterest: 'Pinterest', bluesky: 'Bluesky', mastodon: 'Mastodon', googlebusiness: 'Google Business', substack: 'Substack' };
const CONTENT_SCHEMA = SHARED.CONTENT_SCHEMA;

const hhmm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
const toLocalParts = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? { date: localDate(d), time: hhmm(d) } : { date: '', time: '' }; };
const fromLocalParts = (date, time) => { if (!date) return ''; const d = new Date(`${date}T${time || '10:00'}:00`); return isNaN(d) ? '' : d.toISOString(); };
const slotFor = (day, time) => SHARED.slot(Math.max(0, Math.min(13, Math.round(num(day)))), time, TZ);
const tagLine = SHARED.tagLine;
const fmtSlot = iso => { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };

function postWarnings(p) {
  const out = [];
  const media = p.media || [];
  const len = String(p.text || '').length;
  if (!String(p.text || '').trim()) out.push('No caption yet');
  if (!(p.platforms || []).length) out.push('Pick at least one platform');
  (p.platforms || []).forEach(id => {
    const pl = platformOf(id);
    if (len > pl.limit) out.push(`Too long for ${pl.name} (${len}/${pl.limit})`);
    if (pl.media === 'video' && !media.some(m => m.type === 'video')) out.push(`${pl.name} needs a video`);
    if (pl.media === 'any' && !media.length) out.push(`${pl.name} needs an image or video`);
  });
  return out;
}

function shareLink(platform, text, title) {
  const t = encodeURIComponent(text || '');
  if (platform === 'x') return 'https://x.com/intent/post?text=' + t;
  if (platform === 'threads') return 'https://www.threads.net/intent/post?text=' + t;
  if (platform === 'linkedin') return 'https://www.linkedin.com/feed/?shareActive=true&text=' + t;
  if (platform === 'telegram') return 'https://t.me/share/url?url=' + t;
  if (platform === 'whatsapp') return 'https://wa.me/?text=' + t;
  if (platform === 'reddit') return 'https://www.reddit.com/submit?type=TEXT&title=' + encodeURIComponent(title || String(text || '').split('\n')[0]) + '&text=' + t;
  return platformOf(platform).url;
}

const copyText = async (t, toast) => { try { await navigator.clipboard.writeText(t); toast('Caption copied'); } catch (e) { toast('Copy blocked — select the text and copy it manually'); } };

function PlatformToggles({ value, onChange }) {
  return html`<div className="flex flex-wrap gap-1.5">${PLATFORMS.map(p => html`<button type="button" key=${p.id} onClick=${() => onChange(value.includes(p.id) ? value.filter(x => x !== p.id) : [...value, p.id])} className=${'px-2.5 py-1 rounded-full text-xs font-medium transition ' + (value.includes(p.id) ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white' : 'bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-300')}>${p.name}</button>`)}</div>`;
}

function PostModal({ post, caps, toast, images, onClose, onSave }) {
  const [f, setF] = useState(() => {
    const p = { brand: 'smc', title: '', text: '', platforms: ['instagram'], media: [], status: 'draft', scheduledAt: '', igType: '', ytCategory: '', firstComment: '', visual: '', script: '', notes: '', ...(post || {}) };
    const parts = toLocalParts(p.scheduledAt);
    return { ...p, media: (p.media || []).map(m => ({ ...m })), date: parts.date, time: parts.time || '10:00' };

  const [ask, setAsk] = useState('');
  const [busy, setBusy] = useState(false);
  const [drawing, setDrawing] = useState(false);
  const draw = async () => {
    setDrawing(true);
    try {
      const r = await window.SoulveeOS.images.generate({ brand: f.brand, visual: f.visual, format: f.format || (f.igType === 'story' ? 'story' : f.igType === 'reel' ? 'reel' : 'image'), platforms: f.platforms, title: f.title });
      setF(p => ({ ...p, media: [...p.media, { type: 'image', url: r.media.url }] }));
      toast('Image added');
    } catch (e) { toast(e.message); }
    setDrawing(false);
  };
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const setMedia = (i, k, v) => set('media', f.media.map((m, j) => j === i ? { ...m, [k]: v } : m));
  const len = String(f.text || '').length;
  const warnings = postWarnings({ ...f, media: f.media.filter(m => String(m.url).trim()) });

  const polish = async () => {
    if (!caps.sample || busy || !String(f.text).trim()) return;
    setBusy(true);
    try {
      const names = f.platforms.map(id => platformOf(id).name).join(', ') || 'Instagram';
      const limit = Math.min(2200, ...f.platforms.map(id => platformOf(id).limit));
      const r = await caps.sample(`${voiceFor(f.brand)}
Rewrite this social media caption for ${names}. ${ask.trim() ? 'Instruction: ' + ask.trim() + '.' : 'Make the hook stronger and the call to action clearer.'}
Keep it under ${limit} characters including hashtags, and keep any hashtags at the end. Don't invent prices, dates, venues or names that aren't in the caption.
Reply with only the new caption.

Caption:
${f.text}`, { effort: 'low' });
      const text = String(r.text || '').trim();
      if (text) set('text', text);
    } catch (e) { toast(sampleMessage(e)); }
    setBusy(false);
  };

  const save = () => {
    const { date, time, ...rest } = f;
    onSave({ ...rest, title: String(f.title).trim(), text: String(f.text).trim(), media: f.media.filter(m => String(m.url).trim()).map(m => ({ type: m.type === 'video' ? 'video' : 'image', url: String(m.url).trim() })), scheduledAt: fromLocalParts(date, time) });
  };

  return html`<${Modal} title=${post && post.id ? 'Edit post' : 'New post'} wide onClose=${onClose} footer=${html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} onClick=${save} disabled=${!String(f.text).trim()}>Save post</${Btn}>`}>
    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <${Field} label="Brand"><${Select} value=${f.brand} onChange=${v => setF(p => ({ ...p, brand: v, ytCategory: p.ytCategory || '' }))} options=${brandOptions} /><//>
      <${Field} label="Status"><${Select} value=${f.status} onChange=${v => set('status', v)} options=${POST_STATUS} /><//>
      <${Field} label="Title (for you, not posted)" className="sm:col-span-2"><${Input} value=${f.title} onChange=${e => set('title', e.target.value)} placeholder="e.g. Friday gig teaser" /><//>
      <div className="sm:col-span-2"><span className=${'block text-xs font-medium mb-1 ' + muted}>Platforms</span><${PlatformToggles} value=${f.platforms} onChange=${v => set('platforms', v)} /></div>
      <${Field} label="Caption" className="sm:col-span-2"><${Area} rows="7" value=${f.text} onChange=${e => set('text', e.target.value)} placeholder="Hook first, then the message, call to action and hashtags." /><//>
      <div className="sm:col-span-2 flex flex-wrap gap-1.5 -mt-1">${f.platforms.map(id => { const pl = platformOf(id); return html`<span key=${id} className=${'text-[11px] px-2 py-0.5 rounded-full ' + (len > pl.limit ? 'bg-rose-100 text-rose-800 dark:bg-rose-500/15 dark:text-rose-300' : 'bg-slate-100 text-slate-600 dark:bg-white/10 dark:text-slate-300')}>${pl.name} ${len}/${pl.limit}</span>`; })}</div>
      ${caps.sample && html`<div className="sm:col-span-2 flex gap-2"><input className=${inputCls} value=${ask} onChange=${e => setAsk(e.target.value)} placeholder="Optional: how to change it (shorter, more hype, add Pidgin…)" /><${Btn} kind="ghost" onClick=${polish} disabled=${busy || !String(f.text).trim()}>${busy ? 'Polishing…' : 'Polish with AI'}</${Btn}></div>`}
      <div className="sm:col-span-2">
        <div className="flex items-center justify-between mb-1"><span className=${'text-xs font-medium ' + muted}>Media (public links)</span><button type="button" className="text-xs text-violet-500 font-medium" onClick=${() => set('media', [...f.media, { type: 'image', url: '' }])}>+ Add media</button></div>
        <div className="space-y-2">${f.media.map((m, i) => html`<div key=${i} className="flex gap-2"><select className=${inputCls + ' !w-28'} value=${m.type} onChange=${e => setMedia(i, 'type', e.target.value)}><option value="image">Image</option><option value="video">Video</option></select>${m.type === 'image' && m.url ? html`<img src=${m.url} alt="" className="w-10 h-10 rounded-lg object-cover shrink-0 bg-slate-100 dark:bg-white/10" />` : null}<input className=${inputCls} value=${m.url} onChange=${e => setMedia(i, 'url', e.target.value)} placeholder="https://res.cloudinary.com/…/flyer.jpg" /><button type="button" className="text-rose-500 text-xs px-1" onClick=${() => set('media', f.media.filter((_, j) => j !== i))}>✕</button></div>`)}</div>
        <p className=${'text-[11px] mt-1 ' + muted}>Use a direct public link (Cloudinary, Cloudflare R2, your website). Google Drive and Dropbox share links won't work.</p>
      </div>
      <${Field} label="Date"><${Input} type="date" value=${f.date} onChange=${e => set('date', e.target.value)} /><//>
      <${Field} label="Time"><${Input} type="time" value=${f.time} onChange=${e => set('time', e.target.value)} /><//>
      ${f.platforms.includes('instagram') && html`<${Field} label="Instagram format"><${Select} value=${f.igType} onChange=${v => set('igType', v)} options=${[{ v: '', l: 'Automatic (reel for video)' }, { v: 'post', l: 'Feed post' }, { v: 'reel', l: 'Reel' }, { v: 'story', l: 'Story' }]} /><//>`}
      ${(f.platforms.includes('instagram') || f.platforms.includes('linkedin')) && html`<${Field} label="First comment (Instagram, LinkedIn)"><${Input} value=${f.firstComment} onChange=${e => set('firstComment', e.target.value)} placeholder="Extra hashtags or a link" /><//>`}
      <${Field} label="Visual brief" className="sm:col-span-2" hint=${images && images.ready ? 'What the image should show. Make image turns it into a picture; or paste it into Canva or Higgsfield.' : 'What the image or video should show — paste it into Canva, Higgsfield or brief a designer.'}><${Area} rows="2" value=${f.visual} onChange=${e => set('visual', e.target.value)} /><//>
      ${images && images.ready && html`<div className="sm:col-span-2 -mt-1 flex items-center gap-2 flex-wrap"><${Btn} small kind="ghost" onClick=${draw} disabled=${drawing || !String(f.visual || f.title).trim()}>${drawing ? 'Making image…' : '✦ Make image from brief'}</${Btn}>${images.hosting === 'local' && html`<span className="text-[11px] text-amber-700 dark:text-amber-300">Images stay on this server until CLOUDINARY_URL is set, so Buffer can't use them.</span>`}</div>`}
      <${Field} label="Video script" className="sm:col-span-2"><${Area} rows="3" value=${f.script} onChange=${e => set('script', e.target.value)} placeholder="Beats for a reel or short, with on-screen text" /><//>
      <${Field} label="Notes" className="sm:col-span-2"><${Input} value=${f.notes} onChange=${e => set('notes', e.target.value)} /><//>
    </div>
    ${warnings.length > 0 && html`<div className="mt-3 text-xs text-amber-700 dark:text-amber-300 space-y-0.5">${warnings.map(w => html`<p key=${w}>⚠ ${w}</p>`)}</div>`}
  <//>`;
}

// What happened to one account a post went to, in a few words.
function resultLine(r) {
  if (r.via === 'buffer') return r.ok ? (r.dueAt ? 'scheduled in Buffer for ' + fmtSlot(r.dueAt) : 'sent to Buffer') : r.message;
  if (r.status === 'sent') return 'posted';
  if (r.status === 'failed' || r.ok === false) return r.error || r.message || 'failed';
  if (r.status === 'cancelled') return 'cancelled';
  if (r.status === 'sending') return 'sending…';
  if (r.status === 'scheduled' && r.error) return `will try again ${fmtSlot(r.runAt)} (${r.error})`;
  if (r.status === 'scheduled') return 'goes out ' + fmtSlot(r.runAt);
  return r.status || '';
}
const resultTone = r => (r.status === 'failed' || r.ok === false ? 'text-rose-600 dark:text-rose-400' : r.status === 'sent' || (r.via === 'buffer' && r.ok) ? 'text-emerald-600 dark:text-emerald-400' : muted);
const resultIcon = r => (r.status === 'failed' || r.ok === false ? '✕' : r.status === 'sent' || (r.via === 'buffer' && r.ok) ? '✓' : '⏳');
// A post's status after publishing: scheduled while any account is still to go, then posted, or failed
// (needs attention) if any account refused it. Each account's own result stays on the post.
function statusAfter(results, when) {
  const failed = results.filter(r => r.status === 'failed' || r.ok === false);
  const waiting = results.filter(r => r.jobId && ['scheduled', 'sending'].includes(r.status));
  if (waiting.length || (when === 'scheduled' && failed.length < results.length)) return 'scheduled';
  return failed.length ? 'failed' : 'posted';
}

function PublishModal({ post, social, accounts, store, toast, onClose, onDone }) {
  const usable = (accounts.list || []).filter(a => a.enabled !== false && a.can && a.can.publish);
  const wanted = post.platforms || [];
  const matching = usable.filter(a => wanted.includes(a.provider));
  const others = usable.filter(a => !wanted.includes(a.provider));
  const saved = ((store.settings.social || {}).brandChannels || {})[post.brand] || [];
  const forBrand = a => (a.via === 'buffer' ? saved.includes(a.id.slice(7)) : (a.brands || []).includes(post.brand));
  const healthy = a => a.status !== 'error';
  // Accounts given this brand are ticked; with no brand set, a platform's only account is ticked. Trying a
  // failed post again ticks only the accounts that refused it, so the others don't get it twice.
  const before = (post.status === 'failed' && post.publish && post.publish.target === 'accounts' && post.publish.results) || null;
  const start = () => (before
    ? before.filter(r => r.status === 'failed' || r.ok === false).map(r => r.target).filter(id => usable.some(a => a.id === id))
    : matching.filter(a => healthy(a) && (forBrand(a) || (!matching.some(x => x.provider === a.provider && forBrand(x)) && matching.filter(x => x.provider === a.provider).length === 1))).map(a => a.id));
  const [target, setTarget] = useState(usable.length && social.allowed ? 'accounts' : social.webhook && social.allowed ? 'webhook' : 'manual');
  const [picked, setPicked] = useState(start);
  const [more, setMore] = useState(() => !!before && before.some(r => (r.status === 'failed' || r.ok === false) && others.some(a => a.id === r.target)));
  const future = !!post.scheduledAt && Date.parse(post.scheduledAt) > Date.now() + 60000;
  const [when, setWhen] = useState(future ? 'scheduled' : 'now');
  const [remember, setRemember] = useState(true);
  const [busy, setBusy] = useState(false);
  const [results, setResults] = useState(null);
  const firstReddit = usable.find(a => a.provider === 'reddit' && picked.includes(a.id));
  const [reddit, setReddit] = useState({ subreddit: '', title: post.title || String(post.text || '').split('\n')[0].slice(0, 300) });
  const warnings = postWarnings(post);
  const tabs = [{ v: 'accounts', l: 'Accounts' }, social.webhook && { v: 'webhook', l: 'Webhook' }, { v: 'manual', l: 'Post by hand' }].filter(Boolean);
  const toggle = id => setPicked(p => (p.includes(id) ? p.filter(x => x !== id) : [...p, id]));

  // "Use these next time": the brand is added to the ticked accounts and taken off the unticked ones shown here.
  const rememberChoice = async () => {
    const shown = [...matching, ...(more ? others : [])];
    const latest = store.latestSettings();
    const socialSettings = latest.social || { brandChannels: {} };
    const bufferIds = shown.filter(a => a.via === 'buffer').map(a => a.id.slice(7));
    const keep = ((socialSettings.brandChannels || {})[post.brand] || []).filter(id => !bufferIds.includes(id));
    const chosen = picked.filter(id => id.startsWith('buffer:')).map(id => id.slice(7));
    if (bufferIds.length) await store.saveSettings({ ...latest, social: { ...socialSettings, brandChannels: { ...(socialSettings.brandChannels || {}), [post.brand]: [...keep, ...chosen] } } });
    for (const a of shown.filter(x => x.via !== 'buffer')) {
      const has = (a.brands || []).includes(post.brand);
      const want = picked.includes(a.id);
      if (has !== want) await window.SoulveeOS.accounts.update(a.id, { brands: want ? [...(a.brands || []), post.brand] : (a.brands || []).filter(b => b !== post.brand) }).catch(() => {});
    }
  };

  const send = async () => {
    setBusy(true);
    const base = { id: post.id, brand: post.brand, title: post.title, text: post.text, media: post.media || [], platforms: post.platforms || [], scheduledAt: when === 'scheduled' ? post.scheduledAt : null, igType: post.igType || '', firstComment: post.firstComment || '', ytCategory: post.ytCategory || YT_CATEGORY[post.brand] || '22', aiAssisted: !!post.aiAssisted };
    try {
      const at = new Date().toISOString();
      if (target === 'webhook') {
        const out = await window.SoulveeOS.social.publish(base, 'webhook');
        await onDone({ status: 'scheduled', publish: { target, at, when, jobId: out.job.id, runAt: out.job.runAt } });
        toast(when === 'now' ? 'Sent to your webhook' : 'Queued — Soulvee OS sends it at the scheduled time');
        onClose();
      }
      if (target === 'accounts') {
        const out = await window.SoulveeOS.social.publish({ ...base, targets: picked, subreddit: firstReddit ? reddit.subreddit : '', redditTitle: firstReddit ? reddit.title : '' }, 'accounts');
        setResults(out.results);
        if (remember) await rememberChoice();
        const status = statusAfter(out.results, when);
        await onDone({ status, ...(status === 'posted' ? { postedAt: at } : {}), publish: { target, at, when, results: out.results } });
        const bad = out.results.filter(r => r.status === 'failed' || r.ok === false).length;
        if (!bad) { toast(when === 'now' ? (status === 'posted' ? `Posted to ${out.results.length} account${out.results.length === 1 ? '' : 's'}` : 'Sending — results appear on the post') : `Scheduled for ${out.results.length} account${out.results.length === 1 ? '' : 's'}`); onClose(); }
      }
    } catch (e) { toast(e.message); }
    setBusy(false);
  };

  const row = a => html`<label key=${a.id} className="flex items-center gap-2 text-sm p-2 rounded-xl bg-slate-50 dark:bg-white/5">
    <input type="checkbox" aria-label=${accountName(a) + ' on ' + networkOf(a.provider).name} disabled=${!healthy(a)} checked=${picked.includes(a.id)} onChange=${() => toggle(a.id)} />
    ${a.avatar ? html`<img src=${a.avatar} alt="" className="w-6 h-6 rounded-full shrink-0" />` : html`<${NetBadge} id=${a.provider} />`}
    <span className="flex-1 min-w-0 truncate">${accountName(a)} <span className=${muted}>· ${networkOf(a.provider).name}${a.via === 'buffer' ? ' via Buffer' : ''}${KIND[a.kind] && a.via !== 'buffer' ? ' ' + KIND[a.kind].toLowerCase() : ''}</span></span>
    ${!healthy(a) && html`<${Pill} tone="red">needs attention</${Pill}>`}${(a.brands || []).includes(post.brand) && html`<${BrandChip} id=${post.brand} />`}
  </label>`;

  const footer = target === 'manual'
    ? html`<${Btn} kind="ghost" onClick=${onClose}>Close</${Btn}><${Btn} kind="good" onClick=${async () => { await onDone({ status: 'posted', postedAt: new Date().toISOString(), publish: { target: 'manual', at: new Date().toISOString() } }); toast('Marked as posted'); onClose(); }}>I've posted it</${Btn}>`
    : html`<${Btn} kind="ghost" onClick=${onClose}>${results ? 'Close' : 'Cancel'}</${Btn}><${Btn} onClick=${send} disabled=${busy || !social.allowed || (target === 'accounts' && !picked.length)}>${busy ? 'Sending…' : target === 'accounts' ? (when === 'now' ? `Post now to ${picked.length || ''} account${picked.length === 1 ? '' : 's'}` : `Schedule for ${picked.length || ''} account${picked.length === 1 ? '' : 's'}`) : (when === 'now' ? 'Send to webhook now' : 'Queue for webhook')}</${Btn}>`;

  return html`<${Modal} title=${'Publish · ' + (post.title || 'post')} onClose=${onClose} footer=${footer}>
    <div className="space-y-4">
      <${Chips} value=${target} onChange=${setTarget} options=${tabs} />
      ${!social.allowed && target !== 'manual' && html`<p className="text-xs text-amber-700 dark:text-amber-300">Publishing is locked here. Open Soulvee OS on the computer that runs it, or set SOULVEE_ACCESS_TOKEN on the server and open the app once with ?token=YOUR_TOKEN.</p>`}
      ${target !== 'manual' && html`<div className="flex flex-wrap gap-4 text-sm">
        ${future && html`<label className="flex items-center gap-2"><input type="radio" name="when" checked=${when === 'scheduled'} onChange=${() => setWhen('scheduled')} /> ${fmtSlot(post.scheduledAt)}</label>`}
        <label className="flex items-center gap-2"><input type="radio" name="when" checked=${when === 'now'} onChange=${() => setWhen('now')} /> Now</label>
        ${!future && html`<span className=${'text-xs ' + muted}>Set a date and time on the post to schedule it.</span>`}
      </div>`}
      ${target === 'accounts' && html`<div className="space-y-2">
        ${accounts.error && html`<p className="text-xs text-rose-600 dark:text-rose-400">${accounts.error}</p>`}
        ${!usable.length && html`<p className="text-sm text-amber-700 dark:text-amber-300">No accounts can post yet. Connect your Pages and profiles in Accounts (or add BUFFER_API_KEY for Buffer).</p>`}
        ${usable.length > 0 && !matching.length && html`<p className="text-sm text-amber-700 dark:text-amber-300">None of your accounts are on this post's platforms (${wanted.map(id => platformOf(id).name).join(', ')}). Pick from your other accounts below, or change the platforms.</p>`}
        ${matching.length > 0 && html`<div className="space-y-1.5">${matching.map(row)}</div>`}
        ${others.length > 0 && (more ? html`<p className=${'text-xs font-medium pt-1 ' + muted}>Other accounts</p><div className="space-y-1.5">${others.map(row)}</div>` : html`<button className="text-xs text-violet-500 font-medium" onClick=${() => setMore(true)}>+ ${others.length} other account${others.length === 1 ? '' : 's'}</button>`)}
        ${firstReddit && html`<div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
          <${Field} label="Reddit title"><${Input} value=${reddit.title} onChange=${e => setReddit(p => ({ ...p, title: e.target.value }))} /><//>
          <${Field} label="Subreddit" hint=${'Blank uses ' + ((firstReddit.options || {}).subreddit ? 'r/' + firstReddit.options.subreddit : 'your profile')}><${Input} value=${reddit.subreddit} onChange=${e => setReddit(p => ({ ...p, subreddit: e.target.value }))} placeholder="e.g. afrobeats" /><//>
        </div>`}
        ${usable.length > 0 && html`<label className="flex items-center gap-2 text-xs"><input type="checkbox" checked=${remember} onChange=${e => setRemember(e.target.checked)} /> Use these accounts for ${brandOf(post.brand).short} next time</label>`}
      </div>`}
      ${target === 'webhook' && html`<p className=${'text-sm ' + muted}>Soulvee OS sends this post to your Make, Zapier or n8n webhook ${when === 'now' ? 'straight away' : 'at the scheduled time'}, and that scenario posts it. The server must be running then.</p>`}
      ${target === 'manual' && html`<div className="space-y-3">
        <textarea readOnly rows="6" className=${inputCls + ' text-xs'} value=${post.text} onFocus=${e => e.target.select()}></textarea>
        <div className="flex flex-wrap gap-2"><${Btn} small onClick=${() => copyText(post.text, toast)}>Copy caption</${Btn}>${(post.platforms || []).map(id => html`<a key=${id} href=${shareLink(id, post.text, post.title)} target="_blank" rel="noopener" className="px-3 py-1.5 text-xs rounded-xl bg-slate-100 dark:bg-white/10 font-medium">Open ${platformOf(id).name}</a>`)}</div>
        ${(post.media || []).length > 0 && html`<div className="text-xs space-y-1">${post.media.map((m, i) => html`<a key=${i} href=${m.url} target="_blank" rel="noopener" className="block truncate text-violet-500">${m.type}: ${m.url}</a>`)}</div>`}
        <p className=${'text-xs ' + muted}>X, Threads, LinkedIn, Telegram, WhatsApp and Reddit open with the text filled in. For the others, copy the caption first.</p>
      </div>`}
      ${warnings.length > 0 && target !== 'manual' && html`<div className="text-xs text-amber-700 dark:text-amber-300 space-y-0.5">${warnings.map(w => html`<p key=${w}>⚠ ${w}</p>`)}</div>`}
      ${results && html`<div className="space-y-1">${results.map(r => html`<p key=${r.target} className=${'text-xs ' + resultTone(r)}>${resultIcon(r)} ${r.name || r.target}${r.provider ? ' (' + networkOf(r.provider).name + ')' : ''}: ${resultLine(r)}${r.url ? html` · <a href=${r.url} target="_blank" rel="noopener" className="underline">view</a>` : null}</p>`)}</div>`}
    </div>
  <//>`;
}

function ContentView({ store, caps, toast, prefill, clearPrefill, onImport }) {
  const { data, add, update, remove } = store;
  const ref = useRef(store); ref.current = store;
  const [social, setSocial] = useState(null);
  const [accts, setAccts] = useState({ list: [], error: '' });
  const [filter, setFilter] = useState('active');
  const [brand, setBrand] = useState('all');
  const [editing, setEditing] = useState(null);
  const [publishing, setPublishing] = useState(null);
  const [gen, setGen] = useState({ brand: 'dj', goal: '', platforms: ['instagram', 'tiktok'], count: '5', offerId: '' });
  const [busy, setBusy] = useState(false);
  const [server, setServer] = useState(null);
  const [insights, setInsights] = useState(() => (store.settings.social || {}).insights || null);
  const [insBusy, setInsBusy] = useState(false);
  const [useResults, setUseResults] = useState(true);
  const [withImages, setWithImages] = useState(false);
  const [drawing, setDrawing] = useState({});
  const images = server && server.images;

  useEffect(() => { window.SoulveeOS.health().then(setServer, () => setServer({})); }, []);
  useEffect(() => { if (prefill) { setGen(g => ({ ...g, ...prefill })); clearPrefill(); window.scrollTo({ top: 0 }); } }, [prefill]);
  useEffect(() => {
    let alive = true;
    window.SoulveeOS.social.status().then(s => {
      if (!alive) return;
      setSocial(s);
      if (s.allowed) window.SoulveeOS.accounts.list(false).then(r => { if (alive) setAccts({ list: [...r.accounts.filter(a => a.can && a.can.publish), ...r.buffer], error: r.bufferError || '' }); }, e => { if (alive) setAccts({ list: [], error: e.message }); });
    }, () => { if (alive) setSocial({ buffer: false, webhook: false, allowed: false, offline: true }); });
    return () => { alive = false; };
  }, []);

  // Webhook and account posts: follow each queued job until the server has posted it (or given up).
  const jobsOf = p => (p.publish && p.publish.jobId ? [p.publish.jobId] : ((p.publish && p.publish.results) || []).filter(r => r.jobId && ['scheduled', 'sending'].includes(r.status)).map(r => r.jobId));
  const pendingKey = data.content.filter(p => p.status === 'scheduled').flatMap(jobsOf).join(',');
  useEffect(() => {
    if (!pendingKey) return undefined;
    const check = () => window.SoulveeOS.social.jobs(pendingKey.split(',')).then(r => {
      const byId = Object.fromEntries(r.jobs.map(j => [j.id, j]));
      ref.current.data.content.filter(p => p.status === 'scheduled' && jobsOf(p).some(id => byId[id])).forEach(p => {
        if (p.publish.jobId) {
          const j = byId[p.publish.jobId];
          if (j.status === 'sent') ref.current.update('content', p.id, { status: 'posted', postedAt: j.sentAt });
          if (j.status === 'failed') ref.current.update('content', p.id, { status: 'failed', publish: { ...p.publish, error: j.error } });
          if (j.status === 'cancelled') ref.current.update('content', p.id, { status: 'approved' });
          return;
        }
        const results = p.publish.results.map(x => (x.jobId && byId[x.jobId] ? { ...x, ...byId[x.jobId], ok: byId[x.jobId].status !== 'failed' } : x));
        if (JSON.stringify(results) === JSON.stringify(p.publish.results)) return;
        const done = !results.some(x => x.jobId && ['scheduled', 'sending'].includes(x.status)) && (!p.publish.when || p.publish.when === 'now' || !p.scheduledAt || Date.parse(p.scheduledAt) <= Date.now());
        const status = !done ? 'scheduled' : results.every(x => x.status === 'cancelled') ? 'approved' : results.some(x => x.status === 'failed' || x.ok === false) ? 'failed' : 'posted';
        ref.current.update('content', p.id, { status, ...(status === 'posted' ? { postedAt: results.map(x => x.sentAt).filter(Boolean).sort().pop() || new Date().toISOString() } : {}), publish: { ...p.publish, results } });
      });
    }, () => {});
    check();
    const timer = setInterval(check, 15000);
    return () => clearInterval(timer);
  }, [pendingKey]);

  const brandOffers = data.offers.filter(o => o.brand === gen.brand && o.status !== 'retired');
  const recentTitles = b => data.content.filter(p => p.brand === b).sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt))).slice(0, 15).map(p => p.title).filter(Boolean);

  // Makes an image from a post's visual brief and adds it to the post.
  const makeImage = async p => {
    setDrawing(m => ({ ...m, [p.id]: true }));
    const ok = await window.SoulveeOS.images.generate({ brand: p.brand, visual: p.visual, format: p.format, platforms: p.platforms, title: p.title }).then(async r => {
      const latest = ref.current.data.content.find(x => x.id === p.id) || p;
      await ref.current.update('content', p.id, { media: [...(latest.media || []), { type: 'image', url: r.media.url }] });
      return true;
    }, e => { toast(e.message); return false; });
    setDrawing(m => { const next = { ...m }; delete next[p.id]; return next; });
    return ok;
  };
  const makeImages = async list => {
    for (const [i, p] of list.entries()) {
      toast(`Making images ${i + 1} of ${list.length}…`);
      if (!(await makeImage(p))) return;
    }
    if (list.length) toast(`${list.length} image${list.length === 1 ? '' : 's'} added`);
  };

  // Reads results from Buffer, keeps a summary for the AI, and puts the numbers on matching posts.
  const loadInsights = async refresh => {
    setInsBusy(true);
    try {
      const r = await window.SoulveeOS.social.insights(TZ, refresh);
      const keep = { learnings: r.learnings, at: r.updatedAt, count: r.count, platforms: r.platforms, bestHour: r.bestHour, top: r.posts.slice(0, 5) };
      setInsights(keep);
      const latest = store.latestSettings();
      await store.saveSettings({ ...latest, social: { ...(latest.social || {}), insights: keep } });
      const byId = {};
      r.posts.forEach(x => { byId[x.id] = x; });
      for (const p of ref.current.data.content) {
        const hits = ((p.publish && p.publish.results) || []).filter(x => x.ok && byId[x.postId]).map(x => byId[x.postId]);
        if (!hits.length) continue;
        const rates = hits.filter(h => h.rate !== null).map(h => h.rate);
        const metrics = { rate: rates.length ? Math.max(...rates) : null, seen: hits.reduce((t, h) => t + (h.seen || 0), 0), reactions: hits.reduce((t, h) => t + (h.metrics.reactions || 0), 0), comments: hits.reduce((t, h) => t + (h.metrics.comments || 0), 0), at: r.updatedAt };
        await ref.current.update('content', p.id, { metrics, ...(p.status === 'scheduled' ? { status: 'posted', postedAt: hits[0].sentAt || new Date().toISOString() } : {}) });
      }
      toast(r.count ? `Results read from ${r.count} Buffer post${r.count === 1 ? '' : 's'}` : 'No results yet — Buffer collects them about a day after posting');
    } catch (e) { toast(e.message); }
    setInsBusy(false);
  };

  const generate = async () => {
    if (!caps.sample || busy) return;
    const offer = data.offers.find(o => o.id === gen.offerId);
    const count = Math.max(1, Math.min(14, Math.round(num(gen.count)) || 5));
    const platforms = gen.platforms.length ? gen.platforms : ['instagram'];
    const learnings = useResults && insights && insights.learnings ? insights.learnings : '';
    setBusy(true);
    try {
      const prompt = SHARED.contentPrompt({ brand: gen.brand, goal: gen.goal, offer, platforms, count, firstDay: 0, lastDay: 13, today: new Date(), tz: TZ, learnings, recent: recentTitles(gen.brand) });
      const v = await askJSON(caps.sample, prompt, CONTENT_SCHEMA, 'medium');
      const items = (Array.isArray(v.posts) ? v.posts : []).slice(0, 14);
      const created = [];
      for (const p of items) created.push(await add('content', SHARED.draftFromAi(p, { brand: gen.brand, platforms, tz: TZ, firstDay: 0, lastDay: 13, source: offer ? { type: 'offer', id: offer.id, label: offer.name } : { type: 'topic', label: gen.goal.trim() } })));
      toast(items.length ? `${items.length} drafts added — review and approve them below` : 'The AI returned no posts. Try again.');
      setFilter('active');
      setBusy(false);
      if (withImages && images && images.ready) await makeImages(created.filter(d => String(d.visual || '').trim()));
      return;
    } catch (e) { toast(sampleMessage(e)); }
    setBusy(false);
  };

  const savePost = async v => {
    if (editing && editing.id) await update('content', editing.id, v);
    else await add('content', { aiAssisted: false, ...v });
    setEditing(null);
    toast('Post saved');
  };
  const cancelJob = async p => {
    try {
      for (const id of jobsOf(p)) await window.SoulveeOS.social.cancel(id).catch(e => { if (p.publish.jobId) throw e; });
      await update('content', p.id, { status: 'approved', ...(p.publish.results ? { publish: { ...p.publish, results: p.publish.results.map(r => (r.jobId && r.status === 'scheduled' ? { ...r, status: 'cancelled' } : r)) } } : {}) });
      toast('Scheduled post cancelled');
    } catch (e) { toast(e.message); }
  };

  const visible = data.content.filter(p => (brand === 'all' || p.brand === brand) && (filter === 'all' || (filter === 'posted' ? p.status === 'posted' : p.status !== 'posted')));
  const sorted = [...visible].sort((a, b) => String(a.scheduledAt || '9999').localeCompare(String(b.scheduledAt || '9999')) || String(a.createdAt).localeCompare(String(b.createdAt)));
  const groups = [];
  sorted.forEach(p => {
    const key = p.scheduledAt ? localDate(new Date(p.scheduledAt)) : '';
    const last = groups[groups.length - 1];
    if (last && last.key === key) last.items.push(p);
    if (!last || last.key !== key) groups.push({ key, items: [p] });
  });
  const dayLabel = key => !key ? 'Not scheduled yet' : key === localDate() ? 'Today' : key === addDays(localDate(), 1) ? 'Tomorrow' : new Date(key + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
  const counts = POST_STATUS.map(st => ({ st, n: data.content.filter(p => p.status === st).length }));
  const direct = accts.list.filter(a => a.via !== 'buffer').length;
  const viaBuffer = accts.list.filter(a => a.via === 'buffer').length;
  const connection = !social ? 'Checking publishing…' : social.offline ? 'Server unreachable — copy and post by hand' : [direct && `${direct} connected account${direct === 1 ? '' : 's'}`, viaBuffer && `${viaBuffer} Buffer channel${viaBuffer === 1 ? '' : 's'}`, social.webhook && 'Webhook'].filter(Boolean).join(' + ') || 'Copy and post by hand (connect accounts in Accounts)';

  return html`<div className="space-y-6">
    <${Section} title="Content Studio" sub="Plan, write and publish posts for every brand — AI drafts, you approve." action=${html`<${Btn} small onClick=${() => setEditing({ brand: gen.brand, platforms: gen.platforms.length ? gen.platforms : ['instagram'] })}>+ Post</${Btn}>`}>
      <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">${counts.map(c => html`<div key=${c.st} className="rounded-xl p-3 bg-white border border-slate-200 dark:bg-white/[0.04] dark:border-white/10 text-center"><p className="text-lg font-bold">${c.n}</p><p className=${'text-[11px] capitalize ' + muted}>${c.st}</p></div>`)}</div>
      <p className=${'text-xs ' + muted}>Publishing: <span className="font-medium">${connection}</span>${accts.error ? html` · <span className="text-rose-500">${accts.error}</span>` : ''}</p>
    <//>

    <${Card} className="glow">
      <p className="font-semibold text-sm mb-1">✦ AI content generator</p>
      <p className=${'text-xs mb-3 ' + muted}>Writes captions, hashtags, visual briefs and video scripts in the brand's voice, and spreads them over the next two weeks. Everything lands as a draft for you to check.</p>
      ${caps.sample === null ? html`<p className="text-sm text-amber-600 dark:text-amber-400">${aiOffText()} You can still write posts by hand with + Post.</p>` : html`
      <div className="grid sm:grid-cols-3 gap-3">
        <${Field} label="Brand"><${Select} value=${gen.brand} onChange=${v => setGen({ ...gen, brand: v, offerId: '' })} options=${brandOptions} /><//>
        <${Field} label="Goal or topic" className="sm:col-span-2"><${Input} value=${gen.goal} onChange=${e => setGen({ ...gen, goal: e.target.value })} placeholder="e.g. Fill my December wedding bookings" /><//>
        <${Field} label="Promote an offer (optional)"><${Select} value=${gen.offerId} onChange=${v => setGen({ ...gen, offerId: v })} options=${[{ v: '', l: '— none —' }, ...brandOffers.map(o => ({ v: o.id, l: o.name }))]} /><//>
        <${Field} label="How many posts"><${Select} value=${String(gen.count)} onChange=${v => setGen({ ...gen, count: v })} options=${['3', '5', '7', '10', '14']} /><//>
        <div className="sm:col-span-3"><span className=${'block text-xs font-medium mb-1 ' + muted}>Platforms</span><${PlatformToggles} value=${gen.platforms} onChange=${v => setGen({ ...gen, platforms: v })} /></div>
      </div>
      <div className="mt-3 flex flex-wrap gap-4 text-xs">
        ${insights && insights.learnings && html`<label className="flex items-center gap-2"><input type="checkbox" checked=${useResults} onChange=${e => setUseResults(e.target.checked)} /> Use what's working (${insights.count} posts)</label>`}
        ${images && images.ready && html`<label className="flex items-center gap-2"><input type="checkbox" checked=${withImages} onChange=${e => setWithImages(e.target.checked)} /> Make an image for each post</label>`}
      </div>
      <div className="mt-3 flex gap-2 flex-wrap">
        <${Btn} onClick=${generate} disabled=${busy || !gen.platforms.length}>${busy ? 'Writing posts…' : 'Generate posts'}</${Btn}>
        <button type="button" onClick=${() => setGen({ ...gen, goal: 'Plan a full week of content: one post a day', count: '7' })} className="text-xs px-3 py-1.5 rounded-full bg-slate-100 dark:bg-white/10">Plan my week</button>
        <button type="button" onClick=${() => setGen({ ...gen, brand: 'dj', goal: 'Announce my next gig and get people to come out', count: '3', platforms: ['instagram', 'tiktok', 'x'] })} className="text-xs px-3 py-1.5 rounded-full bg-slate-100 dark:bg-white/10">Gig announcement</button>
        <button type="button" onClick=${() => setGen({ ...gen, brand: 'smc', goal: 'Show Lagos restaurants and hotels how AI automation saves them time and money', count: '5', platforms: ['linkedin', 'instagram', 'x'] })} className="text-xs px-3 py-1.5 rounded-full bg-slate-100 dark:bg-white/10">SMC thought leadership</button>
      </div>`}
    <//>

    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
      <${AutopilotCard} store=${store} toast=${toast} images=${images} onImport=${onImport} />
      <${ResultsCard} insights=${insights} social=${social} busy=${insBusy} onRefresh=${() => loadInsights(true)} />
    </div>

    <${Section} title="Content plan" action=${html`<${Chips} value=${filter} onChange=${setFilter} options=${[{ v: 'active', l: 'To do' }, { v: 'posted', l: 'Posted' }, { v: 'all', l: 'All' }]} />`}>
      <${Chips} value=${brand} onChange=${setBrand} options=${[{ v: 'all', l: 'All brands' }, ...BRANDS.map(b => ({ v: b.id, l: b.short }))]} />
      ${groups.length === 0 ? html`<${Card}><${Empty} title="Nothing planned yet">Generate posts above, or write one with + Post.<//><//>` : groups.map(g => html`<div key=${g.key || 'none'} className="space-y-2">
        <p className=${'text-xs font-semibold uppercase tracking-wide ' + muted}>${dayLabel(g.key)}</p>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">${g.items.map(p => {
          const warn = postWarnings(p);
          const res = (p.publish && p.publish.results) || [];
          const img = (p.media || []).find(m => m.type === 'image');
          return html`<${Card} key=${p.id}>
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <p className="font-semibold truncate">${p.title || 'Untitled post'}</p>
                <div className="flex gap-1.5 mt-1 flex-wrap"><${BrandChip} id=${p.brand} /><${Pill} tone=${STATUS_TONE[p.status] || 'slate'}>${p.status}</${Pill}>${(p.platforms || []).map(id => html`<${Pill} key=${id}>${platformOf(id).name}</${Pill}>`)}</div>
              </div>
              <div className="text-right shrink-0 text-[11px]">${p.scheduledAt ? html`<p className="font-semibold">${hhmm(new Date(p.scheduledAt))}</p>` : null}${p.autopilot ? html`<p className="text-violet-600 dark:text-violet-300">Autopilot</p>` : p.aiAssisted && html`<p className=${muted}>AI draft</p>`}</div>
            </div>
            <div className="flex gap-3 mt-2">
              ${img && html`<img src=${img.url} alt="" className="w-16 h-16 rounded-xl object-cover shrink-0 bg-slate-100 dark:bg-white/10" />`}
              <p className="text-xs whitespace-pre-wrap line-clamp-4 flex-1 min-w-0">${p.text}</p>
            </div>
            ${p.metrics && html`<p className="text-[11px] mt-2 font-medium text-emerald-600 dark:text-emerald-400">📈 ${[p.metrics.rate !== null && p.metrics.rate !== undefined ? p.metrics.rate + '% engagement' : '', p.metrics.seen ? fmtCount(p.metrics.seen) + ' reached' : '', p.metrics.reactions ? p.metrics.reactions + ' reactions' : '', p.metrics.comments ? p.metrics.comments + ' comments' : ''].filter(Boolean).join(' · ') || 'No numbers yet'}</p>`}
            ${p.visual && html`<p className=${'text-[11px] mt-2 line-clamp-2 ' + muted}><span className="font-semibold">Visual:</span> ${p.visual}</p>`}
            ${warn.length > 0 && p.status !== 'posted' && html`<p className="text-[11px] mt-2 text-amber-700 dark:text-amber-300">⚠ ${warn.join(' · ')}</p>`}
            ${p.status === 'scheduled' && p.publish && p.publish.target !== 'accounts' && html`<p className=${'text-[11px] mt-2 ' + muted}>${p.publish.target === 'buffer' ? `In Buffer · ${res.filter(r => r.ok).length}/${res.length} channels${p.publish.when === 'now' ? ' · posting now' : ''}` : `Webhook · ${p.publish.when === 'now' ? 'sending now' : 'sends ' + fmtSlot(p.publish.runAt || p.scheduledAt)}`}</p>`}
            ${p.publish && p.publish.target === 'accounts' && html`<div className="text-[11px] mt-2 space-y-0.5">${res.map(r => html`<p key=${r.target} className=${resultTone(r)}>${resultIcon(r)} ${r.name || r.target}${r.provider ? ' · ' + networkOf(r.provider).name : ''}: ${resultLine(r)}${r.url ? html` · <a href=${r.url} target="_blank" rel="noopener" className="underline">view</a>` : null}</p>`)}</div>`}
            ${p.publish && p.publish.target !== 'accounts' && (p.status === 'failed' || res.some(r => !r.ok)) && html`<div className="text-[11px] mt-2 text-rose-600 dark:text-rose-400">${res.filter(r => !r.ok).map(r => html`<p key=${r.channelId}>✕ ${r.name || SERVICE_LABEL[r.service] || r.channelId}: ${r.message}</p>`)}${p.publish && p.publish.error ? html`<p>✕ ${p.publish.error}</p>` : null}</div>`}
            <div className="flex gap-2 mt-3 flex-wrap">
              ${['idea', 'draft'].includes(p.status) && html`<${Btn} small onClick=${() => update('content', p.id, { status: 'approved' })}>Approve</${Btn}>`}
              ${['approved', 'failed'].includes(p.status) && html`<${Btn} small onClick=${() => setPublishing(p)}>${p.status === 'failed' ? 'Try again' : 'Publish…'}</${Btn}>`}
              ${p.status === 'scheduled' && p.publish && jobsOf(p).length > 0 && html`<${Btn} small kind="ghost" onClick=${() => cancelJob(p)}>Cancel</${Btn}>`}
              ${p.status === 'scheduled' && p.publish && p.publish.target === 'buffer' && html`<a href="https://publish.buffer.com" target="_blank" rel="noopener" className="px-3 py-1.5 text-xs rounded-xl bg-slate-100 dark:bg-white/10 font-medium">Open Buffer</a>`}
              ${p.status === 'scheduled' && html`<${Btn} small kind="good" onClick=${() => update('content', p.id, { status: 'posted', postedAt: new Date().toISOString() })}>Mark posted</${Btn}>`}
              ${images && images.ready && !(p.media || []).length && String(p.visual || '').trim() && p.status !== 'posted' && html`<${Btn} small kind="ghost" onClick=${() => makeImage(p)} disabled=${!!drawing[p.id]}>${drawing[p.id] ? 'Making image…' : 'Make image'}</${Btn}>`}
              <${Btn} small kind="ghost" onClick=${() => copyText(p.text, toast)}>Copy</${Btn}>
              <${Btn} small kind="ghost" onClick=${() => setEditing(p)}>Edit</${Btn}>
              ${p.status === 'posted' && html`<${Btn} small kind="ghost" onClick=${async () => { await add('content', { ...p, id: undefined, createdAt: undefined, status: 'draft', scheduledAt: '', publish: null, postedAt: null, title: (p.title || 'Post') + ' (again)' }); toast('Copied as a new draft'); }}>Reuse</${Btn}>`}
              <${Btn} small kind="danger" onClick=${() => sure(`the post "${p.title || 'untitled'}"`) && remove('content', p.id)}>Delete</${Btn}>
            </div>
          <//>`;
        })}</div>
      </div>`)}
    <//>
    ${editing && html`<${PostModal} post=${editing} caps=${caps} toast=${toast} images=${images} onClose=${() => setEditing(null)} onSave=${savePost} />`}
    ${publishing && social && html`<${PublishModal} post=${publishing} social=${social} accounts=${accts} store=${store} toast=${toast} onClose=${() => setPublishing(null)} onDone=${patch => update('content', publishing.id, patch)} />`}
  </div>`;
}

/* ---------------- Autopilot and results ---------------- */
const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const ZONES = ['Africa/Lagos', 'Europe/London', 'America/New_York', 'Asia/Dubai', 'UTC'];
// A moment shown on the autopilot's own clock (it runs on that time zone, wherever this device is).
const fmtIn = (iso, tz) => { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString('en-GB', { timeZone: tz || TZ, weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const fmtCount = n => Number(n || 0) >= 1000 ? (Math.round(Number(n) / 100) / 10).toLocaleString('en-NG') + 'K' : String(Math.round(Number(n || 0)));

// What autopilot needs to know when it runs on the server: live offers and recent post titles per brand.
function autopilotContext(store) {
  const offers = store.data.offers.filter(o => o.status !== 'retired').map(o => ({ id: o.id, brand: o.brand, name: o.name, pitch: o.pitch || '', tiers: (o.tiers || []).map(t => ({ name: t.name, price: num(t.price) })) }));
  const recent = {};
  BRANDS.forEach(b => { recent[b.id] = store.data.content.filter(p => p.brand === b.id).sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt))).slice(0, 30).map(p => p.title).filter(Boolean); });
  return { offers, recent };
}

function AutopilotCard({ store, toast, images, onImport }) {
  const [st, setSt] = useState(null);
  const [f, setF] = useState(null);
  const [busy, setBusy] = useState('');
  const formFrom = s => ({
    enabled: !!s.enabled, day: String(s.day), time: s.time, timezone: s.timezone, learn: s.learn !== false, notify: s.notify !== false,
    plans: (s.plans && s.plans.length ? s.plans : [{ brand: 'dj', count: 5, platforms: ['instagram', 'tiktok'], goal: '', offerId: '', images: !!(images && images.ready), enabled: true }]).map(p => ({ ...p, count: String(p.count) })),
  });
  const load = async () => {
    const s = await window.SoulveeOS.autopilot.status().catch(e => ({ allowed: false, error: e.message }));
    setSt(s);
    if (s.allowed) setF(prev => prev || formFrom(s));
    return s;
  };
  useEffect(() => { load(); }, []);
  // Follow a run until it finishes, then bring its drafts into the plan.
  const running = !!(st && st.running);
  useEffect(() => {
    if (!running) return undefined;
    const timer = setInterval(async () => {
      const s = await load();
      if (s && s.allowed && !s.running) { clearInterval(timer); await onImport(); }
    }, 1500);
    return () => clearInterval(timer);
  }, [running]);

  const setPlan = (i, k, v) => setF(p => ({ ...p, plans: p.plans.map((x, j) => j === i ? { ...x, [k]: v } : x) }));
  const payload = enabled => ({ ...f, enabled, day: num(f.day), plans: f.plans.map(p => ({ ...p, count: num(p.count) })) });
  const save = async enabled => {
    setBusy('save');
    try {
      await window.SoulveeOS.autopilot.context(autopilotContext(store));
      const s = await window.SoulveeOS.autopilot.save(payload(enabled));
      setSt({ allowed: true, ...s });
      setF(formFrom(s));
      toast(s.enabled ? `Autopilot is on — next run ${fmtIn(s.nextRun, s.timezone)}` : 'Autopilot settings saved (it is off)');
    } catch (e) { toast(e.message); }
    setBusy('');
  };
  const runNow = async () => {
    setBusy('run');
    try {
      await window.SoulveeOS.autopilot.context(autopilotContext(store));
      await window.SoulveeOS.autopilot.save(payload(f.enabled));
      const s = await window.SoulveeOS.autopilot.run();
      setSt({ allowed: true, ...s });
      toast('Autopilot is writing posts — they appear below when it finishes');
    } catch (e) { toast(e.message); }
    setBusy('');
  };

  const res = st && st.lastResult;
  return html`<${Card}>
    <div className="flex items-center justify-between gap-2 flex-wrap">
      <p className="font-semibold text-sm">⟳ Autopilot ${st && st.allowed ? html`<${Pill} tone=${st.enabled ? 'green' : 'slate'}>${st.enabled ? 'on' : 'off'}</${Pill}>` : null}</p>
      ${f && st && st.allowed && st.ready && html`<${Btn} small kind=${f.enabled ? 'ghost' : 'primary'} onClick=${() => save(!f.enabled)} disabled=${!!busy || running}>${f.enabled ? 'Turn off' : 'Turn on'}</${Btn}>`}
    </div>
    <p className=${'text-xs mt-1 ' + muted}>Every week it drafts the coming week's posts for the brands below, with images if you like, learning from your Buffer results. Drafts appear here for you to approve. Nothing is posted until you do.</p>
    ${!st && html`<p className=${'text-xs mt-3 ' + muted}>Checking…</p>`}
    ${st && !st.allowed && html`<p className="text-xs mt-3 text-amber-700 dark:text-amber-300">${st.error || 'Autopilot can only be set up from the computer running Soulvee OS, or with SOULVEE_ACCESS_TOKEN set and the app opened once with ?token=YOUR_TOKEN.'}</p>`}
    ${st && st.allowed && !st.ready && html`<p className="text-xs mt-3 text-amber-700 dark:text-amber-300">Autopilot needs AI: add ANTHROPIC_API_KEY to the server and restart it.</p>`}
    ${f && st && st.allowed && html`<div className="mt-3 space-y-3">
      <div className="flex flex-wrap items-center gap-2 text-sm">
        <span>Every</span>
        <select className=${inputCls + ' !w-auto'} aria-label="Autopilot day" value=${f.day} onChange=${e => setF({ ...f, day: e.target.value })}>${DAY_NAMES.map((d, i) => html`<option key=${d} value=${String(i)}>${d}</option>`)}</select>
        <span>at</span>
        <input type="time" aria-label="Autopilot time" className=${inputCls + ' !w-auto'} value=${f.time} onChange=${e => setF({ ...f, time: e.target.value })} />
        <select className=${inputCls + ' !w-auto'} aria-label="Autopilot time zone" value=${f.timezone} onChange=${e => setF({ ...f, timezone: e.target.value })}>${[...new Set([f.timezone, ...ZONES])].map(z => html`<option key=${z} value=${z}>${z}</option>`)}</select>
      </div>
      <div className="space-y-2">${f.plans.map((p, i) => html`<div key=${i} className="p-3 rounded-xl bg-slate-50 dark:bg-white/5 space-y-2" data-plan=${i}>
        <div className="grid sm:grid-cols-3 gap-2">
          <select className=${inputCls} aria-label="Plan brand" value=${p.brand} onChange=${e => { setPlan(i, 'brand', e.target.value); setPlan(i, 'offerId', ''); }}>${BRANDS.map(b => html`<option key=${b.id} value=${b.id}>${b.name}</option>`)}</select>
          <select className=${inputCls} aria-label="Posts per week" value=${p.count} onChange=${e => setPlan(i, 'count', e.target.value)}>${['3', '5', '7', '10', '14'].map(n => html`<option key=${n} value=${n}>${n} posts a week</option>`)}</select>
          <select className=${inputCls} aria-label="Plan offer" value=${p.offerId || ''} onChange=${e => setPlan(i, 'offerId', e.target.value)}><option value="">No offer to push</option>${store.data.offers.filter(o => o.brand === p.brand && o.status !== 'retired').map(o => html`<option key=${o.id} value=${o.id}>Push: ${o.name}</option>`)}</select>
        </div>
        <input className=${inputCls} aria-label="Plan goal" value=${p.goal} onChange=${e => setPlan(i, 'goal', e.target.value)} placeholder="Goal, e.g. fill December wedding bookings" />
        <${PlatformToggles} value=${p.platforms} onChange=${v => setPlan(i, 'platforms', v)} />
        <div className="flex items-center justify-between gap-2 flex-wrap">
          <label className="flex items-center gap-2 text-xs"><input type="checkbox" checked=${!!p.images} disabled=${!(images && images.ready)} onChange=${e => setPlan(i, 'images', e.target.checked)} /> Make an image for each post${images && images.ready ? '' : ' (add OPENAI_API_KEY to the server)'}</label>
          ${f.plans.length > 1 && html`<button type="button" className="text-xs text-rose-500" onClick=${() => setF({ ...f, plans: f.plans.filter((_, j) => j !== i) })}>Remove</button>`}
        </div>
      </div>`)}</div>
      ${f.plans.length < 10 && html`<button type="button" className="text-xs text-violet-500 font-medium" onClick=${() => setF({ ...f, plans: [...f.plans, { brand: BRANDS.find(b => !f.plans.some(p => p.brand === b.id)) ? BRANDS.find(b => !f.plans.some(p => p.brand === b.id)).id : 'smc', count: '5', platforms: ['instagram'], goal: '', offerId: '', images: false, enabled: true }] })}>+ Add a brand</button>`}
      <div className="flex flex-wrap gap-4 text-xs">
        <label className="flex items-center gap-2"><input type="checkbox" checked=${f.learn} onChange=${e => setF({ ...f, learn: e.target.checked })} /> Learn from Buffer results${st.buffer ? '' : ' (connect Buffer first)'}</label>
        <label className="flex items-center gap-2"><input type="checkbox" checked=${f.notify} onChange=${e => setF({ ...f, notify: e.target.checked })} /> Ping my webhook when drafts are ready${st.webhook ? '' : ' (no webhook set)'}</label>
      </div>
      <div className="flex gap-2 flex-wrap">
        <${Btn} small onClick=${() => save(f.enabled)} disabled=${!!busy || running}>${busy === 'save' ? 'Saving…' : 'Save'}</${Btn}>
        <${Btn} small kind="ghost" onClick=${runNow} disabled=${!!busy || running || !st.ready}>${running ? 'Running…' : busy === 'run' ? 'Starting…' : 'Run now'}</${Btn}>
      </div>
      <div className=${'text-xs space-y-0.5 ' + muted}>
        ${running && html`<p className="text-violet-600 dark:text-violet-300 font-medium">${st.progress || 'Working'}…</p>`}
        ${st.enabled && st.nextRun && html`<p>Next run: ${fmtIn(st.nextRun, st.timezone)} (${st.timezone} time)</p>`}
        ${res && html`<p>Last run: ${fmtIn(res.at, st.timezone)} — ${res.drafts} draft${res.drafts === 1 ? '' : 's'}${res.images ? `, ${res.images} with images` : ''}${res.trigger === 'manual' ? ' (run by hand)' : ''}</p>`}
        ${res && (res.problems || []).map(pr => html`<p key=${pr} className="text-rose-600 dark:text-rose-400">✕ ${pr}</p>`)}
      </div>
    </div>`}
  <//>`;
}
