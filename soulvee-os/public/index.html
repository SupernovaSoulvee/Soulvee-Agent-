<script>
(function () {
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);

window.addEventListener('unhandledrejection', e => { if (e.reason && e.reason.__toasted) e.preventDefault(); });
const sure = what => confirm(`Delete ${what}? This can't be undone.`);
const touch = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
const aiOffText = () => (window.SoulveeOS && window.SoulveeOS.aiOffReason && window.SoulveeOS.aiOffReason()) || 'AI is off.';

/* ---------------- constants ---------------- */
const SHARED = window.SoulveeShared;
const TZ = SHARED.deviceZone();
const BRAND_UI = {
  smc: { grad: 'from-sky-500 to-blue-600', dot: 'bg-sky-500' },
  dj: { grad: 'from-violet-600 to-fuchsia-600', dot: 'bg-fuchsia-500' },
  emporium: { grad: 'from-amber-500 to-orange-600', dot: 'bg-amber-500' },
  efr: { grad: 'from-emerald-500 to-teal-600', dot: 'bg-emerald-500' },
  digital: { grad: 'from-rose-500 to-pink-600', dot: 'bg-rose-500' },
};
const BRANDS = SHARED.BRANDS.map(b => ({ ...b, ...BRAND_UI[b.id] }));
const brandOf = id => BRANDS.find(b => b.id === id) || BRANDS[0];
const VOICE = SHARED.VOICE;
const voiceFor = SHARED.voiceFor;

const STAGES = [
  { id: 'lead', name: 'Lead', p: 10 },
  { id: 'qualified', name: 'Qualified', p: 25 },
  { id: 'proposal', name: 'Proposal', p: 50 },
  { id: 'negotiation', name: 'Negotiation', p: 75 },
  { id: 'won', name: 'Won', p: 100 },
  { id: 'lost', name: 'Lost', p: 0 },
];
const stageOf = id => STAGES.find(s => s.id === id) || STAGES[0];
const OFFER_STATUS = ['idea', 'packaging', 'live', 'retired'];
const MODELS = ['project', 'retainer', 'booking', 'product', 'course', 'licence'];
const SOURCES = ['Direct', 'Referral', 'WhatsApp', 'Instagram', 'TikTok', 'LinkedIn', 'Email', 'Radio', 'Event', 'Fiverr', 'Upwork', 'Freelancer.com', 'SoundBetter'];
const METHODS = ['Moniepoint', 'Bank transfer', 'Paystack', 'Flutterwave', 'Stripe', 'PayPal', 'Cash', 'Selar', 'Gumroad', 'Spreadshop', 'Printify', 'TeePublic'];
const CURRENCIES = ['NGN', 'USD', 'GBP', 'EUR'];
const COLS = ['offers', 'deals', 'invoices', 'ledger', 'learning', 'content', 'contacts', 'activities', 'tasks'];

const DEFAULT_SETTINGS = {
  theme: 'dark',
  company: { name: 'Soulveetainment Media Consults', bn: 'BN 2782266', address: 'Lagos Island East, Lagos, Nigeria', phone: '+2348069769446', email: 'djsoulvee@gmail.com', payment: 'Moniepoint' },
  h2Target: 0,
  vatRate: 7.5,
  whtDefault: 5,
  fx: { USD: 0, GBP: 0, EUR: 0 },
  alloc: [
    { name: 'Tax reserve', pct: 15 },
    { name: 'Operations', pct: 25 },
    { name: 'Growth & reinvest', pct: 25 },
    { name: 'Savings', pct: 20 },
    { name: 'Owner pay', pct: 15 },
  ],
  invoiceSeq: 2,
  social: { brandChannels: {} },
};
const mergeSettings = s => ({ ...DEFAULT_SETTINGS, ...s, company: { ...DEFAULT_SETTINGS.company, ...(s && s.company) }, fx: { ...DEFAULT_SETTINGS.fx, ...(s && s.fx) }, alloc: (s && Array.isArray(s.alloc) && s.alloc.length) ? s.alloc : DEFAULT_SETTINGS.alloc, social: { ...(s && s.social), brandChannels: { ...((s && s.social && s.social.brandChannels) || {}) } } });

/* ---------------- helpers ---------------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const localDate = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return localDate(d); };
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const ngn = n => { const v = Math.round(num(n)); return (v < 0 ? '−' : '') + '₦' + Math.abs(v).toLocaleString('en-NG'); };
const ngnShort = n => {
  const v = num(n); const a = Math.abs(v); const sign = Math.round(v) < 0 ? '−' : '';
  if (a >= 999995000) return sign + '₦' + (a / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (a >= 999500) return sign + '₦' + (a / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
  if (a >= 1e3) return sign + '₦' + Math.round(a / 1e3) + 'K';
  return ngn(v);
};
const fmtDate = iso => { if (!iso) return '—'; const d = new Date(String(iso).length <= 10 ? iso + 'T12:00:00' : iso); return isNaN(d) ? String(iso) : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
const fmtDateTime = iso => { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return String(iso); return String(iso).length <= 10 ? fmtDate(iso) : d.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const year = new Date().getFullYear();
const PERIODS = {
  h2: { label: 'H2 ' + year, from: year + '-07-01', to: year + '-12-31' },
  year: { label: String(year), from: year + '-01-01', to: year + '-12-31' },
  all: { label: 'All time', from: '0000-01-01', to: '9999-12-31' },
};
const inPeriod = (d, p) => !!d && d >= PERIODS[p].from && d <= PERIODS[p].to;

const vatRateNow = settings => settings.vatRate === '' || settings.vatRate == null ? 7.5 : num(settings.vatRate);
// Each invoice keeps the VAT rate it was saved with, so changing the rate in Setup leaves issued
// invoices alone. Invoices saved before rates were kept use today's rate.
const vatRateOf = (inv, settings) => inv.vatRate === '' || inv.vatRate == null ? vatRateNow(settings) : num(inv.vatRate);
function invTotals(inv, settings) {
  const sub = (inv.items || []).reduce((a, it) => a + num(it.amount), 0);
  const vat = inv.vat ? sub * vatRateOf(inv, settings) / 100 : 0;
  const wht = sub * num(inv.wht) / 100;
  return { sub, vat, total: sub + vat, wht, net: sub + vat - wht };
}
// What the client still owes: the amount payable less any part payments already logged.
const invBalance = (inv, settings) => inv.status === 'paid' ? 0 : Math.max(0, invTotals(inv, settings).net - num(inv.paidNgn));
const partPaid = inv => inv.status !== 'paid' && num(inv.paidNgn) > 0;
const invStatus = inv => (inv.status === 'sent' && inv.dueDate && inv.dueDate < localDate()) ? 'overdue' : (inv.status || 'draft');
const clientCode = c => (String(c || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 8) || 'CLIENT');
const invNumber = (client, seq) => `INV-SMC-${clientCode(client)}-${String(seq).padStart(3, '0')}`;

function computeSnapshot(data, settings, period = 'h2') {
  const inc = data.ledger.filter(l => l.type === 'income' && inPeriod(l.date, period));
  const exp = data.ledger.filter(l => l.type === 'expense' && inPeriod(l.date, period));
  const income = inc.reduce((a, l) => a + num(l.ngn), 0);
  const expenses = exp.reduce((a, l) => a + num(l.ngn), 0);
  const byBrand = BRANDS.map(b => ({ id: b.id, name: b.short, income: inc.filter(l => l.brand === b.id).reduce((a, l) => a + num(l.ngn), 0), expenses: exp.filter(l => l.brand === b.id).reduce((a, l) => a + num(l.ngn), 0) }));
  const openInv = data.invoices.filter(i => ['sent', 'overdue'].includes(invStatus(i)));
  const outstanding = openInv.reduce((a, i) => a + invBalance(i, settings), 0);
  const overdue = data.invoices.filter(i => invStatus(i) === 'overdue');
  const openDeals = data.deals.filter(d => !['won', 'lost'].includes(d.stage));
  const pipeline = openDeals.reduce((a, d) => a + num(d.value), 0);
  const weighted = openDeals.reduce((a, d) => a + num(d.value) * (d.prob != null ? num(d.prob) : stageOf(d.stage).p) / 100, 0);
  const h2Income = data.ledger.filter(l => l.type === 'income' && inPeriod(l.date, 'h2')).reduce((a, l) => a + num(l.ngn), 0);
  return { period: PERIODS[period].label, income, expenses, net: income - expenses, byBrand, outstanding, openInvoices: openInv.length, overdueCount: overdue.length, overdue, pipeline, weighted, openDeals: openDeals.length, h2Income, h2Target: num(settings.h2Target) };
}

async function getCap(name) {
  for (let i = 0; i < 40 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
  if (!(window.claude && window.claude.use)) return null;
  try { return await window.claude.use(name); } catch (e) { return null; }
}

function mcpMessage(e, server) {
  const s = (e && e.server) || server;
  switch (e && e.code) {
    case 'needs_reauth': return `Reconnect ${s} in claude.ai Settings → Connectors.`;
    case 'server_not_connected': return `Add ${s} in claude.ai Settings → Connectors, then try again.`;
    case 'selection_required': return `Choose which ${s} account to use in the claude.ai prompt, then try again.`;
    case 'approval_required': return `This needs your approval — tap the button again and allow it.`;
    case 'not_in_manifest': return `${s} is turned off for this page. Re-enable it from the page's connector settings.`;
    case 'blocked_by_policy': return `Your organisation's policy blocks this ${s} action.`;
    case 'server_unavailable': return `${s} isn't answering right now. Try again in a moment.`;
    case 'tool_error': return `${s} reported an error: ${e.message || 'unknown'}`;
    default: return (e && e.message) || `Something went wrong talking to ${s}.`;
  }
}
async function mcpCall(mcp, server, tool, input) {
  try { const r = await mcp.callTool(server, tool, input); return { ok: true, payload: r && r.payload !== undefined ? r.payload : r }; }
  catch (e) { return { ok: false, error: mcpMessage(e, server), code: e && e.code }; }
}
function sampleMessage(e) {
  if (!e) return 'The assistant could not answer.';
  if (e.code === 'not_granted') return 'AI is not enabled for this view.';
  if (e.code === 'rate_limited') return 'Too many AI requests just now — wait a minute and try again.';
  return e.message || 'The assistant could not answer.';
}
// With a JSON schema the reply is guaranteed to match it (structured outputs).
async function askJSON(sample, prompt, schema, effort) {
  if (typeof sample.json === 'function') return sample.json(prompt, schema, { effort: effort || 'medium' });
  const r = await sample(prompt);
  const m = (r.text || '').match(/\{[\s\S]*\}/);
  if (!m) throw { message: 'The AI did not return a usable offer. Try again.' };
  return JSON.parse(m[0]);
}

/* ---------------- data store ---------------- */
function useStore(toast) {
  const [mode, setMode] = useState('connecting');
  const [stale, setStale] = useState(false);
  const [readOnly, setReadOnly] = useState(false);
  const [data, setData] = useState(() => Object.fromEntries(COLS.map(c => [c, []])));
  const [settings, setSettings] = useState(() => {
    let s = DEFAULT_SETTINGS;
    try { const t = localStorage.getItem('cu-theme'); if (t) s = { ...s, theme: t }; } catch (e) {}
    return s;
  });
  const dbRef = useRef(null);
  const settingsRef = useRef(settings);
  settingsRef.current = settings;

  useEffect(() => {
    let alive = true; const unsubs = [];
    (async () => {
      const db = await getCap('db');
      if (!alive) return;
      if (!db) { setMode('local'); return; }
      dbRef.current = db; setMode('db');
      const timer = setTimeout(() => setStale(true), 10000);
      COLS.forEach(c => {
        unsubs.push(db.collection(c).onSnapshot(snap => {
          setData(p => ({ ...p, [c]: snap.docs.map(d => ({ ...d.data(), id: d.id })) }));
          if (!snap.metadata.fromCache) { clearTimeout(timer); setStale(false); }
        }, err => { clearTimeout(timer); setStale(false); if (err && err.code === 'revoked') setMode('local'); }));
      });
      unsubs.push(db.doc('settings/main').onSnapshot(snap => {
        if (snap.exists) setSettings(prev => ({ ...mergeSettings(snap.data()), theme: prev.theme }));
      }, () => {}));
      const user = await getCap('user');
      if (user && typeof user.can === 'function') {
        try { const w = await user.can('data.write'); if (w === false) setReadOnly(true); } catch (e) {}
      }
    })();
    return () => { alive = false; unsubs.forEach(u => { try { u(); } catch (e) {} }); };
  }, []);

  const fail = e => {
    if (e && e.code === 'invalid_argument') { setReadOnly(true); toast('You can view this unit but not change it.'); }
    else if (e && e.code === 'quota_exceeded') toast('Storage is full — delete old records to add more.');
    else toast('Could not save: ' + ((e && e.message) || 'try again'));
    if (e && typeof e === 'object') e.__toasted = true;
    throw e;
  };
  const add = async (c, obj) => {
    const id = obj.id || uid();
    const doc = { ...obj, id, createdAt: obj.createdAt || new Date().toISOString() };
    if (dbRef.current) { try { await dbRef.current.collection(c).doc(id).set(doc); } catch (e) { fail(e); } }
    else setData(p => ({ ...p, [c]: [...p[c], doc] }));
    return doc;
  };
  const update = async (c, id, patch) => {
    if (dbRef.current) { try { await dbRef.current.collection(c).doc(id).update(patch); } catch (e) { fail(e); } }
    else setData(p => ({ ...p, [c]: p[c].map(x => x.id === id ? { ...x, ...patch } : x) }));
  };
  const remove = async (c, id) => {
    if (dbRef.current) { try { await dbRef.current.collection(c).doc(id).delete(); } catch (e) { fail(e); } }
    else setData(p => ({ ...p, [c]: p[c].filter(x => x.id !== id) }));
  };
  const saveSettings = async s => {
    settingsRef.current = s;
    setSettings(s);
    try { localStorage.setItem('cu-theme', s.theme); } catch (e) {}
    if (dbRef.current) { try { const { theme, ...rest } = s; await dbRef.current.doc('settings/main').set(rest); } catch (e) { fail(e); } }
  };
  return { mode, stale, readOnly, data, settings, setSettings, latestSettings: () => settingsRef.current, add, update, remove, saveSettings };
}

/* ---------------- UI atoms ---------------- */
const inputCls = 'w-full rounded-xl px-3 py-2 text-sm bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-violet-500 placeholder-slate-400 dark:placeholder-slate-500';
const muted = 'text-slate-500 dark:text-slate-400';

function Card({ children, className = '' }) {
  return html`<div className=${'rounded-2xl p-4 sm:p-5 border bg-white border-slate-200 shadow-sm dark:bg-white/[0.04] dark:border-white/10 dark:shadow-none ' + className}>${children}</div>`;
}
function Btn({ kind = 'primary', small, className = '', ...p }) {
  const base = small ? 'px-3 py-1.5 text-xs' : 'px-4 py-2 text-sm';
  const k = {
    primary: 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white hover:opacity-90 shadow-sm',
    ghost: 'bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-white/10 dark:text-slate-200 dark:hover:bg-white/15',
    good: 'bg-emerald-600 text-white hover:bg-emerald-700',
    danger: 'bg-rose-50 text-rose-700 hover:bg-rose-100 dark:bg-rose-500/15 dark:text-rose-300 dark:hover:bg-rose-500/25',
  }[kind];
  return html`<button ...${p} className=${`${base} ${k} rounded-xl font-medium transition disabled:opacity-40 disabled:cursor-not-allowed ${className}`}>${p.children}</button>`;
}
function Field({ label, hint, children, className = '' }) {
  return html`<label className=${'block ' + className}><span className=${'block text-xs font-medium mb-1 ' + muted}>${label}</span>${children}${hint && html`<span className=${'block text-[11px] mt-1 ' + muted}>${hint}</span>`}</label>`;
}
function Input(p) { return html`<input ...${p} className=${inputCls + ' ' + (p.className || '')} />`; }
function Area(p) { return html`<textarea ...${p} className=${inputCls + ' ' + (p.className || '')} />`; }
function Select({ value, onChange, options, className = '' }) {
  const opts = options.map(o => typeof o === 'string' ? { v: o, l: o } : o);
  if (options.every(o => typeof o === 'string') && value != null && value !== '' && !opts.some(o => o.v === value)) opts.push({ v: value, l: String(value) });
  return html`<select value=${value == null ? '' : value} onChange=${e => onChange(e.target.value)} className=${inputCls + ' ' + className}>${opts.map(o => html`<option key=${o.v} value=${o.v}>${o.l}</option>`)}</select>`;
}
const brandOptions = BRANDS.map(b => ({ v: b.id, l: b.name }));
function BrandChip({ id }) {
  const b = brandOf(id);
  return html`<span className="inline-flex items-center gap-1.5 text-[11px] font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-200"><span className=${'w-1.5 h-1.5 rounded-full ' + b.dot}></span>${b.short}</span>`;
}
function Pill({ tone = 'slate', children }) {
  const t = {
    slate: 'bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-300',
    green: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300',
    amber: 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300',
    red: 'bg-rose-100 text-rose-800 dark:bg-rose-500/15 dark:text-rose-300',
    blue: 'bg-sky-100 text-sky-800 dark:bg-sky-500/15 dark:text-sky-300',
    violet: 'bg-violet-100 text-violet-800 dark:bg-violet-500/15 dark:text-violet-300',
  }[tone];
  return html`<span className=${'text-[11px] font-semibold px-2 py-0.5 rounded-full capitalize ' + t}>${children}</span>`;
}
function Modal({ title, onClose, children, footer, wide }) {
  const downOnBackdrop = useRef(false);
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') closeRef.current(); };
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, []);
  // Rendered into <body> so parent spacing (space-y-*) can't offset the overlay and leave the header clickable.
  return ReactDOM.createPortal(html`<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/55 backdrop-blur-sm" role="dialog" aria-modal="true" onMouseDown=${e => { downOnBackdrop.current = e.target === e.currentTarget; }} onClick=${e => { if (downOnBackdrop.current && e.target === e.currentTarget) onClose(); downOnBackdrop.current = false; }}>
    <div className=${'w-full ' + (wide ? 'sm:max-w-2xl' : 'sm:max-w-lg') + ' max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-2xl bg-white dark:bg-[#150d26] border border-slate-200 dark:border-white/10 p-5'}>
      <div className="flex items-center justify-between mb-4">
        <h3 className="font-semibold text-base">${title}</h3>
        <button onClick=${onClose} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-white/10 text-sm" aria-label="Close">✕</button>
      </div>
      ${children}
      ${footer && html`<div className="mt-5 flex flex-wrap gap-2 justify-end">${footer}</div>`}
    </div>
  </div>`, document.body);
}
function Empty({ title, children }) {
  return html`<div className="text-center py-8 px-4"><p className="font-medium text-sm">${title}</p>${children && html`<div className=${'text-xs mt-1 ' + muted}>${children}</div>`}</div>`;
}
function Section({ title, sub, action, children }) {
  return html`<section className="space-y-3">
    <div className="flex items-end justify-between gap-3 flex-wrap">
      <div><h2 className="text-lg sm:text-xl font-bold tracking-tight">${title}</h2>${sub && html`<p className=${'text-xs sm:text-sm ' + muted}>${sub}</p>`}</div>
      ${action}
    </div>
    ${children}
  </section>`;
}
function Stat({ label, value, sub, grad }) {
  return html`<div className=${'rounded-2xl p-4 text-white bg-gradient-to-br relative overflow-hidden ' + grad}>
    <div className="absolute -right-6 -top-6 w-20 h-20 rounded-full bg-white/10"></div>
    <p className="text-[11px] uppercase tracking-wider text-white/80 font-semibold">${label}</p>
    <p className="text-xl sm:text-2xl font-extrabold mt-1">${value}</p>
    ${sub && html`<p className="text-[11px] text-white/80 mt-0.5">${sub}</p>`}
  </div>`;
}
function Chips({ value, onChange, options }) {
  return html`<div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">${options.map(o => html`<button key=${o.v} onClick=${() => onChange(o.v)} className=${'whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium transition ' + (value === o.v ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white' : 'bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-300')}>${o.l}</button>`)}</div>`;
}

/* ---------------- Command ---------------- */
function CommandView({ store, caps, go, openDeal, openInvoice }) {
  const { data, settings } = store;
  const [period, setPeriod] = useState('h2');
  const s = useMemo(() => computeSnapshot(data, settings, period), [data, settings, period]);
  const maxBrand = Math.max(1, ...s.byBrand.map(b => b.income));
  const usd = num(settings.fx.USD);
  const pct = s.h2Target > 0 ? Math.min(100, s.h2Income / s.h2Target * 100) : 0;
  const followUps = data.deals.filter(d => !['won', 'lost'].includes(d.stage) && (!d.nextStep || (d.nextDue && d.nextDue <= localDate()))).slice(0, 5);
  const unpriced = data.offers.filter(o => o.status !== 'retired' && !(o.tiers || []).some(t => num(t.price) > 0)).slice(0, 4);
  const dueTasks = data.tasks.filter(t => !t.done && t.due && t.due <= localDate()).sort((a, b) => String(a.due).localeCompare(String(b.due))).slice(0, 5);
  const whoFor = t => (t.contactId && data.contacts.find(c => c.id === t.contactId)) || null;

  return html`<div className="space-y-6">
    <${Section} title="Command" sub="Skills → offers → pipeline → cash, across every Soulveetainment brand." action=${html`<${Chips} value=${period} onChange=${setPeriod} options=${Object.entries(PERIODS).map(([v, p]) => ({ v, l: p.label }))} />`}>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <${Stat} label="Collected" value=${ngnShort(s.income)} sub=${usd ? '≈ $' + Math.round(s.income / usd).toLocaleString() : s.period} grad="from-emerald-500 to-teal-600" />
        <${Stat} label="Outstanding" value=${ngnShort(s.outstanding)} sub=${s.openInvoices + ' open · ' + s.overdueCount + ' overdue'} grad="from-amber-500 to-orange-600" />
        <${Stat} label="Weighted pipeline" value=${ngnShort(s.weighted)} sub=${s.openDeals + ' open deals · ' + ngnShort(s.pipeline) + ' total'} grad="from-violet-600 to-fuchsia-600" />
        <${Stat} label="Net (after costs)" value=${ngnShort(s.net)} sub=${'Costs ' + ngnShort(s.expenses)} grad="from-sky-500 to-blue-600" />
      </div>
    <//>

    <${Card}>
      <div className="flex items-center justify-between gap-2 mb-2">
        <p className="font-semibold text-sm">H2 ${year} revenue target</p>
        ${s.h2Target > 0 ? html`<span className="text-sm font-bold">${pct.toFixed(0)}%</span>` : html`<${Btn} small kind="ghost" onClick=${() => go('setup')}>Set target</${Btn}>`}
      </div>
      <div className="h-3 rounded-full bg-slate-100 dark:bg-white/10 overflow-hidden"><div className="h-full rounded-full bg-gradient-to-r from-violet-600 to-fuchsia-500" style=${{ width: pct + '%' }}></div></div>
      <p className=${'text-xs mt-2 ' + muted}>${s.h2Target > 0 ? `${ngn(s.h2Income)} of ${ngn(s.h2Target)} collected · ${ngn(Math.max(0, s.h2Target - s.h2Income))} to go` : 'Your combined H2 target is still unconfirmed — set it in Setup so progress tracks here.'}</p>
    <//>

    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <${Card}>
        <p className="font-semibold text-sm mb-3">Collected by brand · ${s.period}</p>
        <div className="space-y-2.5">${s.byBrand.map(b => html`<div key=${b.id}>
          <div className="flex justify-between text-xs mb-1"><span>${brandOf(b.id).name}</span><span className="font-semibold">${ngn(b.income)}</span></div>
          <div className="h-2 rounded-full bg-slate-100 dark:bg-white/10 overflow-hidden"><div className=${'h-full rounded-full bg-gradient-to-r ' + brandOf(b.id).grad} style=${{ width: (b.income / maxBrand * 100) + '%' }}></div></div>
        </div>`)}</div>
      <//>
      <${Card}>
        <div className="flex items-center justify-between mb-3"><p className="font-semibold text-sm">Next money moves</p><${Btn} small kind="ghost" onClick=${() => go('assistant')}>Ask the agent</${Btn}></div>
        <div className="space-y-2">
          ${s.overdue.map(i => html`<button key=${i.id} onClick=${() => go('money')} className="w-full text-left p-3 rounded-xl bg-rose-50 dark:bg-rose-500/10 text-sm"><span className="font-medium">Chase ${i.number}</span> · ${i.client} · ${ngn(invBalance(i, settings))} <span className=${muted}>was due ${fmtDate(i.dueDate)}</span></button>`)}
          ${dueTasks.map(t => html`<button key=${t.id} onClick=${() => go('tasks')} className="w-full text-left p-3 rounded-xl bg-sky-50 dark:bg-sky-500/10 text-sm"><span className="font-medium">Follow up:</span> ${t.title}${whoFor(t) ? ' · ' + whoFor(t).name : ''} <span className=${t.due < localDate() ? 'text-rose-500' : muted}>${t.due < localDate() ? 'overdue since ' + fmtDate(t.due) : 'due today'}</span></button>`)}
          ${followUps.map(d => html`<button key=${d.id} onClick=${() => openDeal(d)} className="w-full text-left p-3 rounded-xl bg-amber-50 dark:bg-amber-500/10 text-sm"><span className="font-medium">${d.nextStep ? 'Due: ' + d.nextStep : 'Set a next step'}</span> · ${d.client} <span className=${muted}>${ngn(d.value)}</span></button>`)}
          ${unpriced.map(o => html`<button key=${o.id} onClick=${() => go('skills')} className="w-full text-left p-3 rounded-xl bg-violet-50 dark:bg-violet-500/10 text-sm"><span className="font-medium">Price it:</span> ${o.name} <span className=${muted}>· ${brandOf(o.brand).short}</span></button>`)}
          ${!s.overdue.length && !followUps.length && !unpriced.length && !dueTasks.length && html`<${Empty} title="Nothing urgent">Every deal has a next step and every offer has a price.<//>`}
        </div>
      <//>
    </div>

    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
      <${Btn} onClick=${() => openDeal(null)}>+ Deal</${Btn}>
      <${Btn} kind="ghost" onClick=${() => go('content')}>Plan posts</${Btn}>
      <${Btn} kind="ghost" onClick=${() => openInvoice(null)}>+ Invoice</${Btn}>
      <${Btn} kind="ghost" onClick=${() => go('skills')}>Convert a skill</${Btn}>
      ${caps.mcp === null ? html`<${Btn} kind="ghost" onClick=${() => go('money')}>Log money</${Btn}>` : html`<${Btn} kind="ghost" onClick=${() => go('workspace')}>Gmail lead radar</${Btn}>`}
    </div>
  </div>`;
}

const OFFER_SCHEMA = {
  type: 'object', additionalProperties: false, required: ['name', 'pitch', 'model', 'tiers', 'channels', 'firstMove'],
  properties: {
    name: { type: 'string' }, pitch: { type: 'string' }, model: { type: 'string', enum: MODELS },
    tiers: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['name', 'price', 'deliverables'], properties: { name: { type: 'string' }, price: { type: 'number' }, deliverables: { type: 'array', items: { type: 'string' } } } } },
    channels: { type: 'array', items: { type: 'string' } }, firstMove: { type: 'string' },
  },
};
function OfferModal({ offer, onClose, onSave }) {
  const [f, setF] = useState(() => ({
    brand: 'smc', name: '', pitch: '', model: 'project', status: 'idea', channels: '', firstMove: '',
    ...(offer || {}),
    channels: Array.isArray(offer && offer.channels) ? offer.channels.join(', ') : ((offer && offer.channels) || ''),
    tiers: (offer && offer.tiers && offer.tiers.length ? offer.tiers : [{ name: '', price: '', deliverables: '' }]).map(t => ({ ...t, deliverables: Array.isArray(t.deliverables) ? t.deliverables.join(', ') : (t.deliverables || '') })),
  }));
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const setTier = (i, k, v) => setF(p => ({ ...p, tiers: p.tiers.map((t, j) => j === i ? { ...t, [k]: v } : t) }));
  const save = () => {
    if (!f.name.trim()) return;
    onSave({
      ...f, name: f.name.trim(),
      channels: f.channels.split(',').map(x => x.trim()).filter(Boolean),
      tiers: f.tiers.filter(t => t.name || t.price).map(t => ({ name: t.name, price: num(t.price), deliverables: String(t.deliverables).split(',').map(x => x.trim()).filter(Boolean), suggested: !!t.suggested && !t._touched })),
    });
  };
  return html`<${Modal} title=${offer && offer.id ? 'Edit offer' : 'New offer'} onClose=${onClose} wide footer=${html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} onClick=${save} disabled=${!f.name.trim()}>Save offer</${Btn}>`}>
    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <${Field} label="Offer name" className="sm:col-span-2"><${Input} value=${f.name} onChange=${e => set('name', e.target.value)} placeholder="e.g. MCP Server Build" /><//>
      <${Field} label="Brand"><${Select} value=${f.brand} onChange=${v => set('brand', v)} options=${brandOptions} /><//>
      <${Field} label="Revenue model"><${Select} value=${f.model} onChange=${v => set('model', v)} options=${MODELS} /><//>
      <${Field} label="Status"><${Select} value=${f.status} onChange=${v => set('status', v)} options=${OFFER_STATUS} /><//>
      <${Field} label="Sales channels" hint="Comma-separated"><${Input} value=${f.channels} onChange=${e => set('channels', e.target.value)} placeholder="LinkedIn, WhatsApp, Selar" /><//>
      <${Field} label="Pitch" className="sm:col-span-2"><${Area} rows="3" value=${f.pitch} onChange=${e => set('pitch', e.target.value)} /><//>
      <${Field} label="First move to sell it" className="sm:col-span-2"><${Input} value=${f.firstMove} onChange=${e => set('firstMove', e.target.value)} /><//>
    </div>
    <div className="mt-4">
      <div className="flex items-center justify-between mb-2"><p className="text-sm font-semibold">Price tiers (₦)</p><button className="text-xs text-violet-500 font-medium" onClick=${() => set('tiers', [...f.tiers, { name: '', price: '', deliverables: '' }])}>+ Add tier</button></div>
      <div className="space-y-2">${f.tiers.map((t, i) => html`<div key=${i} className="grid grid-cols-12 gap-2 p-2 rounded-xl bg-slate-50 dark:bg-white/5">
        <input className=${inputCls + ' col-span-7'} placeholder="Tier name" value=${t.name} onChange=${e => setTier(i, 'name', e.target.value)} />
        <input className=${inputCls + ' col-span-5'} placeholder="Price ₦" inputMode="numeric" value=${t.price} onChange=${e => { setTier(i, 'price', e.target.value); setTier(i, '_touched', true); }} />
        <input className=${inputCls + ' col-span-10'} placeholder="Deliverables, comma-separated" value=${t.deliverables} onChange=${e => setTier(i, 'deliverables', e.target.value)} />
        <button className="col-span-2 text-xs text-rose-500" onClick=${() => set('tiers', f.tiers.filter((_, j) => j !== i))}>Remove</button>
      </div>`)}</div>
    </div>
  <//>`;
}

function SkillsView({ store, caps, toast, startDeal, promote }) {
  const { data, add, update, remove } = store;

  const [busy, setBusy] = useState(false);
  const [draft, setDraft] = useState(null);
  const [editing, setEditing] = useState(null);

  const earned = useMemo(() => {
    const m = {};
    data.ledger.forEach(l => { if (l.type === 'income' && l.offerId) m[l.offerId] = (m[l.offerId] || 0) + num(l.ngn); });
    return m;
  }, [data.ledger]);
  const offers = data.offers.filter(o => brand === 'all' || o.brand === brand).sort((a, b) => OFFER_STATUS.indexOf(a.status) - OFFER_STATUS.indexOf(b.status) || String(a.name).localeCompare(b.name));
  const counts = OFFER_STATUS.map(st => ({ st, n: data.offers.filter(o => o.status === st).length }));

  const convert = async () => {
    if (!caps.sample) return;
    setBusy(true); setDraft(null);
    try {
      const prompt = `${voiceFor(conv.brand)}
You are packaging one of Soulvee's skills into a sellable offer for the Nigerian (Lagos-first) market, with global reach where it fits.
Skill: ${conv.skill}
Target client: ${conv.audience || 'best-fit buyers you identify'}
Brand: ${brandOf(conv.brand).name}
Return ONLY a JSON object, no prose:
{"name": string (short offer name), "pitch": string (2 sentences in the brand voice), "model": one of ${JSON.stringify(MODELS)}, "tiers": [3 objects {"name": string, "price": number (Naira, whole number, realistic for Lagos SMEs/creatives in ${year}), "deliverables": [3-5 short strings]}], "channels": [2-4 strings: where to sell it], "firstMove": string (one concrete action to land the first paying client this week)}`;
      const v = await askJSON(caps.sample, prompt, OFFER_SCHEMA, 'medium');
      setDraft({ brand: conv.brand, status: 'packaging', name: v.name || 'New offer', pitch: v.pitch || '', model: MODELS.includes(v.model) ? v.model : 'project', channels: Array.isArray(v.channels) ? v.channels : [], firstMove: v.firstMove || '', tiers: (v.tiers || []).map(t => ({ name: t.name || '', price: num(t.price), deliverables: Array.isArray(t.deliverables) ? t.deliverables : [], suggested: true })), source: 'ai', skill: conv.skill });
    } catch (e) { toast(sampleMessage(e)); }
    setBusy(false);

  return html`<div className="space-y-6">
    <${Section} title="Skills → Revenue" sub="Turn what you can do into priced offers, then push them into the pipeline.">
      <div className="grid grid-cols-4 gap-2">${counts.map(c => html`<div key=${c.st} className="rounded-xl p-3 bg-white border border-slate-200 dark:bg-white/[0.04] dark:border-white/10 text-center"><p className="text-lg font-bold">${c.n}</p><p className=${'text-[11px] capitalize ' + muted}>${c.st}</p></div>`)}</div>
    <//>

    <${Card} className="glow">
      <p className="font-semibold text-sm mb-1">✦ Skill converter</p>
      <p className=${'text-xs mb-3 ' + muted}>Describe a skill — the AI packages it in the right brand voice with three NGN tiers. Prices it suggests are flagged until you confirm them.</p>
      ${caps.sample === null ? html`<p className="text-sm text-amber-600 dark:text-amber-400">${aiOffText()} You can still add offers by hand.</p>` : html`
      <div className="grid sm:grid-cols-3 gap-3">
        <${Field} label="Brand"><${Select} value=${conv.brand} onChange=${v => setConv({ ...conv, brand: v })} options=${brandOptions} /><//>
        <${Field} label="Skill" className="sm:col-span-2"><${Input} value=${conv.skill} onChange=${e => setConv({ ...conv, skill: e.target.value })} placeholder="e.g. I build MCP servers that connect a business's tools to Claude" /><//>
        <${Field} label="Who pays for it (optional)" className="sm:col-span-3"><${Input} value=${conv.audience} onChange=${e => setConv({ ...conv, audience: e.target.value })} placeholder="e.g. Lagos restaurants, event planners, creatives" /><//>
      </div>
      <div className="mt-3 flex gap-2 flex-wrap">
        <${Btn} onClick=${convert} disabled=${busy || !conv.skill.trim()}>${busy ? 'Packaging…' : 'Convert to offer'}</${Btn}>
        ${['Building MCP servers that connect business tools to Claude', 'Setting up Google Workspace + Gmail/Calendar automations', 'Teaching AI tools to creatives and SMEs'].map(x => html`<button key=${x} onClick=${() => setConv({ ...conv, skill: x })} className="text-xs px-3 py-1.5 rounded-full bg-slate-100 dark:bg-white/10">${x.split(' ').slice(0, 3).join(' ')}…</button>`)}
      </div>`}
      ${draft && html`<div className="mt-4 p-4 rounded-xl border border-violet-300 dark:border-violet-500/40 bg-violet-50/60 dark:bg-violet-500/10">
        <div className="flex items-center gap-2 flex-wrap"><p className="font-semibold">${draft.name}</p><${BrandChip} id=${draft.brand} /><${Pill} tone="violet">${draft.model}</${Pill}></div>
        <p className="text-sm mt-1">${draft.pitch}</p>
        <div className="grid sm:grid-cols-3 gap-2 mt-3">${draft.tiers.map((t, i) => html`<div key=${i} className="p-3 rounded-xl bg-white dark:bg-white/5"><p className="text-xs font-semibold">${t.name}</p><p className="text-lg font-bold">${ngn(t.price)}</p><p className=${'text-[11px] ' + muted}>${t.deliverables.join(' · ')}</p></div>`)}</div>

      </div>`}
    <//>

    <${Section} title="Offer catalogue" action=${html`<${Btn} small onClick=${() => setEditing({})}>+ Offer</${Btn}>`}>

            <div className="text-right shrink-0"><p className=${'text-[10px] uppercase ' + muted}>Earned</p><p className="font-bold text-emerald-600 dark:text-emerald-400 text-sm">${ngnShort(earned[o.id] || 0)}</p></div>
          </div>
          ${o.pitch && html`<p className=${'text-xs mt-2 ' + muted}>${o.pitch}</p>`}
          <div className="mt-3 space-y-1">${priced.length ? priced.map((t, i) => html`<div key=${i} className="flex justify-between text-sm"><span>${t.name}${t.suggested ? html` <span className="text-[10px] text-amber-600 dark:text-amber-400">(suggested)</span>` : ''}</span><span className="font-semibold">${ngn(t.price)}</span></div>`) : html`<p className="text-xs text-amber-600 dark:text-amber-400">No price set yet — tap Edit to add your rate card.</p>`}</div>

            <select className=${inputCls + ' !w-auto !py-1.5 text-xs'} value=${o.status} onChange=${e => update('offers', o.id, { status: e.target.value })}>${OFFER_STATUS.map(st => html`<option key=${st} value=${st}>${st}</option>`)}</select>
            <${Btn} small kind="danger" onClick=${() => sure(`the offer "${o.name}"`) && remove('offers', o.id)}>Delete</${Btn}>

    ${editing && html`<${OfferModal} offer=${editing} onClose=${() => setEditing(null)} onSave=${async v => { if (editing.id) await update('offers', editing.id, v); else { await add('offers', v); if (editing === draft) setDraft(null); } setEditing(null); toast('Offer saved'); }} />`}
  </div>`;
}

/* ---------------- Pipeline ---------------- */
function DealModal({ deal, offers, contacts, onClose, onSave }) {
  const [f, setF] = useState(() => ({ client: '', email: '', brand: 'smc', offerId: '', value: '', stage: 'lead', prob: '', source: 'Direct', nextStep: '', nextDue: '', notes: '', contactId: '', ...(deal || {}) }));
  const people = [...(contacts || [])].sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const pickContact = v => { const c = people.find(x => x.id === v); setF(p => ({ ...p, contactId: v, client: c && !String(p.client).trim() ? c.company || c.name : p.client, email: c && !p.email ? c.email || '' : p.email })); };
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const brandOffers = offers.filter(o => o.brand === f.brand);
  const setBrand = v => setF(p => ({ ...p, brand: v, offerId: v === p.brand ? p.offerId : '' }));
  // A win chance still on the old stage's default follows the new stage; a custom one is kept.
  const setStage = v => setF(p => ({ ...p, stage: v, prob: p.prob === '' || p.prob == null || num(p.prob) === stageOf(p.stage).p ? '' : p.prob }));
  return html`<${Modal} title=${deal && deal.id ? 'Edit deal' : 'New deal'} onClose=${onClose} footer=${html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} disabled=${!String(f.client).trim()} onClick=${() => onSave({ ...f, client: String(f.client).trim(), value: num(f.value), prob: f.prob === '' ? stageOf(f.stage).p : num(f.prob) })}>Save deal</${Btn}>`}>
    <div className="grid grid-cols-2 gap-3">
      <${Field} label="Client" className="col-span-2"><${Input} value=${f.client} onChange=${e => set('client', e.target.value)} placeholder="Business or person" /><//>
      <${Field} label="Contact" className="col-span-2" hint=${f.contactId ? '' : 'Left empty, the client is matched to a contact by name or email, or added to your contacts when you save.'}><${Select} value=${f.contactId || ''} onChange=${pickContact} options=${[{ v: '', l: '— match or add automatically —' }, ...people.map(c => ({ v: c.id, l: contactLabel(c) }))]} /><//>
      <${Field} label="Client email" className="col-span-2" hint="Used for follow-up emails and calendar invites"><${Input} type="email" value=${f.email} onChange=${e => set('email', e.target.value)} /><//>
      <${Field} label="Brand"><${Select} value=${f.brand} onChange=${setBrand} options=${brandOptions} /><//>
      <${Field} label="Offer"><${Select} value=${f.offerId} onChange=${v => { const o = offers.find(x => x.id === v); set('offerId', v); if (o && !num(f.value)) { const t = (o.tiers || []).find(t => num(t.price) > 0); if (t) set('value', t.price); } }} options=${[{ v: '', l: '— none —' }, ...brandOffers.map(o => ({ v: o.id, l: o.name }))]} /><//>
      <${Field} label="Value (₦)"><${Input} inputMode="numeric" value=${f.value} onChange=${e => set('value', e.target.value)} /><//>
      <${Field} label="Stage"><${Select} value=${f.stage} onChange=${setStage} options=${STAGES.map(s => ({ v: s.id, l: s.name }))} /><//>
      <${Field} label="Win chance %"><${Input} inputMode="numeric" value=${f.prob} placeholder=${String(stageOf(f.stage).p)} onChange=${e => set('prob', e.target.value)} /><//>
      <${Field} label="Source"><${Select} value=${f.source} onChange=${v => set('source', v)} options=${SOURCES} /><//>
      <${Field} label="Next step" className="col-span-2"><${Input} value=${f.nextStep} onChange=${e => set('nextStep', e.target.value)} placeholder="e.g. Send Option 2 proposal" /><//>
      <${Field} label="Next step due"><${Input} type="date" value=${f.nextDue} onChange=${e => set('nextDue', e.target.value)} /><//>
      <${Field} label="Notes" className="col-span-2"><${Area} rows="2" value=${f.notes} onChange=${e => set('notes', e.target.value)} /><//>
    </div>
  <//>`;
}

function FollowUpModal({ deal, offers, caps, toast, onClose, onDone }) {
  const [subject, setSubject] = useState(`Following up — ${deal.client}`);
  const [body, setBody] = useState('');

function CalendarModal({ prefill, caps, toast, onClose }) {

  const [busy, setBusy] = useState(false);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const create = async () => {
    if (!caps.mcp) return;
    const start = `${f.date}T${f.time}:00`;
    const end = new Date(new Date(start).getTime() + num(f.mins) * 60000);
    const endIso = localDate(end) + 'T' + String(end.getHours()).padStart(2, '0') + ':' + String(end.getMinutes()).padStart(2, '0') + ':00';
    const input = { summary: f.summary, startTime: start, endTime: endIso, addGoogleMeetUrl: !!f.meet };
    if (f.location) input.location = f.location;
    if (f.email) input.attendees = [{ email: f.email }];
    setBusy(true);
    const res = await mcpCall(caps.mcp, 'Google Calendar', 'create_event', input);
    setBusy(false);
    if (res.ok) { toast('Event added to Google Calendar'); onClose(); } else toast(res.error);
  };
  const startAt = new Date(`${f.date}T${f.time}:00`);
  const ok = !!f.summary.trim() && !isNaN(startAt.getTime());
  const endAt = new Date(startAt.getTime() + (num(f.mins) || 30) * 60000);
  const stamp = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const gcalUrl = () => {
    const q = new URLSearchParams({ action: 'TEMPLATE', text: f.summary.trim(), dates: stamp(startAt) + '/' + stamp(endAt) });
    if (f.location) q.set('location', f.location);
    if (f.email) q.set('add', f.email);
    return 'https://calendar.google.com/calendar/render?' + q.toString();
  };
  const downloadIcs = () => {
    const esc = v => String(v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    const fold = line => line.length <= 74 ? line : line.match(/.{1,73}/g).join('\r\n ');
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Soulvee OS//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
      `UID:${uid()}@soulvee-os`, `DTSTAMP:${stamp(new Date())}`, `DTSTART:${stamp(startAt)}`, `DTEND:${stamp(endAt)}`, `SUMMARY:${esc(f.summary.trim())}`];
    if (f.location) lines.push(`LOCATION:${esc(f.location)}`);
    if (f.email) lines.push(`ATTENDEE;RSVP=TRUE:mailto:${f.email}`);
    lines.push('END:VEVENT', 'END:VCALENDAR');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.map(fold).join('\r\n') + '\r\n'], { type: 'text/calendar' }));
    a.download = (f.summary.replace(/[^\w\- ]+/g, '').trim() || 'event') + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Calendar file downloaded — open it to add the event'); onClose();
  };
  return html`<${Modal} title=${caps.mcp ? 'Book on Google Calendar' : 'Book a call'} onClose=${onClose} footer=${caps.mcp ? html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} onClick=${create} disabled=${busy || !ok}>${busy ? 'Booking…' : 'Create event'}</${Btn}>` : html`<${Btn} kind="ghost" onClick=${downloadIcs} disabled=${!ok}>Download .ics</${Btn}><a href=${ok ? gcalUrl() : undefined} target="_blank" rel="noopener" aria-disabled=${!ok} onClick=${() => { if (ok) setTimeout(onClose, 0); }} className=${'px-4 py-2 text-sm rounded-xl font-medium bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white hover:opacity-90 shadow-sm' + (ok ? '' : ' opacity-40 pointer-events-none')}>Open in Google Calendar</a>`}>
    ${!caps.mcp && html`<p className=${'text-xs mb-3 ' + muted}>Opens Google Calendar with the details filled in, or download a calendar file for any calendar app.</p>`}
    <div className="grid grid-cols-2 gap-3">
      <${Field} label="Title" className="col-span-2"><${Input} value=${f.summary} onChange=${e => set('summary', e.target.value)} /><//>
      <${Field} label="Date"><${Input} type="date" value=${f.date} onChange=${e => set('date', e.target.value)} /><//>
      <${Field} label="Time"><${Input} type="time" value=${f.time} onChange=${e => set('time', e.target.value)} /><//>

      <${Field} label="Location" className="col-span-2"><${Input} value=${f.location} onChange=${e => set('location', e.target.value)} placeholder="Optional" /><//>

  <//>`;

/* ---------------- CRM ---------------- */
const LIFECYCLE = [
  { id: 'lead', name: 'Lead', tone: 'slate' },
  { id: 'prospect', name: 'Prospect', tone: 'blue' },
  { id: 'customer', name: 'Customer', tone: 'green' },
  { id: 'vip', name: 'VIP', tone: 'violet' },
  { id: 'inactive', name: 'Inactive', tone: 'amber' },
];
const lifecycleOf = id => LIFECYCLE.find(s => s.id === id) || LIFECYCLE[0];
const ACTIVITY = [
  { id: 'note', name: 'Note', icon: '✎' },
  { id: 'call', name: 'Call', icon: '☏' },
  { id: 'meeting', name: 'Meeting', icon: '◷' },
  { id: 'email', name: 'Email', icon: '✉' },
  { id: 'message', name: 'Message', icon: '✆' },
];
const activityOf = id => ACTIVITY.find(a => a.id === id) || ACTIVITY[0];
const PRIORITY = [{ v: 'normal', l: 'Normal' }, { v: 'high', l: 'High' }];
const digits = v => String(v || '').replace(/\D/g, '');
// Nigerian numbers written 0803… become 234803…; numbers already in international form are kept.
const intl = v => { const d = digits(v); return d.length === 11 && d.startsWith('0') ? '234' + d.slice(1) : d; };
const bare = v => String(v || '').trim().replace(/^https?:\/\/(www\.)?[^/]+\//i, '').replace(/^@/, '').replace(/\/+$/, '');
// The networks a contact can be reached on: the contact field, a placeholder and a profile link.
const HANDLES = [
  { key: 'whatsapp', label: 'WhatsApp', hint: '+234…', link: v => (digits(v) ? 'https://wa.me/' + intl(v) : '') },
  { key: 'instagram', label: 'Instagram', hint: '@handle', link: v => (bare(v) ? 'https://instagram.com/' + bare(v) : '') },
  { key: 'telegram', label: 'Telegram', hint: '@username', link: v => (bare(v) ? 'https://t.me/' + bare(v) : '') },
  { key: 'facebook', label: 'Facebook', hint: 'Profile or page link', link: v => (/^https?:\/\//i.test(String(v)) ? String(v) : bare(v) ? 'https://facebook.com/' + bare(v) : '') },
  { key: 'x', label: 'X', hint: '@handle', link: v => (bare(v) ? 'https://x.com/' + bare(v) : '') },
  { key: 'tiktok', label: 'TikTok', hint: '@handle', link: v => (bare(v) ? 'https://www.tiktok.com/@' + bare(v).replace(/^@/, '') : '') },
  { key: 'threads', label: 'Threads', hint: '@handle', link: v => (bare(v) ? 'https://www.threads.net/@' + bare(v).replace(/^@/, '') : '') },
  { key: 'linkedin', label: 'LinkedIn', hint: 'Profile link', link: v => (/^https?:\/\//i.test(String(v)) ? String(v) : bare(v) ? 'https://www.linkedin.com/in/' + bare(v) : '') },
  { key: 'reddit', label: 'Reddit', hint: 'u/username', link: v => (bare(v) ? 'https://www.reddit.com/user/' + bare(v).replace(/^u\//i, '') : '') },
  { key: 'signal', label: 'Signal', hint: '+234…', link: () => '' },
];
const normName = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const normEmail = s => String(s || '').trim().toLowerCase();
// Compares the last 10 digits, so +234 803… and 0803… are the same number.
const samePhone = (a, b) => { const x = digits(a); const y = digits(b); return x.length >= 7 && y.length >= 7 && x.slice(-10) === y.slice(-10); };
const initials = n => String(n || '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
const splitTags = s => [...new Set((Array.isArray(s) ? s : String(s || '').split(/[,;]/)).map(t => String(t).trim()).filter(Boolean))].slice(0, 20);
const contactLabel = c => (c ? c.name + (c.company && normName(c.company) !== normName(c.name) ? ' · ' + c.company : '') : '');
const blankContact = () => ({ name: '', company: '', role: '', email: '', phone: '', brands: [], stage: 'lead', source: 'Direct', tags: [], location: '', birthday: '', notes: '', optIn: false, links: [], ...Object.fromEntries(HANDLES.map(h => [h.key, ''])) });

// The contact a deal or invoice belongs to: its own link, else the same email, else the same name or company.
function findContact(contacts, contactId, email, name) {
  const own = contactId && contacts.find(c => c.id === contactId);
  if (own) return own;
  const e = normEmail(email);
  const byEmail = e && contacts.find(c => normEmail(c.email) === e);
  if (byEmail) return byEmail;
  const n = normName(name);
  return (n && contacts.find(c => normName(c.name) === n || normName(c.company) === n)) || null;
}

// The contact a person typed or the agent named: exact name, email or phone first, then a name containing the text.
function lookupContact(contacts, text) {
  const t = String(text || '').trim();
  if (!t) return null;
  const n = normName(t);
  return contacts.find(c => c.id === t) || contacts.find(c => normName(c.name) === n || normName(c.company) === n) || contacts.find(c => c.email && normEmail(c.email) === normEmail(t)) || contacts.find(c => digits(t).length >= 7 && [c.phone, c.whatsapp].some(p => samePhone(p, t))) || contacts.find(c => n && (normName(c.name).includes(n) || normName(c.company).includes(n))) || null;
}

// Links deals, invoices, payments, tasks and activities to contacts in one pass.
function crmIndex(data, settings) {
  const ids = new Map(data.contacts.map(c => [c.id, c]));
  const byEmail = new Map();
  const byName = new Map();
  data.contacts.forEach(c => {
    if (c.email && !byEmail.has(normEmail(c.email))) byEmail.set(normEmail(c.email), c);
    [c.name, c.company].forEach(n => { const k = normName(n); if (k && !byName.has(k)) byName.set(k, c); });
  });
  const match = (contactId, email, name) => (contactId && ids.get(contactId)) || (email && byEmail.get(normEmail(email))) || byName.get(normName(name)) || null;
  const stats = new Map(data.contacts.map(c => [c.id, { deals: [], invoices: [], payments: [], tasks: [], activities: [], paid: 0, owed: 0, open: 0, last: '' }]));
  const dealContact = new Map();
  data.deals.forEach(d => {
    const c = match(d.contactId, d.email, d.client);
    if (!c) return;
    dealContact.set(d.id, c);
    const s = stats.get(c.id);
    s.deals.push(d);
    if (!['won', 'lost'].includes(d.stage)) s.open += num(d.value);
  });
  const invContact = new Map();
  data.invoices.forEach(i => {
    const c = (i.contactId && ids.get(i.contactId)) || (i.dealId && dealContact.get(i.dealId)) || match('', i.clientEmail, i.client);
    if (!c) return;
    invContact.set(i.id, c);
    const s = stats.get(c.id);
    s.invoices.push(i);
    s.paid += num(i.paidNgn);
    if (['sent', 'overdue'].includes(invStatus(i))) s.owed += invBalance(i, settings);
  });
  data.ledger.forEach(l => { const c = l.invoiceId && invContact.get(l.invoiceId); if (c) stats.get(c.id).payments.push(l); });
  data.tasks.forEach(t => { const s = t.contactId && stats.get(t.contactId); if (s) s.tasks.push(t); });
  data.activities.forEach(a => {
    const s = a.contactId && stats.get(a.contactId);
    if (!s) return;
    s.activities.push(a);
    if (String(a.date || '') > s.last) s.last = String(a.date || '');
  });
  return { stats, dealContact, invContact, match, empty: { deals: [], invoices: [], payments: [], tasks: [], activities: [], paid: 0, owed: 0, open: 0, last: '' } };
}

// A lead or prospect who has paid or won a deal shows as a customer.
const stageFor = (c, s) => ((!c.stage || c.stage === 'lead' || c.stage === 'prospect') && s && (s.paid > 0 || s.deals.some(d => d.stage === 'won')) ? 'customer' : c.stage || 'lead');
const nextTask = s => s.tasks.filter(t => !t.done).sort((a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999')))[0] || null;

function timelineOf(s) {
  const events = [
    ...s.activities.map(a => ({ id: 'a' + a.id, at: a.date || a.createdAt, icon: activityOf(a.type).icon, title: activityOf(a.type).name, text: a.text })),
    ...s.deals.map(d => ({ id: 'd' + d.id, at: d.createdAt, icon: '▤', title: 'Deal', text: `${d.client} · ${stageOf(d.stage).name} · ${ngn(d.value)}` })),
    ...s.invoices.map(i => ({ id: 'i' + i.id, at: i.issueDate || i.createdAt, icon: '₦', title: 'Invoice', text: `${i.number} issued` })),
    ...s.payments.map(l => ({ id: 'p' + l.id, at: l.date, icon: '✓', title: 'Payment', text: `${ngn(l.ngn)} received${l.method ? ' by ' + l.method : ''}` })),
    ...s.tasks.filter(t => t.done).map(t => ({ id: 't' + t.id, at: t.doneAt || t.due, icon: '☑', title: 'Done', text: t.title })),
  ];
  return events.filter(e => e.at).sort((a, b) => String(b.at).localeCompare(String(a.at)));
}

// RFC 4180 CSV: quoted fields may hold separators, doubled quotes and line breaks. Excel files saved
// with semicolons are detected from the header line.
function parseCSV(text) {
  const src = String(text || '').replace(/^﻿/, '');
  const head = src.split(/\r?\n/, 1)[0];
  const sep = (head.match(/;/g) || []).length > (head.match(/,/g) || []).length ? ';' : ',';
  const rows = [[]];
  const s = { cell: '', quoted: false, i: 0 };
  for (; s.i < src.length; s.i++) {
    const ch = src[s.i];
    if (s.quoted && ch === '"' && src[s.i + 1] === '"') { s.cell += '"'; s.i++; continue; }
    if (s.quoted && ch === '"') { s.quoted = false; continue; }
    if (s.quoted) { s.cell += ch; continue; }
    if (ch === '"' && s.cell === '') { s.quoted = true; continue; }
    if (ch === sep) { rows[rows.length - 1].push(s.cell); s.cell = ''; continue; }
    if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && src[s.i + 1] === '\n') s.i++;
      rows[rows.length - 1].push(s.cell);
      s.cell = '';
      rows.push([]);
      continue;
    }
    s.cell += ch;
  }
  rows[rows.length - 1].push(s.cell);
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

// Reads common exports (this app, Google Contacts, Outlook, spreadsheets) into contacts.
function contactsFromCSV(rows) {
  if (rows.length < 2) return [];
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  const usable = i => !/label|type/.test(head[i]);
  const cols = test => head.map((h, i) => (test(h) ? i : -1)).filter(i => i >= 0).sort((a, b) => Number(usable(b)) - Number(usable(a)));
  const exact = (...names) => cols(h => names.includes(h));
  const like = re => cols(h => re.test(h));
  const map = {
    name: exact('name', 'full name', 'display name', 'contact name', 'contact'),
    first: exact('first name', 'given name', 'firstname'),
    last: exact('last name', 'family name', 'surname', 'lastname'),
    company: like(/^(company|organi[sz]ation( name| 1 - name)?|business( name)?)$/),
    role: like(/^(role|title|job title|position|organi[sz]ation title|organi[sz]ation 1 - title)$/),
    email: like(/e-?mail/),
    phone: like(/phone|mobile|^tel|cell/),
    stage: exact('stage', 'lifecycle', 'status'),
    source: exact('source', 'lead source'),
    brands: exact('brands', 'brand'),
    tags: like(/^(tags|labels|group membership|groups)$/),
    location: like(/^(location|city|address|address 1 - formatted)$/),
    birthday: exact('birthday', 'date of birth', 'dob'),
    notes: like(/^(notes?|comments?)$/),
    optIn: exact('optin', 'opt in', 'opt-in', 'consent'),
  };
  HANDLES.forEach(h => { map[h.key] = h.key === 'x' ? exact('x', 'twitter') : exact(h.key); });
  const get = (row, idx) => { const i = idx.find(j => String(row[j] || '').trim()); return i === undefined ? '' : String(row[i]).trim(); };
  return rows.slice(1).map(row => {
    const c = blankContact();
    Object.keys(map).forEach(k => { if (k !== 'first' && k !== 'last') c[k] = get(row, map[k]); });
    if (!c.name) c.name = [get(row, map.first), get(row, map.last)].filter(Boolean).join(' ');
    if (!c.name) c.name = c.company || c.email || c.phone;
    c.tags = splitTags(c.tags.replace(/:::/g, ',').replace(/\* ?/g, ''));
    c.brands = splitTags(c.brands).map(b => (BRANDS.find(x => x.id === b.toLowerCase() || normName(x.short) === normName(b) || normName(x.name) === normName(b)) || {}).id).filter(Boolean);
    c.stage = LIFECYCLE.some(s => s.id === c.stage.toLowerCase()) ? c.stage.toLowerCase() : 'lead';
    c.source = c.source || 'Import';
    c.optIn = /^(1|y|yes|true)$/i.test(c.optIn);
    c.birthday = /^\d{4}-\d{2}-\d{2}$/.test(c.birthday) ? c.birthday : '';
    return c;
  }).filter(c => c.name);
}

// Works out which imported people are new and which add details to an existing contact.
function importPlan(existing, people) {
  const fresh = [];
  const merge = new Map();
  const same = (a, b) => (a.email && normEmail(a.email) === normEmail(b.email)) || samePhone(a.phone, b.phone) || samePhone(a.whatsapp || a.phone, b.whatsapp || b.phone) || (!a.email && !a.phone && !b.email && !b.phone && normName(a.name) === normName(b.name));
  people.forEach(p => {
    const dup = fresh.find(f => same(f, p));
    if (dup) return;
    const old = existing.find(c => same(c, p));
    if (!old) { fresh.push(p); return; }
    const base = merge.get(old.id) || {};
    const patch = { ...base };
    Object.keys(p).forEach(k => {
      if (['tags', 'brands', 'links', 'stage', 'source', 'optIn'].includes(k)) return;
      if (p[k] && !old[k] && !patch[k]) patch[k] = p[k];
    });
    const tags = splitTags([...(old.tags || []), ...(patch.tags || []), ...p.tags]);
    if (tags.length > (old.tags || []).length) patch.tags = tags;
    const brands = [...new Set([...(old.brands || []), ...(patch.brands || []), ...p.brands])];
    if (brands.length > (old.brands || []).length) patch.brands = brands;
    if (Object.keys(patch).length) merge.set(old.id, patch);
  });
  return { fresh, merge: [...merge.entries()].map(([id, patch]) => ({ id, patch })), total: people.length };
}

const CSV_COLS = ['name', 'company', 'role', 'email', 'phone', ...HANDLES.map(h => h.key), 'stage', 'source', 'brands', 'tags', 'location', 'birthday', 'optIn', 'notes', 'createdAt'];
function contactsCSV(contacts) {
  // A cell starting with = or @ (or + / - followed by text) could run as a spreadsheet formula, so it gets a leading apostrophe.
  const cell = v => {
    const s = Array.isArray(v) ? v.join('; ') : v == null ? '' : typeof v === 'boolean' ? (v ? 'yes' : 'no') : String(v);
    const safe = /^[=@]/.test(s) || /^[+-][^\d\s]/.test(s) ? "'" + s : s;
    return /[",;\n\r]/.test(safe) ? '"' + safe.replace(/"/g, '""') + '"' : safe;
  };
  return [CSV_COLS.join(','), ...contacts.map(c => CSV_COLS.map(k => cell(c[k])).join(','))].join('\r\n');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// One contact per client in deals and invoices that isn't in the CRM yet.
function contactsFromRecords(data) {
  const out = [];
  const known = (email, name) => findContact([...data.contacts, ...out], '', email, name);
  const won = new Set(data.deals.filter(d => d.stage === 'won').map(d => normName(d.client)));
  const paid = new Set(data.invoices.filter(i => num(i.paidNgn) > 0).map(i => normName(i.client)));
  const addOne = (name, email, brand, source) => {
    if (!String(name || '').trim() || known(email, name)) return;
    out.push({ ...blankContact(), name: String(name).trim(), email: email || '', brands: brand ? [brand] : [], source: source || 'Direct', stage: won.has(normName(name)) || paid.has(normName(name)) ? 'customer' : 'lead' });
  };
  data.deals.forEach(d => { if (!d.contactId) addOne(d.client, d.email, d.brand, d.source); });
  data.invoices.forEach(i => { if (!i.contactId) addOne(i.client, i.clientEmail, i.brand, 'Invoice'); });
  return out;
}

function ImportModal({ store, toast, onClose }) {
  const [plan, setPlan] = useState(null);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const pick = async e => {
    setErr(''); setPlan(null);
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { setErr('That file is over 5 MB. Split it into smaller files.'); return; }
    const people = contactsFromCSV(parseCSV(await file.text()));
    if (!people.length) { setErr("No contacts found. The first row must be column names, such as Name, Email and Phone."); return; }
    setPlan(importPlan(store.data.contacts, people));
  };
  const run = async () => {
    setBusy(true);
    try {
      for (const c of plan.fresh) await store.add('contacts', c);
      for (const m of plan.merge) await store.update('contacts', m.id, m.patch);
      toast(`Imported ${plan.fresh.length} new contact${plan.fresh.length === 1 ? '' : 's'}${plan.merge.length ? `, updated ${plan.merge.length}` : ''}`);
      onClose();
    } catch (e) { setBusy(false); }
  };
  return html`<${Modal} title="Import contacts" onClose=${onClose} footer=${html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} disabled=${!plan || busy || !(plan.fresh.length || plan.merge.length)} onClick=${run}>${busy ? 'Importing…' : 'Import'}</${Btn}>`}>
    <div className="space-y-3 text-sm">
      <p className=${muted}>Choose a CSV file: an export from this app, Google Contacts, Outlook or any spreadsheet with a header row (Name, Email, Phone, Company, Tags…). People already in your CRM, matched on email or phone, get any missing details filled in instead of being added twice.</p>
      <input type="file" accept=".csv,text/csv" aria-label="CSV file" onChange=${pick} className="block w-full text-sm" />
      ${err && html`<p className="text-rose-600 dark:text-rose-400">${err}</p>`}

  <//>`;

function TasksView({ store, toast, index, openContact, editTask }) {
  const { data, update, remove } = store;
  const today = localDate();
  const open = data.tasks.filter(t => !t.done).sort((a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999')) || (b.priority === 'high') - (a.priority === 'high'));
  const groups = [
    { id: 'overdue', name: 'Overdue', list: open.filter(t => t.due && t.due < today), cls: 'text-rose-600 dark:text-rose-400' },
    { id: 'today', name: 'Today', list: open.filter(t => t.due === today), cls: '' },
    { id: 'soon', name: 'Upcoming', list: open.filter(t => t.due && t.due > today), cls: '' },
    { id: 'none', name: 'No date', list: open.filter(t => !t.due), cls: '' },
  ].filter(g => g.list.length);
  const done = data.tasks.filter(t => t.done).sort((a, b) => String(b.doneAt || '').localeCompare(String(a.doneAt || ''))).slice(0, 15);
  const who = t => t.contactId && data.contacts.find(c => c.id === t.contactId);
  const tick = async t => { await update('tasks', t.id, t.done ? { done: false, doneAt: '' } : { done: true, doneAt: new Date().toISOString() }); if (!t.done) toast('Done: ' + t.title); };
  const row = t => { const c = who(t); return html`<div key=${t.id} className="flex items-center gap-3 px-4 py-3 border-b last:border-0 border-slate-100 dark:border-white/5">
    <input type="checkbox" aria-label=${'Done: ' + t.title} checked=${!!t.done} onChange=${() => tick(t)} />
    <div className="min-w-0 flex-1">
      <button className=${'text-sm text-left ' + (t.done ? 'line-through ' + muted : 'font-medium')} onClick=${() => editTask(t)}>${t.title}</button>
      <p className=${'text-[11px] ' + muted}>${c ? html`<button className="text-violet-500" onClick=${() => openContact(c)}>${c.name}</button>` : 'No contact'}${t.due ? ' · ' + fmtDate(t.due) : ''}${t.priority === 'high' ? ' · high priority' : ''}</p>
    </div>
    ${t.done && html`<button className="text-xs text-rose-500" aria-label=${'Delete ' + t.title} onClick=${() => remove('tasks', t.id)}>✕</button>`}
  </div>`; };
  return html`<div className="space-y-4">
    <${Section} title="Tasks" sub="Follow-ups and reminders, with overdue ones first." action=${html`<${Btn} small onClick=${() => editTask({})}>+ Task</${Btn}>`} />
    ${open.length === 0 && html`<${Card}><${Empty} title="Nothing to follow up">Add a task here or from a contact.<//><//>`}
    ${groups.map(g => html`<div key=${g.id}><p className=${'text-xs font-semibold uppercase tracking-wider mb-2 ' + (g.cls || muted)}>${g.name} · ${g.list.length}</p><${Card} className="!p-0 overflow-hidden">${g.list.map(row)}<//></div>`)}
    ${done.length > 0 && html`<div><p className=${'text-xs font-semibold uppercase tracking-wider mb-2 ' + muted}>Done recently</p><${Card} className="!p-0 overflow-hidden">${done.map(row)}<//></div>`}
  </div>`;
}

function CRMView({ store, caps, toast, sub, setSub, openDeal, openInvoice, openId, clearOpen, openConversation }) {
  const index = useMemo(() => crmIndex(store.data, store.settings), [store.data, store.settings]);
  const [viewing, setViewing] = useState(null);
  const [editing, setEditing] = useState(null);
  const [task, setTask] = useState(null);
  const [importing, setImporting] = useState(false);
  useEffect(() => { if (!openId) return; const c = store.data.contacts.find(x => x.id === openId); if (c) { setSub('people'); setViewing(c); } clearOpen(); }, [openId]);
  const saveContact = async v => {
    if (editing && editing.id) await store.update('contacts', editing.id, v);
    else { const made = await store.add('contacts', v); setViewing(made); }
    setEditing(null);
    toast('Contact saved');
  };
  const saveTask = async v => {
    if (task && task.id) await store.update('tasks', task.id, v);
    else await store.add('tasks', { ...v, done: false });
    setTask(null);
    toast('Task saved');
  };
  return html`<div className="space-y-5">
    <${Chips} value=${sub} onChange=${setSub} options=${[{ v: 'people', l: 'People' }, { v: 'pipeline', l: 'Pipeline' }, { v: 'tasks', l: 'Tasks' + (store.data.tasks.filter(t => !t.done && t.due && t.due <= localDate()).length ? ' · ' + store.data.tasks.filter(t => !t.done && t.due && t.due <= localDate()).length : '') }]} />
    ${sub === 'people' && html`<${PeopleView} store=${store} toast=${toast} index=${index} openContact=${setViewing} editContact=${setEditing} openImport=${() => setImporting(true)} />`}
    ${sub === 'pipeline' && html`<${PipelineView} store=${store} caps=${caps} toast=${toast} openDeal=${openDeal} openInvoice=${openInvoice} contactOf=${d => index.dealContact.get(d.id)} openContact=${setViewing} />`}
    ${sub === 'tasks' && html`<${TasksView} store=${store} toast=${toast} index=${index} openContact=${setViewing} editTask=${setTask} />`}
    ${viewing && !editing && !task && html`<${ContactPanel} contact=${viewing} index=${index} store=${store} caps=${caps} toast=${toast} onClose=${() => setViewing(null)} onEdit=${setEditing} openDeal=${d => { setViewing(null); openDeal(d); }} openInvoice=${i => { setViewing(null); openInvoice(i); }} openTask=${setTask} openConversation=${k => { setViewing(null); openConversation(k); }} />`}
    ${editing && html`<${ContactModal} contact=${editing} onClose=${() => setEditing(null)} onSave=${saveContact} />`}
    ${task && html`<${TaskModal} task=${task} contacts=${store.data.contacts} onClose=${() => setTask(null)} onSave=${saveTask} />`}
    ${importing && html`<${ImportModal} store=${store} toast=${toast} onClose=${() => setImporting(false)} />`}
  </div>`;
}

// Posts in the content plan that went (or are going) to an account, for its card.
function accountActivity(content, id) {
  const hits = content.flatMap(p => (((p.publish && p.publish.results) || []).filter(r => r.target === id).map(r => ({ post: p, r }))));
  const next = hits.filter(h => h.r.status === 'scheduled' && h.r.runAt && Date.parse(h.r.runAt) > Date.now()).sort((a, b) => String(a.r.runAt).localeCompare(String(b.r.runAt)))[0];
  const sent = hits.filter(h => h.r.status === 'sent' || (h.r.ok && h.r.via === 'buffer'));
  return { next, sent: sent.length, last: sent.map(h => h.r.sentAt || h.post.postedAt).filter(Boolean).sort().pop() || '' };
}

function AccountsView({ store, toast, unread }) {
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState('');
  const [form, setForm] = useState(null);
  const [editing, setEditing] = useState(null);
  const load = async refresh => { try { setData(await window.SoulveeOS.accounts.list(refresh)); setErr(''); } catch (e) { setErr(e.message); } };
  useEffect(() => { load(false); }, []);
  if (err && !data) return html`<${Section} title="Accounts"><${Card}><${Empty} title="Accounts aren't available here">${err}<//><//><//>`;
  if (!data) return html`<${Section} title="Accounts"><${Card}><p className=${'text-sm ' + muted}>Loading your accounts…</p><//><//>`;
  const brandMap = ((store.settings.social || {}).brandChannels) || {};
  const all = [...data.accounts, ...data.buffer.map(b => ({ ...b, brands: BRANDS.filter(x => (brandMap[x.id] || []).includes(b.id.slice(7))).map(x => x.id) }))];
  const groups = NETWORK_ORDER.map(id => ({ id, list: all.filter(a => a.provider === id) })).filter(g => g.list.length).concat(all.some(a => !NETWORK[a.provider]) ? [{ id: 'other', list: all.filter(a => !NETWORK[a.provider]) }] : []);
  const signIn = async p => {
    setBusy(p.id);
    try { const out = await window.SoulveeOS.accounts.signIn(p.id); location.href = out.url; }
    catch (e) { toast(e.message); setBusy(''); }
  };
  const save = async (a, f) => {
    if (a.via === 'buffer') {
      const latest = store.latestSettings();
      const socialSettings = latest.social || { brandChannels: {} };
      const chId = a.id.slice(7);
      const next = Object.fromEntries(BRANDS.map(b => { const cur = ((socialSettings.brandChannels || {})[b.id] || []).filter(x => x !== chId); return [b.id, f.brands.includes(b.id) ? [...cur, chId] : cur]; }));
      await store.saveSettings({ ...latest, social: { ...socialSettings, brandChannels: next } });
    }
    if (a.via !== 'buffer') await window.SoulveeOS.accounts.update(a.id, { label: f.label, brands: f.brands, options: { subreddit: f.subreddit, query: f.query } });
    setEditing(null); toast('Saved'); load(false);
  };
  const act = async (a, what) => {
