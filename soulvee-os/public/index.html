<script>
(function () {
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);
// Store errors are already shown as a toast; don't report them again as unhandled.
window.addEventListener('unhandledrejection', e => { if (e.reason && e.reason.__toasted) e.preventDefault(); });
const sure = what => confirm(`Delete ${what}? This can't be undone.`);
const touch = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
const aiOffText = () => (window.SoulveeOS && window.SoulveeOS.aiOffReason && window.SoulveeOS.aiOffReason()) || 'AI is off.';

/* ---------------- constants ---------------- */
const SHARED = window.SoulveeShared;
const TZ = SHARED.deviceZone();
const BRAND_UI = {
  smc: { grad: 'from-sky-500 to-blue-600', dot: 'bg-sky-500' },
  dj: { grad: 'from-violet-600 to-fuchsia-600', dot: 'bg-fuchsia-500' },
  emporium: { grad: 'from-amber-500 to-orange-600', dot: 'bg-amber-500' },
  efr: { grad: 'from-emerald-500 to-teal-600', dot: 'bg-emerald-500' },
  digital: { grad: 'from-rose-500 to-pink-600', dot: 'bg-rose-500' },
};
const BRANDS = SHARED.BRANDS.map(b => ({ ...b, ...BRAND_UI[b.id] }));
const brandOf = id => BRANDS.find(b => b.id === id) || BRANDS[0];
const VOICE = SHARED.VOICE;
const voiceFor = SHARED.voiceFor;

const STAGES = [
  { id: 'lead', name: 'Lead', p: 10 },
  { id: 'qualified', name: 'Qualified', p: 25 },
  { id: 'proposal', name: 'Proposal', p: 50 },
  { id: 'negotiation', name: 'Negotiation', p: 75 },
  { id: 'won', name: 'Won', p: 100 },
  { id: 'lost', name: 'Lost', p: 0 },
];
const stageOf = id => STAGES.find(s => s.id === id) || STAGES[0];
const OFFER_STATUS = ['idea', 'packaging', 'live', 'retired'];
const MODELS = ['project', 'retainer', 'booking', 'product', 'course', 'licence'];
const SOURCES = ['Direct', 'Referral', 'WhatsApp', 'Instagram', 'TikTok', 'LinkedIn', 'Email', 'Radio', 'Event', 'Fiverr', 'Upwork', 'Freelancer.com', 'SoundBetter'];
const METHODS = ['Moniepoint', 'Bank transfer', 'Paystack', 'Flutterwave', 'Stripe', 'PayPal', 'Cash', 'Selar', 'Gumroad', 'Spreadshop', 'Printify', 'TeePublic'];
const CURRENCIES = ['NGN', 'USD', 'GBP', 'EUR'];
const COLS = ['offers', 'deals', 'invoices', 'ledger', 'learning', 'content'];

const DEFAULT_SETTINGS = {
  theme: 'dark',
  company: { name: 'Soulveetainment Media Consults', bn: 'BN 2782266', address: 'Lagos Island East, Lagos, Nigeria', phone: '+2348069769446', email: 'djsoulvee@gmail.com', payment: 'Moniepoint' },
  h2Target: 0,
  vatRate: 7.5,
  whtDefault: 5,
  fx: { USD: 0, GBP: 0, EUR: 0 },
  alloc: [
    { name: 'Tax reserve', pct: 15 },
    { name: 'Operations', pct: 25 },
    { name: 'Growth & reinvest', pct: 25 },
    { name: 'Savings', pct: 20 },
    { name: 'Owner pay', pct: 15 },
  ],
  invoiceSeq: 2,
  social: { brandChannels: {} },
};
const mergeSettings = s => ({ ...DEFAULT_SETTINGS, ...s, company: { ...DEFAULT_SETTINGS.company, ...(s && s.company) }, fx: { ...DEFAULT_SETTINGS.fx, ...(s && s.fx) }, alloc: (s && Array.isArray(s.alloc) && s.alloc.length) ? s.alloc : DEFAULT_SETTINGS.alloc, social: { ...(s && s.social), brandChannels: { ...((s && s.social && s.social.brandChannels) || {}) } } });

/* ---------------- helpers ---------------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const localDate = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return localDate(d); };
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const ngn = n => { const v = Math.round(num(n)); return (v < 0 ? '−' : '') + '₦' + Math.abs(v).toLocaleString('en-NG'); };
const ngnShort = n => {
  const v = num(n); const a = Math.abs(v); const sign = Math.round(v) < 0 ? '−' : '';
  if (a >= 999995000) return sign + '₦' + (a / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (a >= 999500) return sign + '₦' + (a / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
  if (a >= 1e3) return sign + '₦' + Math.round(a / 1e3) + 'K';
  return ngn(v);
};
const fmtDate = iso => { if (!iso) return '—'; const d = new Date(String(iso).length <= 10 ? iso + 'T12:00:00' : iso); return isNaN(d) ? String(iso) : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
const fmtDateTime = iso => { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return String(iso); return String(iso).length <= 10 ? fmtDate(iso) : d.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const year = new Date().getFullYear();
const PERIODS = {
  h2: { label: 'H2 ' + year, from: year + '-07-01', to: year + '-12-31' },
  year: { label: String(year), from: year + '-01-01', to: year + '-12-31' },
  all: { label: 'All time', from: '0000-01-01', to: '9999-12-31' },
};
const inPeriod = (d, p) => !!d && d >= PERIODS[p].from && d <= PERIODS[p].to;

function invTotals(inv, settings) {
  const sub = (inv.items || []).reduce((a, it) => a + num(it.amount), 0);
  const rate = settings.vatRate === '' || settings.vatRate == null ? 7.5 : num(settings.vatRate);
  const vat = inv.vat ? sub * rate / 100 : 0;
  const wht = sub * num(inv.wht) / 100;
  return { sub, vat, total: sub + vat, wht, net: sub + vat - wht };
}
const invStatus = inv => (inv.status === 'sent' && inv.dueDate && inv.dueDate < localDate()) ? 'overdue' : (inv.status || 'draft');
const clientCode = c => (String(c || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 8) || 'CLIENT');
const invNumber = (client, seq) => `INV-SMC-${clientCode(client)}-${String(seq).padStart(3, '0')}`;

function computeSnapshot(data, settings, period = 'h2') {
  const inc = data.ledger.filter(l => l.type === 'income' && inPeriod(l.date, period));
  const exp = data.ledger.filter(l => l.type === 'expense' && inPeriod(l.date, period));
  const income = inc.reduce((a, l) => a + num(l.ngn), 0);
  const expenses = exp.reduce((a, l) => a + num(l.ngn), 0);
  const byBrand = BRANDS.map(b => ({ id: b.id, name: b.short, income: inc.filter(l => l.brand === b.id).reduce((a, l) => a + num(l.ngn), 0), expenses: exp.filter(l => l.brand === b.id).reduce((a, l) => a + num(l.ngn), 0) }));
  const openInv = data.invoices.filter(i => ['sent', 'overdue'].includes(invStatus(i)));
  const outstanding = openInv.reduce((a, i) => a + invTotals(i, settings).net, 0);
  const overdue = data.invoices.filter(i => invStatus(i) === 'overdue');
  const openDeals = data.deals.filter(d => !['won', 'lost'].includes(d.stage));
  const pipeline = openDeals.reduce((a, d) => a + num(d.value), 0);
  const weighted = openDeals.reduce((a, d) => a + num(d.value) * (d.prob != null ? num(d.prob) : stageOf(d.stage).p) / 100, 0);
  const h2Income = data.ledger.filter(l => l.type === 'income' && inPeriod(l.date, 'h2')).reduce((a, l) => a + num(l.ngn), 0);
  return { period: PERIODS[period].label, income, expenses, net: income - expenses, byBrand, outstanding, openInvoices: openInv.length, overdueCount: overdue.length, overdue, pipeline, weighted, openDeals: openDeals.length, h2Income, h2Target: num(settings.h2Target) };
}

async function getCap(name) {
  for (let i = 0; i < 40 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
  if (!(window.claude && window.claude.use)) return null;
  try { return await window.claude.use(name); } catch (e) { return null; }
}

function mcpMessage(e, server) {
  const s = (e && e.server) || server;
  switch (e && e.code) {
    case 'needs_reauth': return `Reconnect ${s} in claude.ai Settings → Connectors.`;
    case 'server_not_connected': return `Add ${s} in claude.ai Settings → Connectors, then try again.`;
    case 'selection_required': return `Choose which ${s} account to use in the claude.ai prompt, then try again.`;
    case 'approval_required': return `This needs your approval — tap the button again and allow it.`;
    case 'not_in_manifest': return `${s} is turned off for this page. Re-enable it from the page's connector settings.`;
    case 'blocked_by_policy': return `Your organisation's policy blocks this ${s} action.`;
    case 'server_unavailable': return `${s} isn't answering right now. Try again in a moment.`;
    case 'tool_error': return `${s} reported an error: ${e.message || 'unknown'}`;
    default: return (e && e.message) || `Something went wrong talking to ${s}.`;
  }
}
async function mcpCall(mcp, server, tool, input) {
  try { const r = await mcp.callTool(server, tool, input); return { ok: true, payload: r && r.payload !== undefined ? r.payload : r }; }
  catch (e) { return { ok: false, error: mcpMessage(e, server), code: e && e.code }; }
}
function sampleMessage(e) {
  if (!e) return 'The assistant could not answer.';
  if (e.code === 'not_granted') return 'AI is not enabled for this view.';
  if (e.code === 'rate_limited') return 'Too many AI requests just now — wait a minute and try again.';
  return e.message || 'The assistant could not answer.';
}
// With a JSON schema the reply is guaranteed to match it (structured outputs).
async function askJSON(sample, prompt, schema, effort) {
  if (typeof sample.json === 'function') return sample.json(prompt, schema, { effort: effort || 'medium' });
  const r = await sample(prompt);
  const m = (r.text || '').match(/\{[\s\S]*\}/);
  if (!m) throw { message: 'The AI did not return a usable offer. Try again.' };
  return JSON.parse(m[0]);
}

/* ---------------- data store ---------------- */
function useStore(toast) {
  const [mode, setMode] = useState('connecting');
  const [stale, setStale] = useState(false);
  const [readOnly, setReadOnly] = useState(false);
  const [data, setData] = useState(() => Object.fromEntries(COLS.map(c => [c, []])));
  const [settings, setSettings] = useState(() => {
    let s = DEFAULT_SETTINGS;
    try { const t = localStorage.getItem('cu-theme'); if (t) s = { ...s, theme: t }; } catch (e) {}
    return s;
  });
  const dbRef = useRef(null);
  const settingsRef = useRef(settings);
  settingsRef.current = settings;

  useEffect(() => {
    let alive = true; const unsubs = [];
    (async () => {
      const db = await getCap('db');
      if (!alive) return;
      if (!db) { setMode('local'); return; }
      dbRef.current = db; setMode('db');
      const timer = setTimeout(() => setStale(true), 10000);
      COLS.forEach(c => {
        unsubs.push(db.collection(c).onSnapshot(snap => {
          setData(p => ({ ...p, [c]: snap.docs.map(d => ({ ...d.data(), id: d.id })) }));
          if (!snap.metadata.fromCache) { clearTimeout(timer); setStale(false); }
        }, err => { clearTimeout(timer); setStale(false); if (err && err.code === 'revoked') setMode('local'); }));
      });
      unsubs.push(db.doc('settings/main').onSnapshot(snap => {
        if (snap.exists) setSettings(prev => ({ ...mergeSettings(snap.data()), theme: prev.theme }));
      }, () => {}));
      const user = await getCap('user');
      if (user && typeof user.can === 'function') {
        try { const w = await user.can('data.write'); if (w === false) setReadOnly(true); } catch (e) {}
      }
    })();
    return () => { alive = false; unsubs.forEach(u => { try { u(); } catch (e) {} }); };
  }, []);

  const fail = e => {
    if (e && e.code === 'invalid_argument') { setReadOnly(true); toast('You can view this unit but not change it.'); }
    else if (e && e.code === 'quota_exceeded') toast('Storage is full — delete old records to add more.');
    else toast('Could not save: ' + ((e && e.message) || 'try again'));
    if (e && typeof e === 'object') e.__toasted = true;
    throw e;
  };
  const add = async (c, obj) => {
    const id = obj.id || uid();
    const doc = { ...obj, id, createdAt: obj.createdAt || new Date().toISOString() };
    if (dbRef.current) { try { await dbRef.current.collection(c).doc(id).set(doc); } catch (e) { fail(e); } }
    else setData(p => ({ ...p, [c]: [...p[c], doc] }));
    return doc;
  };
  const update = async (c, id, patch) => {
    if (dbRef.current) { try { await dbRef.current.collection(c).doc(id).update(patch); } catch (e) { fail(e); } }
    else setData(p => ({ ...p, [c]: p[c].map(x => x.id === id ? { ...x, ...patch } : x) }));
  };
  const remove = async (c, id) => {
    if (dbRef.current) { try { await dbRef.current.collection(c).doc(id).delete(); } catch (e) { fail(e); } }
    else setData(p => ({ ...p, [c]: p[c].filter(x => x.id !== id) }));
  };
  const saveSettings = async s => {
    settingsRef.current = s;
    setSettings(s);
    try { localStorage.setItem('cu-theme', s.theme); } catch (e) {}
    if (dbRef.current) { try { const { theme, ...rest } = s; await dbRef.current.doc('settings/main').set(rest); } catch (e) { fail(e); } }
  };
  return { mode, stale, readOnly, data, settings, setSettings, latestSettings: () => settingsRef.current, add, update, remove, saveSettings };
}

/* ---------------- UI atoms ---------------- */
const inputCls = 'w-full rounded-xl px-3 py-2 text-sm bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-violet-500 placeholder-slate-400 dark:placeholder-slate-500';
const muted = 'text-slate-500 dark:text-slate-400';

function Card({ children, className = '' }) {
  return html`<div className=${'rounded-2xl p-4 sm:p-5 border bg-white border-slate-200 shadow-sm dark:bg-white/[0.04] dark:border-white/10 dark:shadow-none ' + className}>${children}</div>`;
}
function Btn({ kind = 'primary', small, className = '', ...p }) {
  const base = small ? 'px-3 py-1.5 text-xs' : 'px-4 py-2 text-sm';
  const k = {
    primary: 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white hover:opacity-90 shadow-sm',
    ghost: 'bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-white/10 dark:text-slate-200 dark:hover:bg-white/15',
    good: 'bg-emerald-600 text-white hover:bg-emerald-700',
    danger: 'bg-rose-50 text-rose-700 hover:bg-rose-100 dark:bg-rose-500/15 dark:text-rose-300 dark:hover:bg-rose-500/25',
  }[kind];
  return html`<button ...${p} className=${`${base} ${k} rounded-xl font-medium transition disabled:opacity-40 disabled:cursor-not-allowed ${className}`}>${p.children}</button>`;
}
function Field({ label, hint, children, className = '' }) {
  return html`<label className=${'block ' + className}><span className=${'block text-xs font-medium mb-1 ' + muted}>${label}</span>${children}${hint && html`<span className=${'block text-[11px] mt-1 ' + muted}>${hint}</span>`}</label>`;
}
function Input(p) { return html`<input ...${p} className=${inputCls + ' ' + (p.className || '')} />`; }
function Area(p) { return html`<textarea ...${p} className=${inputCls + ' ' + (p.className || '')} />`; }
function Select({ value, onChange, options, className = '' }) {
  const opts = options.map(o => typeof o === 'string' ? { v: o, l: o } : o);
  if (options.every(o => typeof o === 'string') && value != null && value !== '' && !opts.some(o => o.v === value)) opts.push({ v: value, l: String(value) });
  return html`<select value=${value == null ? '' : value} onChange=${e => onChange(e.target.value)} className=${inputCls + ' ' + className}>${opts.map(o => html`<option key=${o.v} value=${o.v}>${o.l}</option>`)}</select>`;
}
const brandOptions = BRANDS.map(b => ({ v: b.id, l: b.name }));
function BrandChip({ id }) {
  const b = brandOf(id);
  return html`<span className="inline-flex items-center gap-1.5 text-[11px] font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-200"><span className=${'w-1.5 h-1.5 rounded-full ' + b.dot}></span>${b.short}</span>`;
}
function Pill({ tone = 'slate', children }) {
  const t = {
    slate: 'bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-300',
    green: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300',
    amber: 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300',
    red: 'bg-rose-100 text-rose-800 dark:bg-rose-500/15 dark:text-rose-300',
    blue: 'bg-sky-100 text-sky-800 dark:bg-sky-500/15 dark:text-sky-300',
    violet: 'bg-violet-100 text-violet-800 dark:bg-violet-500/15 dark:text-violet-300',
  }[tone];
  return html`<span className=${'text-[11px] font-semibold px-2 py-0.5 rounded-full capitalize ' + t}>${children}</span>`;
}
function Modal({ title, onClose, children, footer, wide }) {
  const downOnBackdrop = useRef(false);
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') closeRef.current(); };
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, []);
  // Rendered into <body> so parent spacing (space-y-*) can't offset the overlay and leave the header clickable.
  return ReactDOM.createPortal(html`<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/55 backdrop-blur-sm" role="dialog" aria-modal="true" onMouseDown=${e => { downOnBackdrop.current = e.target === e.currentTarget; }} onClick=${e => { if (downOnBackdrop.current && e.target === e.currentTarget) onClose(); downOnBackdrop.current = false; }}>
    <div className=${'w-full ' + (wide ? 'sm:max-w-2xl' : 'sm:max-w-lg') + ' max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-2xl bg-white dark:bg-[#150d26] border border-slate-200 dark:border-white/10 p-5'}>
      <div className="flex items-center justify-between mb-4">
        <h3 className="font-semibold text-base">${title}</h3>
        <button onClick=${onClose} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-white/10 text-sm" aria-label="Close">✕</button>
      </div>
      ${children}
      ${footer && html`<div className="mt-5 flex flex-wrap gap-2 justify-end">${footer}</div>`}
    </div>
  </div>`, document.body);
}
function Empty({ title, children }) {
  return html`<div className="text-center py-8 px-4"><p className="font-medium text-sm">${title}</p>${children && html`<div className=${'text-xs mt-1 ' + muted}>${children}</div>`}</div>`;
}
function Section({ title, sub, action, children }) {
  return html`<section className="space-y-3">
    <div className="flex items-end justify-between gap-3 flex-wrap">
      <div><h2 className="text-lg sm:text-xl font-bold tracking-tight">${title}</h2>${sub && html`<p className=${'text-xs sm:text-sm ' + muted}>${sub}</p>`}</div>
      ${action}
    </div>
    ${children}
  </section>`;
}
function Stat({ label, value, sub, grad }) {
  return html`<div className=${'rounded-2xl p-4 text-white bg-gradient-to-br relative overflow-hidden ' + grad}>
    <div className="absolute -right-6 -top-6 w-20 h-20 rounded-full bg-white/10"></div>
    <p className="text-[11px] uppercase tracking-wider text-white/80 font-semibold">${label}</p>
    <p className="text-xl sm:text-2xl font-extrabold mt-1">${value}</p>
    ${sub && html`<p className="text-[11px] text-white/80 mt-0.5">${sub}</p>`}
  </div>`;
}
function Chips({ value, onChange, options }) {
  return html`<div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">${options.map(o => html`<button key=${o.v} onClick=${() => onChange(o.v)} className=${'whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium transition ' + (value === o.v ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white' : 'bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-300')}>${o.l}</button>`)}</div>`;
}

/* ---------------- Command ---------------- */
function CommandView({ store, caps, go, openDeal, openInvoice }) {
  const { data, settings } = store;
  const [period, setPeriod] = useState('h2');
  const s = useMemo(() => computeSnapshot(data, settings, period), [data, settings, period]);
  const maxBrand = Math.max(1, ...s.byBrand.map(b => b.income));
  const usd = num(settings.fx.USD);
  const pct = s.h2Target > 0 ? Math.min(100, s.h2Income / s.h2Target * 100) : 0;
  const followUps = data.deals.filter(d => !['won', 'lost'].includes(d.stage) && (!d.nextStep || (d.nextDue && d.nextDue <= localDate()))).slice(0, 5);
  const unpriced = data.offers.filter(o => o.status !== 'retired' && !(o.tiers || []).some(t => num(t.price) > 0)).slice(0, 4);

  return html`<div className="space-y-6">

const OFFER_SCHEMA = {
  type: 'object', additionalProperties: false, required: ['name', 'pitch', 'model', 'tiers', 'channels', 'firstMove'],
  properties: {
    name: { type: 'string' }, pitch: { type: 'string' }, model: { type: 'string', enum: MODELS },
    tiers: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['name', 'price', 'deliverables'], properties: { name: { type: 'string' }, price: { type: 'number' }, deliverables: { type: 'array', items: { type: 'string' } } } } },
    channels: { type: 'array', items: { type: 'string' } }, firstMove: { type: 'string' },
  },
};
function OfferModal({ offer, onClose, onSave }) {
  const [f, setF] = useState(() => ({
    brand: 'smc', name: '', pitch: '', model: 'project', status: 'idea', channels: '', firstMove: '',
    ...(offer || {}),
    channels: Array.isArray(offer && offer.channels) ? offer.channels.join(', ') : ((offer && offer.channels) || ''),
    tiers: (offer && offer.tiers && offer.tiers.length ? offer.tiers : [{ name: '', price: '', deliverables: '' }]).map(t => ({ ...t, deliverables: Array.isArray(t.deliverables) ? t.deliverables.join(', ') : (t.deliverables || '') })),
  }));
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const setTier = (i, k, v) => setF(p => ({ ...p, tiers: p.tiers.map((t, j) => j === i ? { ...t, [k]: v } : t) }));
  const save = () => {
    if (!f.name.trim()) return;
    onSave({
      ...f, name: f.name.trim(),
      channels: f.channels.split(',').map(x => x.trim()).filter(Boolean),
      tiers: f.tiers.filter(t => t.name || t.price).map(t => ({ name: t.name, price: num(t.price), deliverables: String(t.deliverables).split(',').map(x => x.trim()).filter(Boolean), suggested: !!t.suggested && !t._touched })),
    });

  return html`<${Modal} title=${offer && offer.id ? 'Edit offer' : 'New offer'} onClose=${onClose} wide footer=${html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} onClick=${save} disabled=${!f.name.trim()}>Save offer</${Btn}>`}>

      <${Field} label="Revenue model"><${Select} value=${f.model} onChange=${v => set('model', v)} options=${MODELS} /><//>

        <input className=${inputCls + ' col-span-5'} placeholder="Price ₦" inputMode="numeric" value=${t.price} onChange=${e => { setTier(i, 'price', e.target.value); setTier(i, '_touched', true); }} />

}

function DealModal({ deal, offers, onClose, onSave }) {

  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const brandOffers = offers.filter(o => o.brand === f.brand);
  const setBrand = v => setF(p => ({ ...p, brand: v, offerId: v === p.brand ? p.offerId : '' }));
  // A win chance still on the old stage's default follows the new stage; a custom one is kept.
  const setStage = v => setF(p => ({ ...p, stage: v, prob: p.prob === '' || p.prob == null || num(p.prob) === stageOf(p.stage).p ? '' : p.prob }));
  return html`<${Modal} title=${deal && deal.id ? 'Edit deal' : 'New deal'} onClose=${onClose} footer=${html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} disabled=${!String(f.client).trim()} onClick=${() => onSave({ ...f, client: String(f.client).trim(), value: num(f.value), prob: f.prob === '' ? stageOf(f.stage).p : num(f.prob) })}>Save deal</${Btn}>`}>
    <div className="grid grid-cols-2 gap-3">
      <${Field} label="Client" className="col-span-2"><${Input} value=${f.client} onChange=${e => set('client', e.target.value)} placeholder="Business or person" /><//>
      <${Field} label="Client email" className="col-span-2" hint="Used for follow-up emails and calendar invites"><${Input} type="email" value=${f.email} onChange=${e => set('email', e.target.value)} /><//>

      <${Field} label="Win chance %"><${Input} inputMode="numeric" value=${f.prob} placeholder=${String(stageOf(f.stage).p)} onChange=${e => set('prob', e.target.value)} /><//>

      <${Field} label="Notes" className="col-span-2"><${Area} rows="2" value=${f.notes} onChange=${e => set('notes', e.target.value)} /><//>
    </div>
  <//>`;
}

function FollowUpModal({ deal, offers, caps, toast, onClose, onDone }) {
  const [subject, setSubject] = useState(`Following up — ${deal.client}`);
  const [body, setBody] = useState('');
  const [busy, setBusy] = useState('');
  const offer = offers.find(o => o.id === deal.offerId);
  const write = async () => {
    if (!caps.sample) return;
    setBusy('write');
    try {
      const r = await caps.sample(`${voiceFor(deal.brand)}
Write a short follow-up email (under 150 words) from Soulvee to ${deal.client} about ${offer ? offer.name : 'our proposal'} worth ${ngn(deal.value)}. Stage: ${stageOf(deal.stage).name}. Next step we want: ${deal.nextStep || 'agree on next steps'}. Notes: ${deal.notes || 'none'}.
Plain text only, no markdown, no subject line. Sign off as "Soulvee" with "Soulveetainment Media Consults · +2348069769446" on the line below. Do not invent prices or dates not given here.`, { effort: 'low' });
      setBody((r.text || '').trim());
    } catch (e) { toast(sampleMessage(e)); }
    setBusy('');
  };
  const save = async () => {
    if (!caps.mcp) return;
    setBusy('save');
    const res = await mcpCall(caps.mcp, 'Gmail', 'create_draft', { to: deal.email ? [deal.email] : [], subject, body });
    setBusy('');
    if (res.ok) { toast('Draft saved in Gmail — review and send it there'); onDone(res.payload && res.payload.viewUrl); }
    else toast(res.error);
  };
  const ready = !!body.trim();
  const mailto = 'mailto:' + String(deal.email || '').replace(/[^A-Za-z0-9@._+-]/g, '') + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  const copy = async () => { try { await navigator.clipboard.writeText(`Subject: ${subject}\n\n${body}`); toast('Copied'); } catch (e) { toast('Copy blocked — select the text and copy it manually'); } };

function CalendarModal({ prefill, caps, toast, onClose }) {
  const [f, setF] = useState({ summary: prefill.summary || '', date: addDays(localDate(), 1), time: '11:00', mins: '30', email: prefill.email || '', meet: true, location: '' });
  const [busy, setBusy] = useState(false);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const create = async () => {
    if (!caps.mcp) return;
    const start = `${f.date}T${f.time}:00`;
    const end = new Date(new Date(start).getTime() + num(f.mins) * 60000);
    const endIso = localDate(end) + 'T' + String(end.getHours()).padStart(2, '0') + ':' + String(end.getMinutes()).padStart(2, '0') + ':00';
    const input = { summary: f.summary, startTime: start, endTime: endIso, addGoogleMeetUrl: !!f.meet };
    if (f.location) input.location = f.location;
    if (f.email) input.attendees = [{ email: f.email }];
    setBusy(true);
    const res = await mcpCall(caps.mcp, 'Google Calendar', 'create_event', input);
    setBusy(false);
    if (res.ok) { toast('Event added to Google Calendar'); onClose(); } else toast(res.error);
  };
  const startAt = new Date(`${f.date}T${f.time}:00`);
  const ok = !!f.summary.trim() && !isNaN(startAt.getTime());
  const endAt = new Date(startAt.getTime() + (num(f.mins) || 30) * 60000);
  const stamp = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const gcalUrl = () => {
    const q = new URLSearchParams({ action: 'TEMPLATE', text: f.summary.trim(), dates: stamp(startAt) + '/' + stamp(endAt) });
    if (f.location) q.set('location', f.location);
    if (f.email) q.set('add', f.email);
    return 'https://calendar.google.com/calendar/render?' + q.toString();
  };
  const downloadIcs = () => {
    const esc = v => String(v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    const fold = line => line.length <= 74 ? line : line.match(/.{1,73}/g).join('\r\n ');
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Soulvee OS//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
      `UID:${uid()}@soulvee-os`, `DTSTAMP:${stamp(new Date())}`, `DTSTART:${stamp(startAt)}`, `DTEND:${stamp(endAt)}`, `SUMMARY:${esc(f.summary.trim())}`];
    if (f.location) lines.push(`LOCATION:${esc(f.location)}`);
    if (f.email) lines.push(`ATTENDEE;RSVP=TRUE:mailto:${f.email}`);
    lines.push('END:VEVENT', 'END:VCALENDAR');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.map(fold).join('\r\n') + '\r\n'], { type: 'text/calendar' }));
    a.download = (f.summary.replace(/[^\w\- ]+/g, '').trim() || 'event') + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Calendar file downloaded — open it to add the event'); onClose();
  };
  return html`<${Modal} title=${caps.mcp ? 'Book on Google Calendar' : 'Book a call'} onClose=${onClose} footer=${caps.mcp ? html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} onClick=${create} disabled=${busy || !ok}>${busy ? 'Booking…' : 'Create event'}</${Btn}>` : html`<${Btn} kind="ghost" onClick=${downloadIcs} disabled=${!ok}>Download .ics</${Btn}><a href=${ok ? gcalUrl() : undefined} target="_blank" rel="noopener" aria-disabled=${!ok} onClick=${() => { if (ok) setTimeout(onClose, 0); }} className=${'px-4 py-2 text-sm rounded-xl font-medium bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white hover:opacity-90 shadow-sm' + (ok ? '' : ' opacity-40 pointer-events-none')}>Open in Google Calendar</a>`}>
    ${!caps.mcp && html`<p className=${'text-xs mb-3 ' + muted}>Opens Google Calendar with the details filled in, or download a calendar file for any calendar app.</p>`}
    <div className="grid grid-cols-2 gap-3">
      <${Field} label="Title" className="col-span-2"><${Input} value=${f.summary} onChange=${e => set('summary', e.target.value)} /><//>
      <${Field} label="Date"><${Input} type="date" value=${f.date} onChange=${e => set('date', e.target.value)} /><//>
      <${Field} label="Time"><${Input} type="time" value=${f.time} onChange=${e => set('time', e.target.value)} /><//>
      <${Field} label="Length (mins)"><${Input} inputMode="numeric" value=${f.mins} onChange=${e => set('mins', e.target.value)} /><//>
      <${Field} label="Invite (email)"><${Input} type="email" value=${f.email} onChange=${e => set('email', e.target.value)} /><//>
      <${Field} label="Location" className="col-span-2"><${Input} value=${f.location} onChange=${e => set('location', e.target.value)} placeholder="Optional" /><//>
      ${caps.mcp && html`<label className="col-span-2 flex items-center gap-2 text-sm"><input type="checkbox" checked=${f.meet} onChange=${e => set('meet', e.target.checked)} /> Add a Google Meet link</label>`}
    </div>
  <//>`;
}

      <div className="flex items-start justify-between gap-2">
        <div className="min-w-0"><p className="font-semibold truncate">${d.client}</p><div className="flex gap-1.5 mt-1 flex-wrap"><${BrandChip} id=${d.brand} /><${Pill} tone=${d.stage === 'won' ? 'green' : d.stage === 'lost' ? 'red' : d.stage === 'negotiation' ? 'amber' : 'violet'}>${stageOf(d.stage).name}</${Pill}>${d.source && html`<${Pill}>${d.source}</${Pill}>`}</div></div>
        <div className="text-right shrink-0"><p className="font-bold">${ngnShort(d.value)}</p><p className=${'text-[11px] ' + muted}>${d.prob != null ? d.prob : stageOf(d.stage).p}% chance</p></div>
      </div>
      ${offerName(d.offerId) && html`<p className=${'text-xs mt-2 ' + muted}>Offer: ${offerName(d.offerId)}</p>`}
      <p className="text-xs mt-1">${d.nextStep ? html`<span className="font-medium">Next:</span> ${d.nextStep}${d.nextDue ? html` <span className=${d.nextDue < localDate() ? 'text-rose-500' : muted}>· ${fmtDate(d.nextDue)}</span>` : ''}` : html`<span className="text-amber-600 dark:text-amber-400">No next step set</span>`}</p>
      <div className="flex gap-2 mt-3 flex-wrap">

        <${Btn} small kind="ghost" onClick=${() => setFollow(d)}>✉ Follow up</${Btn}>
        <${Btn} small kind="ghost" onClick=${() => setCal({ summary: `${brandOf(d.brand).short} × ${d.client}`, email: d.email })}>📅 Book</${Btn}>
        <${Btn} small kind="ghost" onClick=${() => openDeal(d)}>Edit</${Btn}>
        ${!['won', 'lost'].includes(d.stage) && html`<${Btn} small kind="danger" onClick=${() => update('deals', d.id, { stage: 'lost', prob: 0 })}>Lost</${Btn}>`}

const PLATFORMS = SHARED.PLATFORMS;
const platformOf = SHARED.platformOf;
const POST_STATUS = ['idea', 'draft', 'approved', 'scheduled', 'posted', 'failed'];
const STATUS_TONE = { idea: 'slate', draft: 'blue', approved: 'violet', scheduled: 'amber', posted: 'green', failed: 'red' };
const YT_CATEGORY = SHARED.YT_CATEGORY;
const SERVICE_LABEL = { instagram: 'Instagram', tiktok: 'TikTok', facebook: 'Facebook', linkedin: 'LinkedIn', twitter: 'X', threads: 'Threads', youtube: 'YouTube', pinterest: 'Pinterest', bluesky: 'Bluesky', mastodon: 'Mastodon', googlebusiness: 'Google Business', substack: 'Substack' };
const CONTENT_SCHEMA = SHARED.CONTENT_SCHEMA;

const hhmm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
const toLocalParts = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? { date: localDate(d), time: hhmm(d) } : { date: '', time: '' }; };
const fromLocalParts = (date, time) => { if (!date) return ''; const d = new Date(`${date}T${time || '10:00'}:00`); return isNaN(d) ? '' : d.toISOString(); };
const slotFor = (day, time) => SHARED.slot(Math.max(0, Math.min(13, Math.round(num(day)))), time, TZ);
const tagLine = SHARED.tagLine;
const fmtSlot = iso => { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };

function postWarnings(p) {
  const out = [];
  const media = p.media || [];
  const len = String(p.text || '').length;
  if (!String(p.text || '').trim()) out.push('No caption yet');
  if (!(p.platforms || []).length) out.push('Pick at least one platform');
  (p.platforms || []).forEach(id => {
    const pl = platformOf(id);
    if (len > pl.limit) out.push(`Too long for ${pl.name} (${len}/${pl.limit})`);
    if (pl.media === 'video' && !media.some(m => m.type === 'video')) out.push(`${pl.name} needs a video`);
    if (pl.media === 'any' && !media.length) out.push(`${pl.name} needs an image or video`);
  });
  return out;
}

function shareLink(platform, text) {
  const t = encodeURIComponent(text || '');
  if (platform === 'x') return 'https://x.com/intent/post?text=' + t;
  if (platform === 'threads') return 'https://www.threads.net/intent/post?text=' + t;
  if (platform === 'linkedin') return 'https://www.linkedin.com/feed/?shareActive=true&text=' + t;
  return platformOf(platform).url;
}

const copyText = async (t, toast) => { try { await navigator.clipboard.writeText(t); toast('Caption copied'); } catch (e) { toast('Copy blocked — select the text and copy it manually'); } };

function PlatformToggles({ value, onChange }) {

}

  const healthy = c => !c.isDisconnected && !c.isLocked;
  const [target, setTarget] = useState(social.buffer && social.allowed ? 'buffer' : social.webhook && social.allowed ? 'webhook' : 'manual');
  const [picked, setPicked] = useState(() => { const s = usable.filter(c => saved.includes(c.id) && healthy(c)).map(c => c.id); return s.length ? s : usable.filter(healthy).map(c => c.id); });
  const future = !!post.scheduledAt && Date.parse(post.scheduledAt) > Date.now() + 60000;
  const [when, setWhen] = useState(future ? 'scheduled' : 'now');
  const [remember, setRemember] = useState(true);
  const [busy, setBusy] = useState(false);
  const [results, setResults] = useState(null);
  const warnings = postWarnings(post);
  const tabs = [social.buffer && { v: 'buffer', l: 'Buffer' }, social.webhook && { v: 'webhook', l: 'Webhook' }, { v: 'manual', l: 'Post by hand' }].filter(Boolean);

  const send = async () => {
    setBusy(true);
    const payload = { id: post.id, brand: post.brand, title: post.title, text: post.text, media: post.media || [], platforms: post.platforms || [], channels: picked, scheduledAt: when === 'scheduled' ? post.scheduledAt : null, igType: post.igType || '', firstComment: post.firstComment || '', ytCategory: post.ytCategory || YT_CATEGORY[post.brand] || '22', aiAssisted: !!post.aiAssisted };
    try {
      const out = await window.SoulveeOS.social.publish(payload, target);
      const at = new Date().toISOString();
      if (target === 'webhook') {
        await onDone({ status: 'scheduled', publish: { target, at, when, jobId: out.job.id, runAt: out.job.runAt } });
        toast(when === 'now' ? 'Sent to your webhook' : 'Queued — Soulvee OS sends it at the scheduled time');
        onClose();
      }
      if (target === 'buffer') {
        const ok = out.results.filter(r => r.ok);
        setResults(out.results);
        if (remember && ok.length) {
          const latest = store.latestSettings();
          const socialSettings = latest.social || { brandChannels: {} };
          await store.saveSettings({ ...latest, social: { ...socialSettings, brandChannels: { ...(socialSettings.brandChannels || {}), [post.brand]: picked } } });
        }
        await onDone({ status: ok.length ? 'scheduled' : 'failed', publish: { target, at, when, results: out.results } });
        if (ok.length === out.results.length) { toast(when === 'now' ? 'Sent to Buffer — it goes out in a moment' : 'Scheduled in Buffer'); onClose(); }
      }
    } catch (e) { toast(e.message); }
    setBusy(false);
  };

  const footer = target === 'manual'
    ? html`<${Btn} kind="ghost" onClick=${onClose}>Close</${Btn}><${Btn} kind="good" onClick=${async () => { await onDone({ status: 'posted', postedAt: new Date().toISOString(), publish: { target: 'manual', at: new Date().toISOString() } }); toast('Marked as posted'); onClose(); }}>I've posted it</${Btn}>`
    : html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} onClick=${send} disabled=${busy || !social.allowed || (target === 'buffer' && !picked.length)}>${busy ? 'Sending…' : target === 'buffer' ? (when === 'now' ? 'Post now via Buffer' : 'Schedule in Buffer') : (when === 'now' ? 'Send to webhook now' : 'Queue for webhook')}</${Btn}>`;

  return html`<${Modal} title=${'Publish · ' + (post.title || 'post')} onClose=${onClose} footer=${footer}>
    <div className="space-y-4">
      <${Chips} value=${target} onChange=${setTarget} options=${tabs} />
      ${!social.allowed && target !== 'manual' && html`<p className="text-xs text-amber-700 dark:text-amber-300">Publishing is locked here. Open Soulvee OS on the computer that runs it, or set SOULVEE_ACCESS_TOKEN on the server and open the app once with ?token=YOUR_TOKEN.</p>`}
      ${target !== 'manual' && html`<div className="flex flex-wrap gap-4 text-sm">
        ${future && html`<label className="flex items-center gap-2"><input type="radio" name="when" checked=${when === 'scheduled'} onChange=${() => setWhen('scheduled')} /> ${fmtSlot(post.scheduledAt)}</label>`}
        <label className="flex items-center gap-2"><input type="radio" name="when" checked=${when === 'now'} onChange=${() => setWhen('now')} /> Now</label>
        ${!future && html`<span className=${'text-xs ' + muted}>Set a date and time on the post to schedule it.</span>`}
      </div>`}
      ${target === 'buffer' && html`<div>
        <p className=${'text-xs font-medium mb-2 ' + muted}>Buffer channels</p>
        ${usable.length === 0 ? html`<p className="text-sm text-amber-700 dark:text-amber-300">None of your Buffer channels match this post's platforms (${(post.platforms || []).map(id => platformOf(id).name).join(', ')}). Connect them in Buffer, or change the platforms.</p>` : html`<div className="space-y-1.5">${usable.map(c => html`<label key=${c.id} className="flex items-center gap-2 text-sm p-2 rounded-xl bg-slate-50 dark:bg-white/5">
          <input type="checkbox" disabled=${!healthy(c)} checked=${picked.includes(c.id)} onChange=${e => setPicked(p => e.target.checked ? [...p, c.id] : p.filter(x => x !== c.id))} />
          ${c.avatar ? html`<img src=${c.avatar} alt="" className="w-6 h-6 rounded-full" />` : null}
          <span className="flex-1 min-w-0 truncate">${c.displayName || c.name} <span className=${muted}>· ${SERVICE_LABEL[c.service] || c.service}</span></span>
          ${c.isDisconnected && html`<${Pill} tone="red">disconnected</${Pill}>`}${c.isLocked && html`<${Pill} tone="red">locked</${Pill}>`}${c.isQueuePaused && html`<${Pill} tone="amber">queue paused</${Pill}>`}
        </label>`)}</div>`}
        <label className="flex items-center gap-2 text-xs mt-2"><input type="checkbox" checked=${remember} onChange=${e => setRemember(e.target.checked)} /> Use these channels for ${brandOf(post.brand).short} next time</label>
      </div>`}
      ${target === 'webhook' && html`<p className=${'text-sm ' + muted}>Soulvee OS sends this post to your Make, Zapier or n8n webhook ${when === 'now' ? 'straight away' : 'at the scheduled time'}, and that scenario posts it. The server must be running then.</p>`}
      ${target === 'manual' && html`<div className="space-y-3">
        <textarea readOnly rows="6" className=${inputCls + ' text-xs'} value=${post.text} onFocus=${e => e.target.select()}></textarea>
        <div className="flex flex-wrap gap-2"><${Btn} small onClick=${() => copyText(post.text, toast)}>Copy caption</${Btn}>${(post.platforms || []).map(id => html`<a key=${id} href=${shareLink(id, post.text)} target="_blank" rel="noopener" className="px-3 py-1.5 text-xs rounded-xl bg-slate-100 dark:bg-white/10 font-medium">Open ${platformOf(id).name}</a>`)}</div>
        ${(post.media || []).length > 0 && html`<div className="text-xs space-y-1">${post.media.map((m, i) => html`<a key=${i} href=${m.url} target="_blank" rel="noopener" className="block truncate text-violet-500">${m.type}: ${m.url}</a>`)}</div>`}
        <p className=${'text-xs ' + muted}>X, Threads and LinkedIn open with the caption filled in. For the others, copy the caption first.</p>
      </div>`}
      ${warnings.length > 0 && target !== 'manual' && html`<div className="text-xs text-amber-700 dark:text-amber-300 space-y-0.5">${warnings.map(w => html`<p key=${w}>⚠ ${w}</p>`)}</div>`}
      ${results && html`<div className="space-y-1">${results.map(r => html`<p key=${r.channelId} className=${'text-xs ' + (r.ok ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400')}>${r.ok ? '✓' : '✕'} ${r.name || r.channelId}${r.service ? ' (' + (SERVICE_LABEL[r.service] || r.service) + ')' : ''}: ${r.ok ? (r.dueAt ? 'scheduled for ' + fmtSlot(r.dueAt) : 'accepted') : r.message}</p>`)}</div>`}
    </div>
  <//>`;
}

function ContentView({ store, caps, toast, prefill, clearPrefill, onImport }) {
  const { data, add, update, remove } = store;
  const ref = useRef(store); ref.current = store;
  const [social, setSocial] = useState(null);
  const [channels, setChannels] = useState([]);
  const [chanErr, setChanErr] = useState('');
  const [filter, setFilter] = useState('active');
  const [brand, setBrand] = useState('all');
  const [editing, setEditing] = useState(null);
  const [publishing, setPublishing] = useState(null);
  const [gen, setGen] = useState({ brand: 'dj', goal: '', platforms: ['instagram', 'tiktok'], count: '5', offerId: '' });
  const [busy, setBusy] = useState(false);
  const [server, setServer] = useState(null);
  const [insights, setInsights] = useState(() => (store.settings.social || {}).insights || null);
  const [insBusy, setInsBusy] = useState(false);
  const [useResults, setUseResults] = useState(true);
  const [withImages, setWithImages] = useState(false);
  const [drawing, setDrawing] = useState({});
  const images = server && server.images;

  useEffect(() => { window.SoulveeOS.health().then(setServer, () => setServer({})); }, []);
  useEffect(() => { if (prefill) { setGen(g => ({ ...g, ...prefill })); clearPrefill(); window.scrollTo({ top: 0 }); } }, [prefill]);
  useEffect(() => {
    let alive = true;
    window.SoulveeOS.social.status().then(s => {
      if (!alive) return;
      setSocial(s);
      if (s.buffer && s.allowed) window.SoulveeOS.social.channels(false).then(r => { if (alive) setChannels(r.channels); }, e => { if (alive) setChanErr(e.message); });
    }, () => { if (alive) setSocial({ buffer: false, webhook: false, allowed: false, offline: true }); });
    return () => { alive = false; };
  }, []);

  // Webhook posts: mark them posted (or failed) once the server has delivered them.
  const pendingKey = data.content.filter(p => p.status === 'scheduled' && p.publish && p.publish.jobId).map(p => p.publish.jobId).join(',');
  useEffect(() => {
    if (!pendingKey) return undefined;
    const check = () => window.SoulveeOS.social.jobs(pendingKey.split(',')).then(r => r.jobs.forEach(j => {
      const p = ref.current.data.content.find(x => x.publish && x.publish.jobId === j.id);
      if (!p || p.status !== 'scheduled') return;
      if (j.status === 'sent') ref.current.update('content', p.id, { status: 'posted', postedAt: j.sentAt });
      if (j.status === 'failed') ref.current.update('content', p.id, { status: 'failed', publish: { ...p.publish, error: j.error } });
      if (j.status === 'cancelled') ref.current.update('content', p.id, { status: 'approved' });
    }), () => {});
    check();
    const timer = setInterval(check, 15000);
    return () => clearInterval(timer);
  }, [pendingKey]);

  const brandOffers = data.offers.filter(o => o.brand === gen.brand && o.status !== 'retired');
  const recentTitles = b => data.content.filter(p => p.brand === b).sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt))).slice(0, 15).map(p => p.title).filter(Boolean);

  // Makes an image from a post's visual brief and adds it to the post.
  const makeImage = async p => {
    setDrawing(m => ({ ...m, [p.id]: true }));
    const ok = await window.SoulveeOS.images.generate({ brand: p.brand, visual: p.visual, format: p.format, platforms: p.platforms, title: p.title }).then(async r => {
      const latest = ref.current.data.content.find(x => x.id === p.id) || p;
      await ref.current.update('content', p.id, { media: [...(latest.media || []), { type: 'image', url: r.media.url }] });
      return true;
    }, e => { toast(e.message); return false; });
    setDrawing(m => { const next = { ...m }; delete next[p.id]; return next; });
    return ok;
  };
  const makeImages = async list => {
    for (const [i, p] of list.entries()) {
      toast(`Making images ${i + 1} of ${list.length}…`);
      if (!(await makeImage(p))) return;
    }
    if (list.length) toast(`${list.length} image${list.length === 1 ? '' : 's'} added`);
  };

  // Reads results from Buffer, keeps a summary for the AI, and puts the numbers on matching posts.
  const loadInsights = async refresh => {
    setInsBusy(true);
    try {
      const r = await window.SoulveeOS.social.insights(TZ, refresh);
      const keep = { learnings: r.learnings, at: r.updatedAt, count: r.count, platforms: r.platforms, bestHour: r.bestHour, top: r.posts.slice(0, 5) };
      setInsights(keep);
      const latest = store.latestSettings();
      await store.saveSettings({ ...latest, social: { ...(latest.social || {}), insights: keep } });
      const byId = {};
      r.posts.forEach(x => { byId[x.id] = x; });
      for (const p of ref.current.data.content) {
        const hits = ((p.publish && p.publish.results) || []).filter(x => x.ok && byId[x.postId]).map(x => byId[x.postId]);
        if (!hits.length) continue;
        const rates = hits.filter(h => h.rate !== null).map(h => h.rate);
        const metrics = { rate: rates.length ? Math.max(...rates) : null, seen: hits.reduce((t, h) => t + (h.seen || 0), 0), reactions: hits.reduce((t, h) => t + (h.metrics.reactions || 0), 0), comments: hits.reduce((t, h) => t + (h.metrics.comments || 0), 0), at: r.updatedAt };
        await ref.current.update('content', p.id, { metrics, ...(p.status === 'scheduled' ? { status: 'posted', postedAt: hits[0].sentAt || new Date().toISOString() } : {}) });
      }
      toast(r.count ? `Results read from ${r.count} Buffer post${r.count === 1 ? '' : 's'}` : 'No results yet — Buffer collects them about a day after posting');
    } catch (e) { toast(e.message); }
    setInsBusy(false);
  };

  const generate = async () => {
    if (!caps.sample || busy) return;
    const offer = data.offers.find(o => o.id === gen.offerId);
    const count = Math.max(1, Math.min(14, Math.round(num(gen.count)) || 5));
    const platforms = gen.platforms.length ? gen.platforms : ['instagram'];
    const learnings = useResults && insights && insights.learnings ? insights.learnings : '';
    setBusy(true);
    try {
      const prompt = SHARED.contentPrompt({ brand: gen.brand, goal: gen.goal, offer, platforms, count, firstDay: 0, lastDay: 13, today: new Date(), tz: TZ, learnings, recent: recentTitles(gen.brand) });
      const v = await askJSON(caps.sample, prompt, CONTENT_SCHEMA, 'medium');
      const items = (Array.isArray(v.posts) ? v.posts : []).slice(0, 14);
      const created = [];
      for (const p of items) created.push(await add('content', SHARED.draftFromAi(p, { brand: gen.brand, platforms, tz: TZ, firstDay: 0, lastDay: 13, source: offer ? { type: 'offer', id: offer.id, label: offer.name } : { type: 'topic', label: gen.goal.trim() } })));
      toast(items.length ? `${items.length} drafts added — review and approve them below` : 'The AI returned no posts. Try again.');
      setFilter('active');
      setBusy(false);
      if (withImages && images && images.ready) await makeImages(created.filter(d => String(d.visual || '').trim()));
      return;
    } catch (e) { toast(sampleMessage(e)); }
    setBusy(false);
  };

  const savePost = async v => {
    if (editing && editing.id) await update('content', editing.id, v);
    else await add('content', { aiAssisted: false, ...v });
    setEditing(null);
    toast('Post saved');
  };
  const cancelJob = async p => {
    try { await window.SoulveeOS.social.cancel(p.publish.jobId); await update('content', p.id, { status: 'approved' }); toast('Scheduled post cancelled'); }
    catch (e) { toast(e.message); }
  };

  const visible = data.content.filter(p => (brand === 'all' || p.brand === brand) && (filter === 'all' || (filter === 'posted' ? p.status === 'posted' : p.status !== 'posted')));
  const sorted = [...visible].sort((a, b) => String(a.scheduledAt || '9999').localeCompare(String(b.scheduledAt || '9999')) || String(a.createdAt).localeCompare(String(b.createdAt)));
  const groups = [];
  sorted.forEach(p => {
    const key = p.scheduledAt ? localDate(new Date(p.scheduledAt)) : '';
    const last = groups[groups.length - 1];
    if (last && last.key === key) last.items.push(p);
    if (!last || last.key !== key) groups.push({ key, items: [p] });
  });
  const dayLabel = key => !key ? 'Not scheduled yet' : key === localDate() ? 'Today' : key === addDays(localDate(), 1) ? 'Tomorrow' : new Date(key + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
  const counts = POST_STATUS.map(st => ({ st, n: data.content.filter(p => p.status === st).length }));
  const connection = !social ? 'Checking publishing…' : social.offline ? 'Server unreachable — copy and post by hand' : [social.buffer && `Buffer${channels.length ? ' · ' + channels.length + ' channels' : ''}`, social.webhook && 'Webhook'].filter(Boolean).join(' + ') || 'Copy and post by hand (connect Buffer in Setup)';

  return html`<div className="space-y-6">
    <${Section} title="Content Studio" sub="Plan, write and publish posts for every brand — AI drafts, you approve." action=${html`<${Btn} small onClick=${() => setEditing({ brand: gen.brand, platforms: gen.platforms.length ? gen.platforms : ['instagram'] })}>+ Post</${Btn}>`}>
      <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">${counts.map(c => html`<div key=${c.st} className="rounded-xl p-3 bg-white border border-slate-200 dark:bg-white/[0.04] dark:border-white/10 text-center"><p className="text-lg font-bold">${c.n}</p><p className=${'text-[11px] capitalize ' + muted}>${c.st}</p></div>`)}</div>
      <p className=${'text-xs ' + muted}>Publishing: <span className="font-medium">${connection}</span>${chanErr ? html` · <span className="text-rose-500">${chanErr}</span>` : ''}</p>
    <//>

    <${Card} className="glow">
      <p className="font-semibold text-sm mb-1">✦ AI content generator</p>
      <p className=${'text-xs mb-3 ' + muted}>Writes captions, hashtags, visual briefs and video scripts in the brand's voice, and spreads them over the next two weeks. Everything lands as a draft for you to check.</p>
      ${caps.sample === null ? html`<p className="text-sm text-amber-600 dark:text-amber-400">${aiOffText()} You can still write posts by hand with + Post.</p>` : html`
      <div className="grid sm:grid-cols-3 gap-3">
        <${Field} label="Brand"><${Select} value=${gen.brand} onChange=${v => setGen({ ...gen, brand: v, offerId: '' })} options=${brandOptions} /><//>
        <${Field} label="Goal or topic" className="sm:col-span-2"><${Input} value=${gen.goal} onChange=${e => setGen({ ...gen, goal: e.target.value })} placeholder="e.g. Fill my December wedding bookings" /><//>
        <${Field} label="Promote an offer (optional)"><${Select} value=${gen.offerId} onChange=${v => setGen({ ...gen, offerId: v })} options=${[{ v: '', l: '— none —' }, ...brandOffers.map(o => ({ v: o.id, l: o.name }))]} /><//>
        <${Field} label="How many posts"><${Select} value=${String(gen.count)} onChange=${v => setGen({ ...gen, count: v })} options=${['3', '5', '7', '10', '14']} /><//>
        <div className="sm:col-span-3"><span className=${'block text-xs font-medium mb-1 ' + muted}>Platforms</span><${PlatformToggles} value=${gen.platforms} onChange=${v => setGen({ ...gen, platforms: v })} /></div>
      </div>
      <div className="mt-3 flex flex-wrap gap-4 text-xs">
        ${insights && insights.learnings && html`<label className="flex items-center gap-2"><input type="checkbox" checked=${useResults} onChange=${e => setUseResults(e.target.checked)} /> Use what's working (${insights.count} posts)</label>`}
        ${images && images.ready && html`<label className="flex items-center gap-2"><input type="checkbox" checked=${withImages} onChange=${e => setWithImages(e.target.checked)} /> Make an image for each post</label>`}
      </div>
      <div className="mt-3 flex gap-2 flex-wrap">
        <${Btn} onClick=${generate} disabled=${busy || !gen.platforms.length}>${busy ? 'Writing posts…' : 'Generate posts'}</${Btn}>
        <button type="button" onClick=${() => setGen({ ...gen, goal: 'Plan a full week of content: one post a day', count: '7' })} className="text-xs px-3 py-1.5 rounded-full bg-slate-100 dark:bg-white/10">Plan my week</button>
        <button type="button" onClick=${() => setGen({ ...gen, brand: 'dj', goal: 'Announce my next gig and get people to come out', count: '3', platforms: ['instagram', 'tiktok', 'x'] })} className="text-xs px-3 py-1.5 rounded-full bg-slate-100 dark:bg-white/10">Gig announcement</button>
        <button type="button" onClick=${() => setGen({ ...gen, brand: 'smc', goal: 'Show Lagos restaurants and hotels how AI automation saves them time and money', count: '5', platforms: ['linkedin', 'instagram', 'x'] })} className="text-xs px-3 py-1.5 rounded-full bg-slate-100 dark:bg-white/10">SMC thought leadership</button>
      </div>`}
    <//>

    <div className="grid lg:grid-cols-2 gap-4 items-start">
      <${AutopilotCard} store=${store} toast=${toast} images=${images} onImport=${onImport} />
      <${ResultsCard} insights=${insights} social=${social} busy=${insBusy} onRefresh=${() => loadInsights(true)} />
    </div>

    <${Section} title="Content plan" action=${html`<${Chips} value=${filter} onChange=${setFilter} options=${[{ v: 'active', l: 'To do' }, { v: 'posted', l: 'Posted' }, { v: 'all', l: 'All' }]} />`}>
      <${Chips} value=${brand} onChange=${setBrand} options=${[{ v: 'all', l: 'All brands' }, ...BRANDS.map(b => ({ v: b.id, l: b.short }))]} />
      ${groups.length === 0 ? html`<${Card}><${Empty} title="Nothing planned yet">Generate posts above, or write one with + Post.<//><//>` : groups.map(g => html`<div key=${g.key || 'none'} className="space-y-2">
        <p className=${'text-xs font-semibold uppercase tracking-wide ' + muted}>${dayLabel(g.key)}</p>
        <div className="grid md:grid-cols-2 gap-3">${g.items.map(p => {
          const warn = postWarnings(p);
          const res = (p.publish && p.publish.results) || [];
          const img = (p.media || []).find(m => m.type === 'image');
          return html`<${Card} key=${p.id}>
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <p className="font-semibold truncate">${p.title || 'Untitled post'}</p>
                <div className="flex gap-1.5 mt-1 flex-wrap"><${BrandChip} id=${p.brand} /><${Pill} tone=${STATUS_TONE[p.status] || 'slate'}>${p.status}</${Pill}>${(p.platforms || []).map(id => html`<${Pill} key=${id}>${platformOf(id).name}</${Pill}>`)}</div>
              </div>
              <div className="text-right shrink-0 text-[11px]">${p.scheduledAt ? html`<p className="font-semibold">${hhmm(new Date(p.scheduledAt))}</p>` : null}${p.autopilot ? html`<p className="text-violet-600 dark:text-violet-300">Autopilot</p>` : p.aiAssisted && html`<p className=${muted}>AI draft</p>`}</div>
            </div>
            <div className="flex gap-3 mt-2">
              ${img && html`<img src=${img.url} alt="" className="w-16 h-16 rounded-xl object-cover shrink-0 bg-slate-100 dark:bg-white/10" />`}
              <p className="text-xs whitespace-pre-wrap line-clamp-4 flex-1 min-w-0">${p.text}</p>
            </div>
            ${p.metrics && html`<p className="text-[11px] mt-2 font-medium text-emerald-600 dark:text-emerald-400">📈 ${[p.metrics.rate !== null && p.metrics.rate !== undefined ? p.metrics.rate + '% engagement' : '', p.metrics.seen ? fmtCount(p.metrics.seen) + ' reached' : '', p.metrics.reactions ? p.metrics.reactions + ' reactions' : '', p.metrics.comments ? p.metrics.comments + ' comments' : ''].filter(Boolean).join(' · ') || 'No numbers yet'}</p>`}
            ${p.visual && html`<p className=${'text-[11px] mt-2 line-clamp-2 ' + muted}><span className="font-semibold">Visual:</span> ${p.visual}</p>`}
            ${warn.length > 0 && p.status !== 'posted' && html`<p className="text-[11px] mt-2 text-amber-700 dark:text-amber-300">⚠ ${warn.join(' · ')}</p>`}
            ${p.status === 'scheduled' && p.publish && html`<p className=${'text-[11px] mt-2 ' + muted}>${p.publish.target === 'buffer' ? `In Buffer · ${res.filter(r => r.ok).length}/${res.length} channels${p.publish.when === 'now' ? ' · posting now' : ''}` : `Webhook · ${p.publish.when === 'now' ? 'sending now' : 'sends ' + fmtSlot(p.publish.runAt || p.scheduledAt)}`}</p>`}
            ${(p.status === 'failed' || res.some(r => !r.ok)) && html`<div className="text-[11px] mt-2 text-rose-600 dark:text-rose-400">${res.filter(r => !r.ok).map(r => html`<p key=${r.channelId}>✕ ${r.name || SERVICE_LABEL[r.service] || r.channelId}: ${r.message}</p>`)}${p.publish && p.publish.error ? html`<p>✕ ${p.publish.error}</p>` : null}</div>`}
            <div className="flex gap-2 mt-3 flex-wrap">
              ${['idea', 'draft'].includes(p.status) && html`<${Btn} small onClick=${() => update('content', p.id, { status: 'approved' })}>Approve</${Btn}>`}
              ${['approved', 'failed'].includes(p.status) && html`<${Btn} small onClick=${() => setPublishing(p)}>${p.status === 'failed' ? 'Try again' : 'Publish…'}</${Btn}>`}
              ${p.status === 'scheduled' && p.publish && p.publish.jobId && html`<${Btn} small kind="ghost" onClick=${() => cancelJob(p)}>Cancel</${Btn}>`}
              ${p.status === 'scheduled' && p.publish && p.publish.target === 'buffer' && html`<a href="https://publish.buffer.com" target="_blank" rel="noopener" className="px-3 py-1.5 text-xs rounded-xl bg-slate-100 dark:bg-white/10 font-medium">Open Buffer</a>`}
              ${p.status === 'scheduled' && html`<${Btn} small kind="good" onClick=${() => update('content', p.id, { status: 'posted', postedAt: new Date().toISOString() })}>Mark posted</${Btn}>`}
              ${images && images.ready && !(p.media || []).length && String(p.visual || '').trim() && p.status !== 'posted' && html`<${Btn} small kind="ghost" onClick=${() => makeImage(p)} disabled=${!!drawing[p.id]}>${drawing[p.id] ? 'Making image…' : 'Make image'}</${Btn}>`}
              <${Btn} small kind="ghost" onClick=${() => copyText(p.text, toast)}>Copy</${Btn}>
              <${Btn} small kind="ghost" onClick=${() => setEditing(p)}>Edit</${Btn}>
              ${p.status === 'posted' && html`<${Btn} small kind="ghost" onClick=${async () => { await add('content', { ...p, id: undefined, createdAt: undefined, status: 'draft', scheduledAt: '', publish: null, postedAt: null, title: (p.title || 'Post') + ' (again)' }); toast('Copied as a new draft'); }}>Reuse</${Btn}>`}
              <${Btn} small kind="danger" onClick=${() => sure(`the post "${p.title || 'untitled'}"`) && remove('content', p.id)}>Delete</${Btn}>
            </div>
          <//>`;
        })}</div>
      </div>`)}
    <//>
    ${editing && html`<${PostModal} post=${editing} caps=${caps} toast=${toast} images=${images} onClose=${() => setEditing(null)} onSave=${savePost} />`}
    ${publishing && social && html`<${PublishModal} post=${publishing} social=${social} channels=${channels} store=${store} toast=${toast} onClose=${() => setPublishing(null)} onDone=${patch => update('content', publishing.id, patch)} />`}
  </div>`;
}

/* ---------------- Autopilot and results ---------------- */
const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const ZONES = ['Africa/Lagos', 'Europe/London', 'America/New_York', 'Asia/Dubai', 'UTC'];
// A moment shown on the autopilot's own clock (it runs on that time zone, wherever this device is).
const fmtIn = (iso, tz) => { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString('en-GB', { timeZone: tz || TZ, weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const fmtCount = n => Number(n || 0) >= 1000 ? (Math.round(Number(n) / 100) / 10).toLocaleString('en-NG') + 'K' : String(Math.round(Number(n || 0)));

// What autopilot needs to know when it runs on the server: live offers and recent post titles per brand.
function autopilotContext(store) {
  const offers = store.data.offers.filter(o => o.status !== 'retired').map(o => ({ id: o.id, brand: o.brand, name: o.name, pitch: o.pitch || '', tiers: (o.tiers || []).map(t => ({ name: t.name, price: num(t.price) })) }));
  const recent = {};
  BRANDS.forEach(b => { recent[b.id] = store.data.content.filter(p => p.brand === b.id).sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt))).slice(0, 30).map(p => p.title).filter(Boolean); });
  return { offers, recent };
}

function AutopilotCard({ store, toast, images, onImport }) {
  const [st, setSt] = useState(null);
  const [f, setF] = useState(null);
  const [busy, setBusy] = useState('');
  const formFrom = s => ({
    enabled: !!s.enabled, day: String(s.day), time: s.time, timezone: s.timezone, learn: s.learn !== false, notify: s.notify !== false,
    plans: (s.plans && s.plans.length ? s.plans : [{ brand: 'dj', count: 5, platforms: ['instagram', 'tiktok'], goal: '', offerId: '', images: !!(images && images.ready), enabled: true }]).map(p => ({ ...p, count: String(p.count) })),
  });
  const load = async () => {
    const s = await window.SoulveeOS.autopilot.status().catch(e => ({ allowed: false, error: e.message }));
    setSt(s);
    if (s.allowed) setF(prev => prev || formFrom(s));
    return s;
  };
  useEffect(() => { load(); }, []);
  // Follow a run until it finishes, then bring its drafts into the plan.
  const running = !!(st && st.running);
  useEffect(() => {
    if (!running) return undefined;
    const timer = setInterval(async () => {
      const s = await load();
      if (s && s.allowed && !s.running) { clearInterval(timer); await onImport(); }
    }, 1500);
    return () => clearInterval(timer);
  }, [running]);

  const setPlan = (i, k, v) => setF(p => ({ ...p, plans: p.plans.map((x, j) => j === i ? { ...x, [k]: v } : x) }));
  const payload = enabled => ({ ...f, enabled, day: num(f.day), plans: f.plans.map(p => ({ ...p, count: num(p.count) })) });
  const save = async enabled => {
    setBusy('save');
    try {
      await window.SoulveeOS.autopilot.context(autopilotContext(store));
      const s = await window.SoulveeOS.autopilot.save(payload(enabled));
      setSt({ allowed: true, ...s });
      setF(formFrom(s));
      toast(s.enabled ? `Autopilot is on — next run ${fmtIn(s.nextRun, s.timezone)}` : 'Autopilot settings saved (it is off)');
    } catch (e) { toast(e.message); }
    setBusy('');
  };
  const runNow = async () => {
    setBusy('run');
    try {
      await window.SoulveeOS.autopilot.context(autopilotContext(store));
      await window.SoulveeOS.autopilot.save(payload(f.enabled));
      const s = await window.SoulveeOS.autopilot.run();
      setSt({ allowed: true, ...s });
      toast('Autopilot is writing posts — they appear below when it finishes');
    } catch (e) { toast(e.message); }
    setBusy('');
  };

  const res = st && st.lastResult;
  return html`<${Card}>
    <div className="flex items-center justify-between gap-2 flex-wrap">
      <p className="font-semibold text-sm">⟳ Autopilot ${st && st.allowed ? html`<${Pill} tone=${st.enabled ? 'green' : 'slate'}>${st.enabled ? 'on' : 'off'}</${Pill}>` : null}</p>
      ${f && st && st.allowed && st.ready && html`<${Btn} small kind=${f.enabled ? 'ghost' : 'primary'} onClick=${() => save(!f.enabled)} disabled=${!!busy || running}>${f.enabled ? 'Turn off' : 'Turn on'}</${Btn}>`}
    </div>
    <p className=${'text-xs mt-1 ' + muted}>Every week it drafts the coming week's posts for the brands below, with images if you like, learning from your Buffer results. Drafts appear here for you to approve. Nothing is posted until you do.</p>
    ${!st && html`<p className=${'text-xs mt-3 ' + muted}>Checking…</p>`}
    ${st && !st.allowed && html`<p className="text-xs mt-3 text-amber-700 dark:text-amber-300">${st.error || 'Autopilot can only be set up from the computer running Soulvee OS, or with SOULVEE_ACCESS_TOKEN set and the app opened once with ?token=YOUR_TOKEN.'}</p>`}
    ${st && st.allowed && !st.ready && html`<p className="text-xs mt-3 text-amber-700 dark:text-amber-300">Autopilot needs AI: add ANTHROPIC_API_KEY to the server and restart it.</p>`}
    ${f && st && st.allowed && html`<div className="mt-3 space-y-3">
      <div className="flex flex-wrap items-center gap-2 text-sm">
        <span>Every</span>
        <select className=${inputCls + ' !w-auto'} aria-label="Autopilot day" value=${f.day} onChange=${e => setF({ ...f, day: e.target.value })}>${DAY_NAMES.map((d, i) => html`<option key=${d} value=${String(i)}>${d}</option>`)}</select>
        <span>at</span>
        <input type="time" aria-label="Autopilot time" className=${inputCls + ' !w-auto'} value=${f.time} onChange=${e => setF({ ...f, time: e.target.value })} />
        <select className=${inputCls + ' !w-auto'} aria-label="Autopilot time zone" value=${f.timezone} onChange=${e => setF({ ...f, timezone: e.target.value })}>${[...new Set([f.timezone, ...ZONES])].map(z => html`<option key=${z} value=${z}>${z}</option>`)}</select>
      </div>
      <div className="space-y-2">${f.plans.map((p, i) => html`<div key=${i} className="p-3 rounded-xl bg-slate-50 dark:bg-white/5 space-y-2" data-plan=${i}>
        <div className="grid sm:grid-cols-3 gap-2">
          <select className=${inputCls} aria-label="Plan brand" value=${p.brand} onChange=${e => { setPlan(i, 'brand', e.target.value); setPlan(i, 'offerId', ''); }}>${BRANDS.map(b => html`<option key=${b.id} value=${b.id}>${b.name}</option>`)}</select>
          <select className=${inputCls} aria-label="Posts per week" value=${p.count} onChange=${e => setPlan(i, 'count', e.target.value)}>${['3', '5', '7', '10', '14'].map(n => html`<option key=${n} value=${n}>${n} posts a week</option>`)}</select>
          <select className=${inputCls} aria-label="Plan offer" value=${p.offerId || ''} onChange=${e => setPlan(i, 'offerId', e.target.value)}><option value="">No offer to push</option>${store.data.offers.filter(o => o.brand === p.brand && o.status !== 'retired').map(o => html`<option key=${o.id} value=${o.id}>Push: ${o.name}</option>`)}</select>
        </div>
        <input className=${inputCls} aria-label="Plan goal" value=${p.goal} onChange=${e => setPlan(i, 'goal', e.target.value)} placeholder="Goal, e.g. fill December wedding bookings" />
        <${PlatformToggles} value=${p.platforms} onChange=${v => setPlan(i, 'platforms', v)} />
        <div className="flex items-center justify-between gap-2 flex-wrap">
          <label className="flex items-center gap-2 text-xs"><input type="checkbox" checked=${!!p.images} disabled=${!(images && images.ready)} onChange=${e => setPlan(i, 'images', e.target.checked)} /> Make an image for each post${images && images.ready ? '' : ' (add OPENAI_API_KEY to the server)'}</label>
          ${f.plans.length > 1 && html`<button type="button" className="text-xs text-rose-500" onClick=${() => setF({ ...f, plans: f.plans.filter((_, j) => j !== i) })}>Remove</button>`}
        </div>
      </div>`)}</div>
      ${f.plans.length < 10 && html`<button type="button" className="text-xs text-violet-500 font-medium" onClick=${() => setF({ ...f, plans: [...f.plans, { brand: BRANDS.find(b => !f.plans.some(p => p.brand === b.id)) ? BRANDS.find(b => !f.plans.some(p => p.brand === b.id)).id : 'smc', count: '5', platforms: ['instagram'], goal: '', offerId: '', images: false, enabled: true }] })}>+ Add a brand</button>`}
      <div className="flex flex-wrap gap-4 text-xs">
        <label className="flex items-center gap-2"><input type="checkbox" checked=${f.learn} onChange=${e => setF({ ...f, learn: e.target.checked })} /> Learn from Buffer results${st.buffer ? '' : ' (connect Buffer first)'}</label>
        <label className="flex items-center gap-2"><input type="checkbox" checked=${f.notify} onChange=${e => setF({ ...f, notify: e.target.checked })} /> Ping my webhook when drafts are ready${st.webhook ? '' : ' (no webhook set)'}</label>
      </div>
      <div className="flex gap-2 flex-wrap">
        <${Btn} small onClick=${() => save(f.enabled)} disabled=${!!busy || running}>${busy === 'save' ? 'Saving…' : 'Save'}</${Btn}>
        <${Btn} small kind="ghost" onClick=${runNow} disabled=${!!busy || running || !st.ready}>${running ? 'Running…' : busy === 'run' ? 'Starting…' : 'Run now'}</${Btn}>
      </div>
      <div className=${'text-xs space-y-0.5 ' + muted}>
        ${running && html`<p className="text-violet-600 dark:text-violet-300 font-medium">${st.progress || 'Working'}…</p>`}
        ${st.enabled && st.nextRun && html`<p>Next run: ${fmtIn(st.nextRun, st.timezone)} (${st.timezone} time)</p>`}
        ${res && html`<p>Last run: ${fmtIn(res.at, st.timezone)} — ${res.drafts} draft${res.drafts === 1 ? '' : 's'}${res.images ? `, ${res.images} with images` : ''}${res.trigger === 'manual' ? ' (run by hand)' : ''}</p>`}
        ${res && (res.problems || []).map(pr => html`<p key=${pr} className="text-rose-600 dark:text-rose-400">✕ ${pr}</p>`)}
      </div>
    </div>`}
  <//>`;
}

    setBusy('load'); setErr('');
    try {
      const s = await window.SoulveeOS.social.status();
      setStatus(s);
      window.SoulveeOS.health().then(setServer, () => {});
      window.SoulveeOS.autopilot.status().then(setPilot, () => {});
      if (s.buffer && s.allowed) setChannels((await window.SoulveeOS.social.channels(refresh)).channels);
    } catch (e) { setErr(e.message); }
    setBusy('');
  };
  useEffect(() => { load(false); }, []);
  const map = ((store.settings.social || {}).brandChannels) || {};

    const latest = store.latestSettings();

    setBusy('hook');
    try { const r = await window.SoulveeOS.social.testWebhook(); toast(r.ok ? 'Test post sent — check your scenario received it' : r.message); }

  const row = (label, value, ok) => html`<div className="flex justify-between gap-3 text-sm py-1.5 border-b last:border-0 border-slate-100 dark:border-white/5"><span>${label}</span><span className=${ok ? 'text-emerald-600 dark:text-emerald-400 font-medium' : muted}>${value}</span></div>`;
  return html`<${Card}>
    <div className="flex items-center justify-between gap-2 mb-2 flex-wrap"><p className="font-semibold text-sm">Social publishing</p><${Btn} small kind="ghost" onClick=${() => load(true)} disabled=${!!busy}>${busy === 'load' ? 'Checking…' : 'Refresh'}</${Btn}></div>
    ${err && html`<p className="text-sm text-rose-600 dark:text-rose-400 mb-2">${err}</p>`}
    ${status && html`<div>
      ${row('Buffer (Instagram, TikTok, Facebook, LinkedIn, X, Threads, YouTube, Pinterest)', status.buffer ? 'Connected' : 'Not set up', status.buffer)}
      ${row('Webhook (Make, Zapier, n8n)', status.webhook ? (status.signed ? 'On · signed' : 'On') : 'Not set up', status.webhook)}
      ${row('Publishing from this device', status.allowed ? 'Allowed' : 'Locked', status.allowed)}
      ${server && server.images && row('Images (OpenAI' + (server.images.ready ? ' · ' + server.images.model : '') + ')', !server.images.ready ? 'Not set up' : server.images.hosting === 'cloudinary' ? 'On · Cloudinary' : server.images.hosting === 'server' ? 'On · PUBLIC_URL' : 'On · this server only', server.images.ready)}
      ${pilot && pilot.allowed && row('Autopilot', pilot.enabled ? `On · next ${fmtIn(pilot.nextRun, pilot.timezone)}` : 'Off (set it up in Content)', pilot.enabled)}
    </div>`}
    ${server && server.images && server.images.ready && server.images.hosting === 'local' && html`<p className="text-xs mt-3 text-amber-700 dark:text-amber-300">Images are kept on this server only, so Buffer can't fetch them. Add CLOUDINARY_URL (or PUBLIC_URL if the server is online) and restart.</p>`}
    ${server && server.images && !server.images.ready && html`<p className=${'text-xs mt-3 ' + muted}>To make images from each post's brief, add OPENAI_API_KEY and CLOUDINARY_URL to the server's .env and restart it.</p>`}
    ${status && !status.buffer && !status.webhook && html`<p className=${'text-xs mt-3 ' + muted}>To post automatically, add BUFFER_API_KEY (from Buffer → Settings → API) or SOCIAL_WEBHOOK_URL to the server's .env and restart it. Until then, posts can be copied and posted by hand. The README has the steps.</p>`}
    ${status && !status.allowed && (status.buffer || status.webhook) && html`<p className="text-xs mt-3 text-amber-700 dark:text-amber-300">Publishing works only from the computer running Soulvee OS until SOULVEE_ACCESS_TOKEN is set. Then open the app once with ?token=YOUR_TOKEN on each device.</p>`}
    ${status && status.webhook && status.allowed && html`<div className="mt-3"><${Btn} small kind="ghost" onClick=${testHook} disabled=${!!busy}>${busy === 'hook' ? 'Sending…' : 'Send a test post to the webhook'}</${Btn}></div>`}

          ${BRANDS.map(b => html`<td key=${b.id} className="text-center px-1"><input type="checkbox" aria-label=${(c.displayName || c.name) + ' for ' + b.short} checked=${(map[b.id] || []).includes(c.id)} onChange=${() => toggle(b.id, c.id)} /></td>`)}

function printInvoice(inv, settings) {

  const rows = (inv.items || []).map(i => `<tr><td>${esc(i.desc)}</td><td class="r">${esc(ngn(i.amount))}</td></tr>`).join('');
  w.document.write(`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${esc(inv.number)}</title><style>
    @page { size: A4; margin: 18mm; }
    body { font-family: Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: #111827; margin: 0; font-size: 13px; }
