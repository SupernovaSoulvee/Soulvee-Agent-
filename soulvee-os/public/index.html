/* ---------------- Money ---------------- */
function InvoiceModal({ invoice, deal, store, onClose, toast }) {
  const { data, settings, add, update, saveSettings } = store;
  const offer = deal && data.offers.find(o => o.id === deal.offerId);
  const whtStart = ['0', '5', '10'].includes(String(num(settings.whtDefault))) ? String(num(settings.whtDefault)) : '0';
  const [f, setF] = useState(() => invoice && invoice.id ? { ...invoice, items: (invoice.items && invoice.items.length ? invoice.items : [{ desc: '', amount: '' }]).map(i => ({ ...i })) } : {
    client: deal ? deal.client : '', clientEmail: deal ? (deal.email || '') : '', brand: deal ? deal.brand : 'smc',
    items: [{ desc: deal ? (offer ? offer.name : 'Services') : '', amount: deal ? String(deal.value || '') : '' }],
    vat: true, wht: whtStart, issueDate: localDate(), dueDate: addDays(localDate(), 14), notes: '', status: 'draft',
    offerId: deal ? (deal.offerId || '') : '', dealId: deal ? deal.id : '',
  });
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const setItem = (i, k, v) => setF(p => ({ ...p, items: p.items.map((it, j) => j === i ? { ...it, [k]: v } : it) }));
  const t = invTotals(f, settings);
  const number = f.number || invNumber(f.client, settings.invoiceSeq);
  const save = async () => {
    const doc = { ...f, number, items: f.items.filter(i => i.desc || num(i.amount)).map(i => ({ desc: i.desc, amount: num(i.amount) })), wht: num(f.wht) };
    if (invoice && invoice.id) await update('invoices', invoice.id, doc);
    else {
      await add('invoices', doc);
      if (!f.number) await saveSettings({ ...settings, invoiceSeq: num(settings.invoiceSeq) + 1 });
      if (deal && deal.stage !== 'won') await update('deals', deal.id, { stage: 'won', prob: 100 });
    }
    toast('Invoice saved'); onClose();
  };
  return html`<${Modal} title=${invoice && invoice.id ? 'Edit invoice' : 'New invoice'} wide onClose=${onClose} footer=${html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} disabled=${!String(f.client).trim() || t.sub <= 0} onClick=${save}>Save invoice</${Btn}>`}>
    <div className="grid sm:grid-cols-2 gap-3">
      <${Field} label="Invoice number" hint="Format INV-SMC-[client]-[number]"><${Input} value=${number} onChange=${e => set('number', e.target.value)} /><//>
      <${Field} label="Brand"><${Select} value=${f.brand} onChange=${v => set('brand', v)} options=${brandOptions} /><//>
      <${Field} label="Client"><${Input} value=${f.client} onChange=${e => set('client', e.target.value)} /><//>
      <${Field} label="Client email"><${Input} type="email" value=${f.clientEmail} onChange=${e => set('clientEmail', e.target.value)} /><//>
      <${Field} label="Issue date"><${Input} type="date" value=${f.issueDate} onChange=${e => set('issueDate', e.target.value)} /><//>
      <${Field} label="Due date"><${Input} type="date" value=${f.dueDate} onChange=${e => set('dueDate', e.target.value)} /><//>
    </div>
    <div className="mt-4">
      <div className="flex items-center justify-between mb-2"><p className="text-sm font-semibold">Line items (₦, pre-VAT)</p><button className="text-xs text-violet-500 font-medium" onClick=${() => set('items', [...f.items, { desc: '', amount: '' }])}>+ Add line</button></div>
      <div className="space-y-2">${f.items.map((it, i) => html`<div key=${i} className="flex gap-2"><input className=${inputCls} placeholder="Description" value=${it.desc} onChange=${e => setItem(i, 'desc', e.target.value)} /><input className=${inputCls + ' !w-36'} inputMode="numeric" placeholder="Amount" value=${it.amount} onChange=${e => setItem(i, 'amount', e.target.value)} />${f.items.length > 1 && html`<button className="text-rose-500 text-xs px-1" onClick=${() => set('items', f.items.filter((_, j) => j !== i))}>✕</button>`}</div>`)}</div>
    </div>
    <div className="grid sm:grid-cols-2 gap-3 mt-4">
      <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked=${!!f.vat} onChange=${e => set('vat', e.target.checked)} /> Charge VAT (${settings.vatRate}%)</label>
      <${Field} label="WHT the client deducts"><${Select} value=${String(f.wht)} onChange=${v => set('wht', v)} options=${[{ v: '0', l: 'None' }, { v: '5', l: '5%' }, { v: '10', l: '10%' }]} /><//>
      <${Field} label="Notes on invoice" className="sm:col-span-2"><${Input} value=${f.notes} onChange=${e => set('notes', e.target.value)} placeholder="e.g. 70% deposit, 30% on delivery" /><//>
    </div>
    <div className="mt-4 p-4 rounded-xl bg-slate-50 dark:bg-white/5 text-sm space-y-1">
      <div className="flex justify-between"><span className=${muted}>Subtotal</span><span>${ngn(t.sub)}</span></div>
      <div className="flex justify-between"><span className=${muted}>VAT</span><span>${ngn(t.vat)}</span></div>
      <div className="flex justify-between font-bold"><span>Invoice total</span><span>${ngn(t.total)}</span></div>
      ${t.wht > 0 && html`<div className="flex justify-between text-xs"><span className=${muted}>Less WHT (credit note to collect)</span><span>−${ngn(t.wht)}</span></div><div className="flex justify-between text-xs font-semibold"><span>Expected in account</span><span>${ngn(t.net)}</span></div>`}
    </div>
  <//>`;
}

function invoiceText(inv, settings) {
  const t = invTotals(inv, settings); const c = settings.company;
  return [
    c.name, `${c.bn} · ${c.address}`, `${c.phone} · ${c.email}`, '',
    `INVOICE ${inv.number}`, `Issued: ${fmtDate(inv.issueDate)}   Due: ${fmtDate(inv.dueDate)}`, `Bill to: ${inv.client}${inv.clientEmail ? ' <' + inv.clientEmail + '>' : ''}`, '',
    ...(inv.items || []).map(i => `• ${i.desc} — ${ngn(i.amount)}`), '',
    `Subtotal: ${ngn(t.sub)}`, `VAT (${inv.vat ? settings.vatRate : 0}%): ${ngn(t.vat)}`, `TOTAL: ${ngn(t.total)}`,
    ...(t.wht > 0 ? [`WHT (${inv.wht}%) deducted by client: ${ngn(t.wht)} — please send the credit note`, `Amount payable: ${ngn(t.net)}`] : []), '',
    `Payment: ${c.payment}`, ...(inv.notes ? [`Notes: ${inv.notes}`] : []), 'Thank you for your business.',
  ].join('\n');
}

function PaidModal({ inv, store, toast, onClose }) {
  const { settings, add, update } = store;
  const t = invTotals(inv, settings);
  const payText = String(settings.company.payment || '').toLowerCase();
  const [f, setF] = useState({ date: localDate(), method: METHODS.find(m => payText.includes(m.toLowerCase())) || 'Moniepoint', currency: 'NGN', amount: String(Math.round(t.net)), fx: '' });
  const [touched, setTouched] = useState(false);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  // Until the amount is edited by hand, keep it equal to the invoice total in the chosen currency.
  const setCurrency = v => setF(p => {
    if (touched) return { ...p, currency: v };
    const r = v === 'NGN' ? 1 : num(settings.fx[v]);
    return { ...p, currency: v, fx: '', amount: r ? String(Math.round(t.net / r * 100) / 100) : '' };
  });
  const rate = f.currency === 'NGN' ? 1 : (num(f.fx) || num(settings.fx[f.currency]));
  const ngnVal = num(f.amount) * rate;
  const save = async () => {
    await add('ledger', { type: 'income', brand: inv.brand, amount: num(f.amount), currency: f.currency, fx: rate, ngn: ngnVal, method: f.method, date: f.date, note: `${inv.number} — ${inv.client}`, invoiceId: inv.id, offerId: inv.offerId || '' });
    await update('invoices', inv.id, { status: 'paid', paidDate: f.date, paidNgn: ngnVal });
    toast(`${inv.number} marked paid · ${ngn(ngnVal)} logged`); onClose();
  };
  return html`<${Modal} title=${'Record payment · ' + inv.number} onClose=${onClose} footer=${html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} kind="good" disabled=${!(ngnVal > 0)} onClick=${save}>Mark paid</${Btn}>`}>
    <div className="grid grid-cols-2 gap-3">
      <${Field} label="Date received"><${Input} type="date" value=${f.date} onChange=${e => set('date', e.target.value)} /><//>
      <${Field} label="Method"><${Select} value=${f.method} onChange=${v => set('method', v)} options=${METHODS} /><//>
      <${Field} label="Currency received"><${Select} value=${f.currency} onChange=${setCurrency} options=${CURRENCIES} /><//>
      <${Field} label="Amount received"><${Input} inputMode="decimal" value=${f.amount} onChange=${e => { setTouched(true); set('amount', e.target.value); }} /><//>
      ${f.currency !== 'NGN' && html`<${Field} label=${`Rate used (₦ per 1 ${f.currency})`} className="col-span-2" hint="Enter the rate you actually got — this is what converts it into NGN revenue."><${Input} inputMode="decimal" value=${f.fx || (num(settings.fx[f.currency]) || '')} onChange=${e => set('fx', e.target.value)} /><//>`}
    </div>
    <p className="mt-4 text-sm">Logs <span className="font-bold">${ngn(ngnVal)}</span> to ${brandOf(inv.brand).short} revenue.${t.wht > 0 ? ` Remember to collect the ${ngn(t.wht)} WHT credit note.` : ''}</p>
  <//>`;
}

function MoneyView({ store, toast, openInvoice }) {
  const { data, settings, update, remove } = store;
  const [sub, setSub] = useState('invoices');
  const [paying, setPaying] = useState(null);
  const [text, setText] = useState(null);
  const [ledgerOpen, setLedgerOpen] = useState(false);
  const [period, setPeriod] = useState('h2');
  const [ledgerBrand, setLedgerBrand] = useState('all');
  const s = useMemo(() => computeSnapshot(data, settings, period), [data, settings, period]);
  const invoices = [...data.invoices].sort((a, b) => String(b.issueDate).localeCompare(String(a.issueDate)));
  const ledger = data.ledger.filter(l => ledgerBrand === 'all' || l.brand === ledgerBrand).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const paidInPeriod = data.invoices.filter(i => i.status === 'paid' && inPeriod(i.paidDate, period));
  const vatCollected = paidInPeriod.reduce((a, i) => a + invTotals(i, settings).vat, 0);
  const whtCredits = paidInPeriod.reduce((a, i) => a + invTotals(i, settings).wht, 0);
  const allocTotal = settings.alloc.reduce((a, b) => a + num(b.pct), 0);
  const allocBase = Math.max(0, s.net - vatCollected);

  const copy = async t => { try { await navigator.clipboard.writeText(t); toast('Copied'); } catch (e) { toast('Copy blocked — select the text and copy it manually'); } };
  // Reverses "Mark paid": removes the payment from the ledger and reopens the invoice.
  const unpay = async inv => {
    const entries = data.ledger.filter(l => l.invoiceId === inv.id);
    if (!confirm(`Undo the payment on ${inv.number}? It goes back to unpaid${entries.length ? ' and the payment is removed from the ledger' : ''}.`)) return;
    for (const l of entries) await remove('ledger', l.id);
    await update('invoices', inv.id, { status: 'sent', paidDate: '', paidNgn: 0 });
    toast(`${inv.number} is unpaid again`);
  };
  const delEntry = async l => {
    const inv = l.invoiceId && data.invoices.find(i => i.id === l.invoiceId);
    if (inv) return unpay(inv);
    if (!sure('this entry')) return;
    await remove('ledger', l.id);
    toast('Entry deleted');
  };

  return html`<div className="space-y-5">
    <${Section} title="Money" sub="Invoice it, collect it, convert it, allocate it." action=${html`<${Chips} value=${sub} onChange=${setSub} options=${[{ v: 'invoices', l: 'Invoices' }, { v: 'ledger', l: 'Ledger' }, { v: 'alloc', l: 'Allocate & tax' }]} />`} />

    ${sub === 'invoices' && html`<div className="space-y-3">
      <div className="flex justify-between items-center"><p className=${'text-sm ' + muted}>${ngn(s.outstanding)} outstanding across ${s.openInvoices} invoice${s.openInvoices === 1 ? '' : 's'}</p><${Btn} small onClick=${() => openInvoice(null)}>+ Invoice</${Btn}></div>
      ${invoices.length === 0 ? html`<${Card}><${Empty} title="No invoices yet">Win a deal in the pipeline or tap + Invoice.<//><//>` : invoices.map(inv => {
        const st = invStatus(inv); const t = invTotals(inv, settings);
        return html`<${Card} key=${inv.id}>
          <div className="flex items-start justify-between gap-2">
            <div className="min-w-0"><p className="font-semibold text-sm truncate">${inv.number}</p><p className=${'text-xs ' + muted}>${inv.client} · due ${fmtDate(inv.dueDate)}</p><div className="flex gap-1.5 mt-1"><${BrandChip} id=${inv.brand} /><${Pill} tone=${st === 'paid' ? 'green' : st === 'overdue' ? 'red' : st === 'sent' ? 'blue' : 'slate'}>${st}</${Pill}></div></div>
            <div className="text-right shrink-0"><p className="font-bold">${ngn(t.total)}</p>${t.wht > 0 && html`<p className=${'text-[11px] ' + muted}>net ${ngn(t.net)}</p>`}${inv.vat && html`<p className=${'text-[11px] ' + muted}>incl. VAT ${ngn(t.vat)}</p>`}</div>
          </div>
          <div className="flex gap-2 mt-3 flex-wrap">
            ${st === 'draft' && html`<${Btn} small onClick=${() => update('invoices', inv.id, { status: 'sent' })}>Mark sent</${Btn}>`}
            ${st !== 'paid' && html`<${Btn} small kind="good" onClick=${() => setPaying(inv)}>Mark paid</${Btn}>`}
            <${Btn} small kind="ghost" onClick=${() => { if (!printInvoice(inv, settings)) toast('Allow pop-ups for Soulvee OS to open the PDF'); }}>PDF</${Btn}>
            <${Btn} small kind="ghost" onClick=${() => setText(invoiceText(inv, settings))}>Invoice text</${Btn}>
            <${Btn} small kind="ghost" onClick=${() => openInvoice(inv)}>Edit</${Btn}>
            ${st === 'paid' && html`<${Btn} small kind="ghost" onClick=${() => unpay(inv)}>Undo paid</${Btn}>`}
            ${st !== 'paid' && html`<${Btn} small kind="danger" onClick=${() => sure(inv.number) && remove('invoices', inv.id)}>Delete</${Btn}>`}
          </div>
        <//>`;
      })}
    </div>`}

    ${sub === 'ledger' && html`<div className="space-y-3">
      <div className="flex justify-between items-center gap-2"><${Chips} value=${ledgerBrand} onChange=${setLedgerBrand} options=${[{ v: 'all', l: 'All' }, ...BRANDS.map(b => ({ v: b.id, l: b.short }))]} /><${Btn} small onClick=${() => setLedgerOpen(true)}>+ Entry</${Btn}></div>
      <${Card} className="!p-0 overflow-hidden">
        ${ledger.length === 0 ? html`<${Empty} title="Ledger is empty">Paid invoices land here automatically. Log Selar, Spreadshop or gig cash with + Entry.<//>` : ledger.map(l => html`<div key=${l.id} className="flex items-center justify-between gap-2 px-4 py-3 border-b last:border-0 border-slate-100 dark:border-white/5">
          <div className="min-w-0"><p className="text-sm font-medium truncate">${l.note || l.method}</p><p className=${'text-[11px] ' + muted}>${fmtDate(l.date)} · ${brandOf(l.brand).short} · ${l.method}${l.currency !== 'NGN' ? ` · ${l.currency} ${num(l.amount).toLocaleString()} @ ₦${num(l.fx).toLocaleString()}` : ''}</p></div>
          <div className="flex items-center gap-2 shrink-0"><span className=${'font-semibold text-sm ' + (l.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400')}>${l.type === 'income' ? '+' : '−'}${ngn(l.ngn)}</span><button className="text-xs text-rose-500 px-1" aria-label="Delete entry" title=${l.invoiceId ? 'Undo this payment' : 'Delete entry'} onClick=${() => delEntry(l)}>✕</button></div>
        </div>`)}
      <//>
    </div>`}

    ${sub === 'alloc' && html`<div className="space-y-4">
      <${Chips} value=${period} onChange=${setPeriod} options=${Object.entries(PERIODS).map(([v, p]) => ({ v, l: p.label }))} />
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <${Stat} label="Collected" value=${ngnShort(s.income)} grad="from-emerald-500 to-teal-600" />
        <${Stat} label="Costs" value=${ngnShort(s.expenses)} grad="from-rose-500 to-pink-600" />
        <${Stat} label="VAT to remit" value=${ngnShort(vatCollected)} sub="Collected on paid invoices" grad="from-amber-500 to-orange-600" />
        <${Stat} label="WHT credits" value=${ngnShort(whtCredits)} sub="Credit notes to collect" grad="from-sky-500 to-blue-600" />
      </div>
      <${Card}>
        <div className="flex justify-between items-center mb-3"><p className="font-semibold text-sm">Allocate ${ngn(allocBase)}</p><span className=${'text-[11px] ' + muted}>Net collected minus VAT owed</span></div>
        ${allocTotal !== 100 && html`<p className="text-xs text-amber-600 dark:text-amber-400 mb-2">Your buckets add up to ${allocTotal}% — adjust them in Setup.</p>`}
        <div className="space-y-2">${settings.alloc.map((a, i) => html`<div key=${i} className="flex items-center gap-3"><span className="w-32 sm:w-40 text-sm truncate">${a.name}</span><div className="flex-1 h-2 rounded-full bg-slate-100 dark:bg-white/10 overflow-hidden"><div className="h-full bg-gradient-to-r from-violet-600 to-fuchsia-500" style=${{ width: Math.min(100, num(a.pct)) + '%' }}></div></div><span className=${'w-10 text-right text-xs ' + muted}>${num(a.pct)}%</span><span className="w-28 text-right text-sm font-semibold">${ngn(allocBase * num(a.pct) / 100)}</span></div>`)}</div>
      <//>
      <${Card} className="!p-0 overflow-hidden">

function parseSender(s) {
  if (!s) return { name: '', email: '' };
  if (typeof s === 'object') return { name: s.displayName || s.name || s.email || '', email: s.email || s.emailAddress || '' };
  const m = String(s).match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>/);
  if (m) return { name: m[1] || m[2], email: m[2] };
  return { name: s, email: String(s).includes('@') ? s : '' };
}
function parseThreads(p) {
  const arr = (p && (p.threads || p.items)) || (Array.isArray(p) ? p : []);
  return arr.map(t => {
    const msgs = t.messages || [];
    const first = msgs[0] || {}; const last = msgs[msgs.length - 1] || first;
    return { id: t.id, subject: first.subject || last.subject || t.subject || '(no subject)', from: parseSender(last.sender || first.sender || t.sender), date: last.date || first.date || '', snippet: last.snippet || first.snippet || t.snippet || '', url: t.viewUrl || last.viewUrl || first.viewUrl || '' };
  });
}
function parseEvents(p) {
  const arr = (p && (p.events || p.items)) || (Array.isArray(p) ? p : []);
  return arr.map(e => {
    const st = e.start || e.startTime; const start = typeof st === 'object' && st ? (st.dateTime || st.date) : st;
    return { id: e.id || uid(), title: e.summary || '(untitled)', start, location: e.location || '', url: e.htmlLink || e.viewUrl || '', meet: e.hangoutLink || e.googleMeetUrl || '' };
  });
}

];

            ${m.content || (busy && i === msgs.length - 1 ? html`<span className=${muted}>Thinking…</span>` : '')}

      <${Field} label="Brand it earns for"><${Select} value=${f.brand} onChange=${v => set('brand', v)} options=${brandOptions} /><//>
      <${Field} label="Levels done (0–5)"><${Input} inputMode="numeric" value=${f.level} onChange=${e => set('level', e.target.value)} /><//>
      <${Field} label="Unlocks offer" className="col-span-2"><${Select} value=${f.offerId} onChange=${v => set('offerId', v)} options=${[{ v: '', l: '— none —' }, ...offers.map(o => ({ v: o.id, l: o.name }))]} /><//>
      <${Field} label="Goal" className="col-span-2"><${Input} value=${f.goal} onChange=${e => set('goal', e.target.value)} placeholder="What being good at this lets you sell" /><//>
      <${Field} label="Notes" className="col-span-2"><${Area} rows="2" value=${f.notes} onChange=${e => set('notes', e.target.value)} /><//>
    </div>
  <//>`;
}

function LearnView({ store, caps, toast }) {
  const { data, add, update, remove } = store;
  const [editing, setEditing] = useState(null);
  const [lesson, setLesson] = useState(null);
  const offerOf = id => data.offers.find(o => o.id === id);
  const tracks = [...data.learning].sort((a, b) => num(a.level) - num(b.level));

  const teach = async t => {
    if (!caps.sample) return;
    const o = offerOf(t.offerId); const lvl = Math.min(5, num(t.level) + 1);
    setLesson({ track: t, level: lvl, text: '', busy: true });
    try {
      const r = await caps.sample(`You are a practical tutor for Soulvee, a Lagos-based solo founder (DJ, radio broadcaster, hospitality-tech and AI-automation consultant) who learns by doing and prefers systems over hustle.
Teach Level ${lvl} of 5 in: ${t.title}.
${t.goal ? 'His goal: ' + t.goal + '.' : ''} ${o ? `This skill powers the offer "${o.name}"${(o.tiers || []).some(x => num(x.price) > 0) ? ' priced from ' + ngn(Math.min(...o.tiers.filter(x => num(x.price) > 0).map(x => num(x.price)))) : ''}.` : ''} ${t.notes ? 'Notes so far: ' + t.notes : ''}
Levels: 1 foundations, 2 core workflow, 3 real project, 4 client-ready delivery, 5 productise and scale. Pitch it exactly at Level ${lvl}.
Format as plain text with these labels on their own lines: GOAL, KEY IDEAS (3-5 dashes), DO THIS NOW (one 30-60 minute hands-on task with steps), TURN IT INTO MONEY (how this level makes the offer more sellable, NGN angle), CHECK YOURSELF (3 short questions). Under 350 words. No markdown symbols.`, { effort: 'low', onText: ({ text }) => setLesson(l => l && { ...l, text }) });
      setLesson(l => l && { ...l, text: (r.text || '').trim(), busy: false });
    } catch (e) { setLesson(l => l && { ...l, text: sampleMessage(e), busy: false }); }
  };

  return html`<div className="space-y-5">
    <${Section} title="Learn → Earn" sub="Every skill you level up is tied to an offer it makes sellable." action=${html`<${Btn} small onClick=${() => setEditing({})}>+ Track</${Btn}>`} />
    ${tracks.length === 0 ? html`<${Card}><${Empty} title="No learning tracks yet">Add the skills you're building — MCP servers, Google Workspace automation, SambaPOS — and link each to the offer it unlocks.<//><//>` : html`<div className="grid md:grid-cols-2 gap-3">${tracks.map(t => {
      const o = offerOf(t.offerId); const lvl = num(t.level);
      return html`<${Card} key=${t.id}>
        <div className="flex items-start justify-between gap-2"><div className="min-w-0"><p className="font-semibold">${t.title}</p><div className="flex gap-1.5 mt-1 flex-wrap"><${BrandChip} id=${t.brand} />${lvl >= 5 ? html`<${Pill} tone="green">mastered</${Pill}>` : html`<${Pill} tone="violet">Level ${lvl}/5</${Pill}>`}</div></div></div>
        <div className="flex gap-1 mt-3">${[1, 2, 3, 4, 5].map(n => html`<div key=${n} className=${'h-1.5 flex-1 rounded-full ' + (n <= lvl ? 'bg-gradient-to-r from-violet-600 to-fuchsia-500' : 'bg-slate-200 dark:bg-white/10')}></div>`)}</div>
        ${t.goal && html`<p className=${'text-xs mt-2 ' + muted}>${t.goal}</p>`}
        ${o && html`<p className="text-xs mt-1">Unlocks: <span className="font-medium">${o.name}</span></p>`}
        <div className="flex gap-2 mt-3 flex-wrap">
          ${lvl < 5 && caps.sample && html`<${Btn} small onClick=${() => teach(t)}>Level ${lvl + 1} lesson</${Btn}>`}
          ${lvl < 5 && html`<${Btn} small kind="good" onClick=${() => { update('learning', t.id, { level: lvl + 1 }); toast(`${t.title}: Level ${lvl + 1} done`); }}>Mark level done</${Btn}>`}
          <${Btn} small kind="ghost" onClick=${() => setEditing(t)}>Edit</${Btn}>
          <${Btn} small kind="danger" onClick=${() => sure(`the "${t.title}" track`) && remove('learning', t.id)}>Delete</${Btn}>
        </div>
      <//>`;
    })}</div>`}
    ${lesson && html`<${Modal} title=${`${lesson.track.title} · Level ${lesson.level}`} wide onClose=${() => setLesson(null)} footer=${html`<${Btn} kind="ghost" onClick=${() => setLesson(null)}>Close</${Btn}>${!lesson.busy && html`<${Btn} kind="good" onClick=${() => { update('learning', lesson.track.id, { level: lesson.level }); toast('Level completed'); setLesson(null); }}>I've done it — mark Level ${lesson.level}</${Btn}>`}`}>
      <div className="text-sm whitespace-pre-wrap leading-relaxed">${lesson.text || html`<span className=${muted}>Preparing your lesson…</span>`}</div>
    <//>`}
    ${editing && html`<${TrackModal} track=${editing} offers=${data.offers} onClose=${() => setEditing(null)} onSave=${async v => { if (editing.id) await update('learning', editing.id, v); else await add('learning', v); setEditing(null); toast('Track saved'); }} />`}
  </div>`;
}

/* ---------------- Setup ---------------- */
function SetupView({ store, caps, toast }) {
  const { settings, saveSettings, mode, readOnly } = store;
  const [f, setF] = useState(() => JSON.parse(JSON.stringify(settings)));
  const savedKey = JSON.stringify({ ...settings, theme: '', social: '' });
  useEffect(() => { setF(JSON.parse(JSON.stringify(settings))); }, [savedKey]);
  const setC = (k, v) => setF(p => ({ ...p, company: { ...p.company, [k]: v } }));
  const allocTotal = f.alloc.reduce((a, b) => a + num(b.pct), 0);
  const save = async () => { await saveSettings({ ...f, theme: settings.theme, social: store.latestSettings().social, h2Target: num(f.h2Target), vatRate: num(f.vatRate), whtDefault: num(f.whtDefault), invoiceSeq: Math.max(1, num(f.invoiceSeq)), fx: { USD: num(f.fx.USD), GBP: num(f.fx.GBP), EUR: num(f.fx.EUR) }, alloc: f.alloc.map(a => ({ name: a.name, pct: num(a.pct) })) }); toast('Setup saved'); };
  const setTheme = t => saveSettings({ ...settings, theme: t });

  return html`<div className="space-y-5">
    <${Section} title="Setup" sub="Business details, targets, rates and how money gets split." />
    <${Card}>
      <p className="font-semibold text-sm mb-3">Appearance</p>
      <div className="grid grid-cols-2 gap-3 max-w-sm">${[{ v: 'dark', l: '🌙 Night' }, { v: 'light', l: '☀️ Day' }].map(o => html`<button key=${o.v} onClick=${() => setTheme(o.v)} className=${'p-4 rounded-2xl border-2 text-sm font-medium ' + (settings.theme === o.v ? 'border-violet-500 bg-violet-50 dark:bg-violet-500/10' : 'border-slate-200 dark:border-white/10')}>${o.l}</button>`)}</div>
    <//>
    <${Card}>
      <p className="font-semibold text-sm mb-3">Business (shown on invoices)</p>
      <div className="grid sm:grid-cols-2 gap-3">
        <${Field} label="Business name"><${Input} value=${f.company.name} onChange=${e => setC('name', e.target.value)} /><//>
        <${Field} label="Registration"><${Input} value=${f.company.bn} onChange=${e => setC('bn', e.target.value)} /><//>
        <${Field} label="Address" className="sm:col-span-2"><${Input} value=${f.company.address} onChange=${e => setC('address', e.target.value)} /><//>
        <${Field} label="Phone"><${Input} value=${f.company.phone} onChange=${e => setC('phone', e.target.value)} /><//>
        <${Field} label="Email"><${Input} value=${f.company.email} onChange=${e => setC('email', e.target.value)} /><//>
        <${Field} label="Payment instructions" className="sm:col-span-2" hint="Printed on invoice text, e.g. bank name and account name"><${Input} value=${f.company.payment} onChange=${e => setC('payment', e.target.value)} /><//>
      </div>
    <//>
    <${Card}>
      <p className="font-semibold text-sm mb-3">Targets, tax & conversion</p>
      <div className="grid sm:grid-cols-3 gap-3">
        <${Field} label=${`H2 ${year} target (₦)`} className="sm:col-span-3"><${Input} inputMode="numeric" value=${f.h2Target || ''} onChange=${e => setF({ ...f, h2Target: e.target.value })} placeholder="Combined target across all brands" /><//>
        <${Field} label="VAT rate %"><${Input} inputMode="decimal" value=${f.vatRate} onChange=${e => setF({ ...f, vatRate: e.target.value })} /><//>
        <${Field} label="Typical WHT %"><${Input} inputMode="decimal" value=${f.whtDefault} onChange=${e => setF({ ...f, whtDefault: e.target.value })} /><//>
        <${Field} label="Next invoice no."><${Input} inputMode="numeric" value=${f.invoiceSeq} onChange=${e => setF({ ...f, invoiceSeq: e.target.value })} /><//>
        ${['USD', 'GBP', 'EUR'].map(c => html`<${Field} key=${c} label=${`₦ per 1 ${c}`}><${Input} inputMode="decimal" value=${f.fx[c] || ''} onChange=${e => setF({ ...f, fx: { ...f.fx, [c]: e.target.value } })} placeholder="Today's rate" /><//>`)}
      </div>
      <p className=${'text-[11px] mt-2 ' + muted}>Rates aren't fetched live — enter what you're actually getting. Each payment keeps the rate it was recorded at.</p>
    <//>
    <${Card}>
      <div className="flex justify-between items-center mb-3"><p className="font-semibold text-sm">Allocation buckets</p><span className=${'text-xs font-semibold ' + (allocTotal === 100 ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400')}>${allocTotal}%</span></div>
      <div className="space-y-2">${f.alloc.map((a, i) => html`<div key=${i} className="flex gap-2"><input className=${inputCls} value=${a.name} onChange=${e => setF({ ...f, alloc: f.alloc.map((x, j) => j === i ? { ...x, name: e.target.value } : x) })} /><input className=${inputCls + ' !w-20'} inputMode="numeric" value=${a.pct} onChange=${e => setF({ ...f, alloc: f.alloc.map((x, j) => j === i ? { ...x, pct: e.target.value } : x) })} /><button className="text-rose-500 text-xs px-1" onClick=${() => setF({ ...f, alloc: f.alloc.filter((_, j) => j !== i) })}>✕</button></div>`)}</div>
      <button className="text-xs text-violet-500 font-medium mt-2" onClick=${() => setF({ ...f, alloc: [...f.alloc, { name: 'New bucket', pct: 0 }] })}>+ Add bucket</button>
    <//>
    <${AiCheck} caps=${caps} />
    <${SocialSetup} store=${store} toast=${toast} />
    <${Card}>
      <p className="font-semibold text-sm mb-1">Backup & restore</p>
      <p className=${'text-xs mb-3 ' + muted}>Your data lives in this browser. Export a backup file to keep it safe or move it to another device.</p>
      <div className="flex gap-2 flex-wrap">
        <${Btn} small onClick=${() => window.SoulveeOS.exportData()}>Export backup</${Btn}>
        <label className="px-3 py-1.5 text-xs rounded-xl bg-slate-100 dark:bg-white/10 font-medium cursor-pointer">Restore from file<input type="file" accept="application/json,.json" className="hidden" onChange=${async e => { const file = e.target.files && e.target.files[0]; e.target.value = ''; if (!file) return; if (!confirm('Replace all data on this device with this backup?')) return; try { await window.SoulveeOS.importData(file); toast('Backup restored'); } catch (err) { toast('Restore failed: ' + err.message); } }} /></label>
      </div>
    <//>
    <div className="flex items-center justify-between gap-3 flex-wrap">
      <p className=${'text-[11px] ' + muted}>Storage: ${mode === 'db' ? 'saved on this device — export a backup regularly' : 'connecting…'} · AI ${caps.sample ? 'on' : 'off'}${caps.mcp ? ' · Google ready' : ''}</p>
      <${Btn} onClick=${save} disabled=${readOnly}>Save setup</${Btn}>
    </div>
  </div>`;
}

/* ---------------- App shell ---------------- */
const TABS = [
  { id: 'command', label: 'Command', icon: '◎' },
  { id: 'skills', label: 'Skills → Revenue', icon: '✦' },
  { id: 'pipeline', label: 'Pipeline', icon: '▤' },
  { id: 'content', label: 'Content', icon: '✎' },
  { id: 'money', label: 'Money', icon: '₦' },
  { id: 'workspace', label: 'Google', icon: '✉' },
  { id: 'assistant', label: 'AI Agent', icon: '✧' },
  { id: 'learn', label: 'Learn', icon: '◈' },
  { id: 'setup', label: 'Setup', icon: '⚙' },
];

function App() {
  const [toastMsg, setToastMsg] = useState(null);
  const toastTimer = useRef(null);
  const toast = m => { setToastMsg(m); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToastMsg(null), 3000); };
  const store = useStore(toast);
  const [tab, setTab] = useState(() => { const h = (location.hash || '').slice(1); return TABS.some(t => t.id === h) ? h : 'command'; });
  const [caps, setCaps] = useState({ sample: undefined, mcp: undefined });
  const [dealEdit, setDealEdit] = useState(null);
  const [invEdit, setInvEdit] = useState(null);
  const [contentPrefill, setContentPrefill] = useState(null);

  useEffect(() => { document.documentElement.classList.toggle('dark', store.settings.theme !== 'light'); }, [store.settings.theme]);
  useEffect(() => {
    const onHash = () => { const h = (location.hash || '').slice(1); if (TABS.some(t => t.id === h)) setTab(h); };
    window.addEventListener('hashchange', onHash); return () => window.removeEventListener('hashchange', onHash);
  }, []);
  useEffect(() => { (async () => { const [s, m] = await Promise.all([getCap('sample'), getCap('mcp')]); setCaps({ sample: s, mcp: m }); })(); }, []);
  // Gmail and Calendar need claude.ai connectors; without them the Google tab would be a dead end.
  const tabs = TABS.filter(t => t.id !== 'workspace' || caps.mcp !== null);
  useEffect(() => { if (!tabs.some(t => t.id === tab)) setTab('command'); }, [caps.mcp, tab]);
  // On a phone the menu scrolls sideways: keep the open tab in view.
  useEffect(() => { const el = document.querySelector('nav [data-active="true"]'); if (el && el.scrollIntoView) el.scrollIntoView({ inline: 'center', block: 'nearest' }); }, [tab]);

  const go = id => { setTab(id); try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; } window.scrollTo({ top: 0 }); };
  const openDeal = d => setDealEdit(d || {});
  const openInvoice = (inv, deal) => setInvEdit({ inv: inv || null, deal: deal || null });
  const startDeal = o => { const t = (o.tiers || []).find(t => num(t.price) > 0); setDealEdit({ brand: o.brand, offerId: o.id, value: t ? t.price : '', stage: 'lead', nextStep: o.firstMove || '' }); };
  // Autopilot drafts wait on the server until this device brings them into the content plan.
  const storeRef = useRef(store);
  storeRef.current = store;
  const [pilot, setPilot] = useState(null);
  const importInbox = async () => {
    const st = await window.SoulveeOS.autopilot.status().catch(() => null);
    if (!st || !st.allowed) return 0;
    setPilot(st);
    if (!st.inbox) return 0;
    const box = await window.SoulveeOS.autopilot.inbox().catch(() => ({ drafts: [] }));
    const drafts = box.drafts || [];
    for (const d of drafts) await storeRef.current.add('content', d);
    if (drafts.length) {
      await window.SoulveeOS.autopilot.ack(drafts.map(d => d.id)).catch(() => {});
      toast(`Autopilot drafted ${drafts.length} post${drafts.length === 1 ? '' : 's'} — review them in Content`);
    }
    return drafts.length;
  };
  useEffect(() => {
    if (store.mode !== 'db') return undefined;
    importInbox();
    const timer = setInterval(importInbox, 60000);
    return () => clearInterval(timer);
  }, [store.mode]);
  // While autopilot is on, keep its copy of the offers and recent post titles up to date.
  const ctxKey = pilot && pilot.enabled ? JSON.stringify([store.data.offers.map(o => [o.id, o.name, o.status, o.brand, (o.tiers || []).map(t => num(t.price))]), store.data.content.length]) : '';
  useEffect(() => {
    if (!ctxKey) return undefined;
    const timer = setTimeout(() => window.SoulveeOS.autopilot.context(autopilotContext(storeRef.current)).catch(() => {}), 1500);
    return () => clearTimeout(timer);
  }, [ctxKey]);
  const reviewCount = store.data.content.filter(p => p.status === 'draft' && p.autopilot).length;
  const promote = o => { setContentPrefill({ brand: o.brand, offerId: o.id, goal: `Promote ${o.name}` }); go('content'); };
  const saveDeal = async v => { if (dealEdit && dealEdit.id) await store.update('deals', dealEdit.id, v); else await store.add('deals', v); setDealEdit(null); toast('Deal saved'); };

  const dark = store.settings.theme !== 'light';
  const view = {
    command: html`<${CommandView} store=${store} caps=${caps} go=${go} openDeal=${openDeal} openInvoice=${openInvoice} />`,
    skills: html`<${SkillsView} store=${store} caps=${caps} toast=${toast} startDeal=${startDeal} promote=${promote} />`,
    pipeline: html`<${PipelineView} store=${store} caps=${caps} toast=${toast} openDeal=${openDeal} openInvoice=${openInvoice} />`,
    content: html`<${ContentView} store=${store} caps=${caps} toast=${toast} prefill=${contentPrefill} clearPrefill=${() => setContentPrefill(null)} onImport=${importInbox} />`,
    money: html`<${MoneyView} store=${store} toast=${toast} openInvoice=${openInvoice} />`,
    workspace: html`<${WorkspaceView} caps=${caps} toast=${toast} openDeal=${openDeal} />`,
    assistant: html`<${AssistantView} store=${store} caps=${caps} toast=${toast} />`,
    learn: html`<${LearnView} store=${store} caps=${caps} toast=${toast} />`,
    setup: html`<${SetupView} store=${store} caps=${caps} toast=${toast} />`,
  }[tab];

  const shellBg = 'min-h-screen ' + (dark ? 'bg-[radial-gradient(ellipse_at_top,_#2a1450_0%,_#0b0715_55%)]' : 'bg-[radial-gradient(ellipse_at_top,_#ede9fe_0%,_#f8fafc_55%)]');
  return html`<div className=${shellBg}>
    <header className="sticky top-0 z-40 backdrop-blur-xl border-b bg-white/75 border-slate-200 dark:bg-[#0b0715]/75 dark:border-white/10">
      <div className="max-w-6xl mx-auto px-4 pt-3 pb-2">
        <div className="flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center text-white font-extrabold glow shrink-0">S</div>
            <div className="min-w-0"><p className="text-[10px] uppercase tracking-[0.18em] font-bold text-violet-600 dark:text-violet-300">Soulveetainment Media Consults</p><h1 className="text-base sm:text-lg font-extrabold tracking-tight truncate">Soulvee OS</h1></div>
          </div>
          <div className="flex items-center gap-2">
            ${store.mode === 'local' && html`<span className="hidden sm:inline text-[11px] px-2 py-1 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300">Not saving</span>`}
            ${store.stale && html`<span className="text-[11px] px-2 py-1 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300">Reconnecting…</span>`}
            <button onClick=${() => store.saveSettings({ ...store.settings, theme: dark ? 'light' : 'dark' })} className="w-10 h-10 rounded-xl bg-slate-100 dark:bg-white/10 text-lg" aria-label="Toggle day and night mode">${dark ? '☀️' : '🌙'}</button>
          </div>
        </div>
        <nav className="flex gap-1.5 overflow-x-auto no-scrollbar mt-3 -mx-1 px-1">${tabs.map(t => html`<button key=${t.id} data-active=${tab === t.id ? 'true' : 'false'} onClick=${() => go(t.id)} className=${'whitespace-nowrap flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium transition ' + (tab === t.id ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/10')}><span>${t.icon}</span>${t.label}${t.id === 'content' && reviewCount ? html`<span className="ml-0.5 px-1.5 rounded-full text-[10px] font-bold bg-amber-400 text-slate-900" aria-label=${reviewCount + ' autopilot drafts to review'}>${reviewCount}</span>` : null}</button>`)}</nav>
      </div>
    </header>
    <main className="max-w-6xl mx-auto px-4 py-5 pb-24">
      ${store.mode === 'local' && html`<div className="mb-4 p-3 rounded-xl text-xs bg-amber-50 text-amber-800 border border-amber-200 dark:bg-amber-500/10 dark:text-amber-200 dark:border-amber-500/20">This browser won't let Soulvee OS save data (private browsing?), so changes here won't be kept.</div>`}
      ${store.readOnly && html`<div className="mb-4 p-3 rounded-xl text-xs bg-sky-50 text-sky-800 dark:bg-sky-500/10 dark:text-sky-200">You're viewing Soulvee OS read-only.</div>`}
      ${view}
    </main>
    ${dealEdit && html`<${DealModal} deal=${dealEdit} offers=${store.data.offers} onClose=${() => setDealEdit(null)} onSave=${saveDeal} />`}
    ${invEdit && html`<${InvoiceModal} invoice=${invEdit.inv} deal=${invEdit.deal} store=${store} toast=${toast} onClose=${() => setInvEdit(null)} />`}
    ${toastMsg && html`<div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] max-w-[92vw] px-4 py-3 rounded-xl text-sm font-medium text-white bg-gradient-to-r from-violet-600 to-fuchsia-600 shadow-2xl">${toastMsg}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
