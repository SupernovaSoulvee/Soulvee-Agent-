/* ---------------- Setup: AI check and social publishing ---------------- */
function AiCheck({ caps }) {
  const [state, setState] = useState(null);
  const run = async () => {
    setState({ busy: true });
    try { setState(await window.SoulveeOS.aiTest()); }
    catch (e) { setState({ ok: false, message: e.message }); }
  };
  return html`<${Card}>
    <div className="flex items-center justify-between gap-2 flex-wrap"><p className="font-semibold text-sm">AI connection</p><${Btn} small kind="ghost" onClick=${run} disabled=${state && state.busy}>${state && state.busy ? 'Testing…' : 'Test AI'}</${Btn}></div>
    <p className=${'text-xs mt-1 ' + muted}>${caps.sample ? 'AI is on. The test sends one tiny request to Claude to confirm the key and model work.' : aiOffText()}</p>
    ${state && !state.busy && html`<p className=${'text-sm mt-2 ' + (state.ok ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400')}>${state.ok ? `✓ Working — ${state.model} replied "${state.text || '(no text)'}"` : '✕ ' + (state.message || 'The test failed.')}</p>`}
  <//>`;
}

function SocialSetup({ store, toast }) {
  const [status, setStatus] = useState(null);
  const [channels, setChannels] = useState([]);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState('');
  const [server, setServer] = useState(null);
  const [pilot, setPilot] = useState(null);
  const load = async refresh => {
    setBusy('load'); setErr('');
    try {
      const s = await window.SoulveeOS.social.status();
      setStatus(s);
      window.SoulveeOS.health().then(setServer, () => {});
      window.SoulveeOS.autopilot.status().then(setPilot, () => {});
      if (s.buffer && s.allowed) setChannels((await window.SoulveeOS.social.channels(refresh)).channels);
    } catch (e) { setErr(e.message); }
    setBusy('');
  };
  useEffect(() => { load(false); }, []);
  const map = ((store.settings.social || {}).brandChannels) || {};
  const toggle = (brand, id) => {
    const latest = store.latestSettings();
    const socialSettings = latest.social || { brandChannels: {} };
    const current = (socialSettings.brandChannels || {})[brand] || [];
    const next = current.includes(id) ? current.filter(x => x !== id) : [...current, id];
    store.saveSettings({ ...latest, social: { ...socialSettings, brandChannels: { ...(socialSettings.brandChannels || {}), [brand]: next } } });
  };
  const testHook = async () => {
    setBusy('hook');
    try { const r = await window.SoulveeOS.social.testWebhook(); toast(r.ok ? 'Test post sent — check your scenario received it' : r.message); }
    catch (e) { toast(e.message); }
    setBusy('');
  };
  const row = (label, value, ok) => html`<div className="flex justify-between gap-3 text-sm py-1.5 border-b last:border-0 border-slate-100 dark:border-white/5"><span>${label}</span><span className=${ok ? 'text-emerald-600 dark:text-emerald-400 font-medium' : muted}>${value}</span></div>`;
  return html`<${Card}>
    <div className="flex items-center justify-between gap-2 mb-2 flex-wrap"><p className="font-semibold text-sm">Social publishing</p><${Btn} small kind="ghost" onClick=${() => load(true)} disabled=${!!busy}>${busy === 'load' ? 'Checking…' : 'Refresh'}</${Btn}></div>
    ${err && html`<p className="text-sm text-rose-600 dark:text-rose-400 mb-2">${err}</p>`}
    ${status && html`<div>
      ${row('Connected accounts (Facebook, Instagram, Threads, X, LinkedIn, Telegram, WhatsApp, Reddit, Gmail, Signal)', 'Manage in Accounts', true)}
      ${row('Buffer (Instagram, TikTok, Facebook, LinkedIn, X, Threads, YouTube, Pinterest)', status.buffer ? 'Connected' : 'Not set up', status.buffer)}
      ${row('Webhook (Make, Zapier, n8n)', status.webhook ? (status.signed ? 'On · signed' : 'On') : 'Not set up', status.webhook)}
      ${row('Publishing from this device', status.allowed ? 'Allowed' : 'Locked', status.allowed)}
      ${server && server.images && row('Images (OpenAI' + (server.images.ready ? ' · ' + server.images.model : '') + ')', !server.images.ready ? 'Not set up' : server.images.hosting === 'cloudinary' ? 'On · Cloudinary' : server.images.hosting === 'server' ? 'On · PUBLIC_URL' : 'On · this server only', server.images.ready)}
      ${pilot && pilot.allowed && row('Autopilot', pilot.enabled ? `On · next ${fmtIn(pilot.nextRun, pilot.timezone)}` : 'Off (set it up in Content)', pilot.enabled)}
    </div>`}
    ${server && server.images && server.images.ready && server.images.hosting === 'local' && html`<p className="text-xs mt-3 text-amber-700 dark:text-amber-300">Images are kept on this server only, so Buffer can't fetch them. Add CLOUDINARY_URL (or PUBLIC_URL if the server is online) and restart.</p>`}
    ${server && server.images && !server.images.ready && html`<p className=${'text-xs mt-3 ' + muted}>To make images from each post's brief, add OPENAI_API_KEY and CLOUDINARY_URL to the server's .env and restart it.</p>`}
    ${status && !status.buffer && !status.webhook && html`<p className=${'text-xs mt-3 ' + muted}>To post automatically, add BUFFER_API_KEY (from Buffer → Settings → API) or SOCIAL_WEBHOOK_URL to the server's .env and restart it. Until then, posts can be copied and posted by hand. The README has the steps.</p>`}
    ${status && !status.allowed && (status.buffer || status.webhook) && html`<p className="text-xs mt-3 text-amber-700 dark:text-amber-300">Publishing works only from the computer running Soulvee OS until SOULVEE_ACCESS_TOKEN is set. Then open the app once with ?token=YOUR_TOKEN on each device.</p>`}
    ${status && status.webhook && status.allowed && html`<div className="mt-3"><${Btn} small kind="ghost" onClick=${testHook} disabled=${!!busy}>${busy === 'hook' ? 'Sending…' : 'Send a test post to the webhook'}</${Btn}></div>`}
    ${channels.length > 0 && html`<div className="mt-4">
      <p className=${'text-xs font-medium mb-2 ' + muted}>Default Buffer channels for each brand</p>
      <div className="overflow-x-auto"><table className="text-xs w-full">
        <thead><tr><th className="text-left font-medium pr-2 pb-1">Channel</th>${BRANDS.map(b => html`<th key=${b.id} className="font-medium px-1 pb-1">${b.short}</th>`)}</tr></thead>
        <tbody>${channels.map(c => html`<tr key=${c.id} className="border-t border-slate-100 dark:border-white/5">
          <td className="py-1.5 pr-2 whitespace-nowrap">${c.displayName || c.name} <span className=${muted}>· ${SERVICE_LABEL[c.service] || c.service}</span>${c.isDisconnected ? html` <span className="text-rose-500">disconnected</span>` : ''}</td>
          ${BRANDS.map(b => html`<td key=${b.id} className="text-center px-1"><input type="checkbox" aria-label=${(c.displayName || c.name) + ' for ' + b.short} checked=${(map[b.id] || []).includes(c.id)} onChange=${() => toggle(b.id, c.id)} /></td>`)}
        </tr>`)}</tbody>
      </table></div>
    </div>`}
  <//>`;
}

/* ---------------- Printable invoice ---------------- */
function printInvoice(inv, settings) {
  const t = invTotals(inv, settings);
  const c = settings.company;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const w = window.open('', '_blank');
  if (!w) return false;
  const rows = (inv.items || []).map(i => `<tr><td>${esc(i.desc)}</td><td class="r">${esc(ngn(i.amount))}</td></tr>`).join('');
  w.document.write(`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${esc(inv.number)}</title><style>
    @page { size: A4; margin: 18mm; }
    body { font-family: Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: #111827; margin: 0; font-size: 13px; }
    .bar { height: 6px; background: linear-gradient(90deg, #7c3aed, #c026d3); border-radius: 3px; margin-bottom: 24px; }
    .top { display: flex; justify-content: space-between; gap: 24px; }
    h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; } .muted { color: #6b7280; } .r { text-align: right; }
    .co { font-weight: 700; font-size: 15px; } table { width: 100%; border-collapse: collapse; margin-top: 28px; }
    th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; border-bottom: 2px solid #111827; padding: 8px 0; }
    td { padding: 10px 0; border-bottom: 1px solid #e5e7eb; vertical-align: top; } .totals { margin-left: auto; width: 300px; margin-top: 16px; }
    .totals div { display: flex; justify-content: space-between; padding: 5px 0; } .grand { font-weight: 800; font-size: 16px; border-top: 2px solid #111827; margin-top: 4px; padding-top: 8px !important; }
    .box { margin-top: 28px; padding: 14px 16px; background: #f5f3ff; border-radius: 10px; } .foot { margin-top: 36px; font-size: 11px; }
    @media print { .noprint { display: none; } }
  </style></head><body>
    <div class="bar"></div>
    <div class="top">
      <div><p class="co">${esc(c.name)}</p><p class="muted">${esc(c.bn)}<br>${esc(c.address)}<br>${esc(c.phone)} · ${esc(c.email)}</p></div>
      <div class="r"><h1>Invoice</h1><p><b>${esc(inv.number)}</b></p><p class="muted">Issued ${esc(fmtDate(inv.issueDate))}<br>Due ${esc(fmtDate(inv.dueDate))}</p></div>
    </div>
    <p style="margin-top:24px" class="muted">Bill to</p><p><b>${esc(inv.client)}</b>${inv.clientEmail ? '<br>' + esc(inv.clientEmail) : ''}</p>
    <table><thead><tr><th>Description</th><th class="r">Amount</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="totals">
      <div><span class="muted">Subtotal</span><span>${esc(ngn(t.sub))}</span></div>
      <div><span class="muted">VAT (${inv.vat ? esc(vatRateOf(inv, settings)) : 0}%)</span><span>${esc(ngn(t.vat))}</span></div>
      <div class="grand"><span>Total</span><span>${esc(ngn(t.total))}</span></div>
      ${t.wht > 0 ? `<div><span class="muted">Less WHT (${esc(inv.wht)}%)</span><span>−${esc(ngn(t.wht))}</span></div><div><b>Amount payable</b><b>${esc(ngn(t.net))}</b></div>` : ''}
      ${partPaid(inv) ? `<div><span class="muted">Paid to date</span><span>−${esc(ngn(inv.paidNgn))}</span></div><div class="grand"><span>Balance due</span><span>${esc(ngn(invBalance(inv, settings)))}</span></div>` : ''}
    </div>
    <div class="box"><b>Payment</b><br>${esc(c.payment)}${inv.notes ? `<br><br><b>Notes</b><br>${esc(inv.notes)}` : ''}</div>
    <p class="foot muted">Thank you for your business.${t.wht > 0 ? ' Please send the WHT credit note for the amount deducted.' : ''}</p>
    <p class="noprint muted" style="margin-top:24px">Choose "Save as PDF" in the print window to get a PDF.</p>
  </body></html>`);
  w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 350);
  return true;
}

/* ---------------- Money ---------------- */
function InvoiceModal({ invoice, deal, store, onClose, toast }) {
  const { data, settings, add, update, saveSettings } = store;
  const offer = deal && data.offers.find(o => o.id === deal.offerId);
  const whtStart = ['0', '5', '10'].includes(String(num(settings.whtDefault))) ? String(num(settings.whtDefault)) : '0';
  const [f, setF] = useState(() => invoice && invoice.id ? { ...invoice, items: (invoice.items && invoice.items.length ? invoice.items : [{ desc: '', amount: '' }]).map(i => ({ ...i })) } : {
    client: deal ? deal.client : '', clientEmail: deal ? (deal.email || '') : '', brand: deal ? deal.brand : 'smc',
    items: [{ desc: deal ? (offer ? offer.name : 'Services') : '', amount: deal ? String(deal.value || '') : '' }],
    vat: true, vatRate: vatRateNow(settings), wht: whtStart, issueDate: localDate(), dueDate: addDays(localDate(), 14), notes: '', status: 'draft',
    offerId: deal ? (deal.offerId || '') : '', dealId: deal ? deal.id : '',
  });
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const setItem = (i, k, v) => setF(p => ({ ...p, items: p.items.map((it, j) => j === i ? { ...it, [k]: v } : it) }));
  const t = invTotals(f, settings);
  const number = f.number || invNumber(f.client, settings.invoiceSeq);
  const save = async () => {
    const doc = { ...f, number, items: f.items.filter(i => i.desc || num(i.amount)).map(i => ({ desc: i.desc, amount: num(i.amount) })), wht: num(f.wht), vatRate: vatRateOf(f, settings) };
    if (invoice && invoice.id) await update('invoices', invoice.id, doc);
    else {
      await add('invoices', doc);
      if (!f.number) await saveSettings({ ...settings, invoiceSeq: num(settings.invoiceSeq) + 1 });
      if (deal && deal.stage !== 'won') await update('deals', deal.id, { stage: 'won', prob: 100 });
    }
    toast('Invoice saved'); onClose();
  };
  return html`<${Modal} title=${invoice && invoice.id ? 'Edit invoice' : 'New invoice'} wide onClose=${onClose} footer=${html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} disabled=${!String(f.client).trim() || t.sub <= 0} onClick=${save}>Save invoice</${Btn}>`}>
    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <${Field} label="Invoice number" hint="Format INV-SMC-[client]-[number]"><${Input} value=${number} onChange=${e => set('number', e.target.value)} /><//>
      <${Field} label="Brand"><${Select} value=${f.brand} onChange=${v => set('brand', v)} options=${brandOptions} /><//>
      <${Field} label="Client"><${Input} value=${f.client} onChange=${e => set('client', e.target.value)} /><//>
      <${Field} label="Client email"><${Input} type="email" value=${f.clientEmail} onChange=${e => set('clientEmail', e.target.value)} /><//>
      <${Field} label="Issue date"><${Input} type="date" value=${f.issueDate} onChange=${e => set('issueDate', e.target.value)} /><//>
      <${Field} label="Due date"><${Input} type="date" value=${f.dueDate} onChange=${e => set('dueDate', e.target.value)} /><//>
    </div>
    <div className="mt-4">
      <div className="flex items-center justify-between mb-2"><p className="text-sm font-semibold">Line items (₦, pre-VAT)</p><button className="text-xs text-violet-500 font-medium" onClick=${() => set('items', [...f.items, { desc: '', amount: '' }])}>+ Add line</button></div>
      <div className="space-y-2">${f.items.map((it, i) => html`<div key=${i} className="flex gap-2"><input className=${inputCls} placeholder="Description" value=${it.desc} onChange=${e => setItem(i, 'desc', e.target.value)} /><input className=${inputCls + ' !w-36'} inputMode="numeric" placeholder="Amount" value=${it.amount} onChange=${e => setItem(i, 'amount', e.target.value)} />${f.items.length > 1 && html`<button className="text-rose-500 text-xs px-1" onClick=${() => set('items', f.items.filter((_, j) => j !== i))}>✕</button>`}</div>`)}</div>
    </div>
    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
      <div className="text-sm"><label className="flex items-center gap-2"><input type="checkbox" checked=${!!f.vat} onChange=${e => set('vat', e.target.checked)} /> Charge VAT (${vatRateOf(f, settings)}%)</label>${vatRateOf(f, settings) !== vatRateNow(settings) && html`<button className="mt-1 text-xs text-violet-500 font-medium" onClick=${() => set('vatRate', vatRateNow(settings))}>Use today's rate (${vatRateNow(settings)}%)</button>`}</div>
      <${Field} label="WHT the client deducts"><${Select} value=${String(f.wht)} onChange=${v => set('wht', v)} options=${[{ v: '0', l: 'None' }, { v: '5', l: '5%' }, { v: '10', l: '10%' }]} /><//>
      <${Field} label="Notes on invoice" className="sm:col-span-2"><${Input} value=${f.notes} onChange=${e => set('notes', e.target.value)} placeholder="e.g. 70% deposit, 30% on delivery" /><//>
    </div>
    <div className="mt-4 p-4 rounded-xl bg-slate-50 dark:bg-white/5 text-sm space-y-1">
      <div className="flex justify-between"><span className=${muted}>Subtotal</span><span>${ngn(t.sub)}</span></div>
      <div className="flex justify-between"><span className=${muted}>VAT</span><span>${ngn(t.vat)}</span></div>
      <div className="flex justify-between font-bold"><span>Invoice total</span><span>${ngn(t.total)}</span></div>
      ${t.wht > 0 && html`<div className="flex justify-between text-xs"><span className=${muted}>Less WHT (credit note to collect)</span><span>−${ngn(t.wht)}</span></div><div className="flex justify-between text-xs font-semibold"><span>Expected in account</span><span>${ngn(t.net)}</span></div>`}
    </div>
  <//>`;
}

function invoiceText(inv, settings) {
  const t = invTotals(inv, settings); const c = settings.company;
  return [
    c.name, `${c.bn} · ${c.address}`, `${c.phone} · ${c.email}`, '',
    `INVOICE ${inv.number}`, `Issued: ${fmtDate(inv.issueDate)}   Due: ${fmtDate(inv.dueDate)}`, `Bill to: ${inv.client}${inv.clientEmail ? ' <' + inv.clientEmail + '>' : ''}`, '',
    ...(inv.items || []).map(i => `• ${i.desc} — ${ngn(i.amount)}`), '',
    `Subtotal: ${ngn(t.sub)}`, `VAT (${inv.vat ? vatRateOf(inv, settings) : 0}%): ${ngn(t.vat)}`, `TOTAL: ${ngn(t.total)}`,
    ...(t.wht > 0 ? [`WHT (${inv.wht}%) deducted by client: ${ngn(t.wht)} — please send the credit note`, `Amount payable: ${ngn(t.net)}`] : []),
    ...(partPaid(inv) ? [`Paid to date: ${ngn(inv.paidNgn)}`, `BALANCE DUE: ${ngn(invBalance(inv, settings))}`] : []), '',
    `Payment: ${c.payment}`, ...(inv.notes ? [`Notes: ${inv.notes}`] : []), 'Thank you for your business.',
  ].join('\n');
}

function PaidModal({ inv, store, toast, onClose }) {
  const { settings, add, update } = store;
  const t = invTotals(inv, settings);
  const already = num(inv.paidNgn);
  const due = invBalance(inv, settings);
  const payText = String(settings.company.payment || '').toLowerCase();
  const [f, setF] = useState({ date: localDate(), method: METHODS.find(m => payText.includes(m.toLowerCase())) || 'Moniepoint', currency: 'NGN', amount: String(Math.round(due)), fx: '' });
  const [touched, setTouched] = useState(false);
  const [full, setFull] = useState(null); // null until "Paid in full" is ticked or unticked by hand
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  // Until the amount is edited by hand, keep it equal to the balance due in the chosen currency.
  const setCurrency = v => setF(p => {
    if (touched) return { ...p, currency: v };
    const r = v === 'NGN' ? 1 : num(settings.fx[v]);
    return { ...p, currency: v, fx: '', amount: r ? String(Math.round(due / r * 100) / 100) : '' };
  });
  const rate = f.currency === 'NGN' ? 1 : (num(f.fx) || num(settings.fx[f.currency]));
  const ngnVal = num(f.amount) * rate;
  // Less than the balance is a part payment and the invoice stays open for the rest, unless
  // "Paid in full" is ticked (for a discount or an exchange-rate difference).
  const settles = full === null ? (!touched || ngnVal >= due - 1) : full;
  const left = Math.max(0, due - ngnVal);
  const save = async () => {
    const paidNgn = already + ngnVal;
    if (ngnVal > 0) await add('ledger', { type: 'income', brand: inv.brand, amount: num(f.amount), currency: f.currency, fx: rate, ngn: ngnVal, method: f.method, date: f.date, note: `${inv.number} — ${inv.client}`, invoiceId: inv.id, offerId: inv.offerId || '' });
    await update('invoices', inv.id, settles ? { status: 'paid', paidDate: f.date, paidNgn } : { status: inv.status === 'draft' ? 'sent' : inv.status, paidNgn });
    toast(settles ? `${inv.number} marked paid${ngnVal > 0 ? ` · ${ngn(ngnVal)} logged` : ''}` : `${ngn(ngnVal)} logged · ${ngn(left)} still due on ${inv.number}`); onClose();
  };
  return html`<${Modal} title=${'Record payment · ' + inv.number} onClose=${onClose} footer=${html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} kind="good" disabled=${!(ngnVal > 0) && !(settles && due < 1)} onClick=${save}>${settles ? 'Mark paid' : 'Record part payment'}</${Btn}>`}>
    ${already > 0 && html`<p className="mb-3 text-sm">${ngn(already)} already received · <span className="font-semibold">${ngn(due)} still due</span></p>`}
    <div className="grid grid-cols-2 gap-3">
      <${Field} label="Date received"><${Input} type="date" value=${f.date} onChange=${e => set('date', e.target.value)} /><//>
      <${Field} label="Method"><${Select} value=${f.method} onChange=${v => set('method', v)} options=${METHODS} /><//>
      <${Field} label="Currency received"><${Select} value=${f.currency} onChange=${setCurrency} options=${CURRENCIES} /><//>
      <${Field} label="Amount received"><${Input} inputMode="decimal" value=${f.amount} onChange=${e => { setTouched(true); set('amount', e.target.value); }} /><//>
      ${f.currency !== 'NGN' && html`<${Field} label=${`Rate used (₦ per 1 ${f.currency})`} className="col-span-2" hint="Enter the rate you actually got — this is what converts it into NGN revenue."><${Input} inputMode="decimal" value=${f.fx || (num(settings.fx[f.currency]) || '')} onChange=${e => set('fx', e.target.value)} /><//>`}
    </div>
    <label className="mt-4 flex items-center gap-2 text-sm"><input type="checkbox" checked=${settles} onChange=${e => setFull(e.target.checked)} /> Paid in full (closes the invoice)</label>
    <p className="mt-2 text-sm">Logs <span className="font-bold">${ngn(ngnVal)}</span> to ${brandOf(inv.brand).short} revenue.${settles ? (t.wht > 0 ? ` Remember to collect the ${ngn(t.wht)} WHT credit note.` : '') : ` The invoice stays open with ${ngn(left)} still due.`}</p>
  <//>`;
}

    <div className="grid grid-cols-2 gap-3">

      <${Field} label="Note" className="col-span-2"><${Input} value=${f.note} onChange=${e => set('note', e.target.value)} placeholder="e.g. Selar sale — Supernova Toolkit" /><//>

    <p className="mt-4 text-sm">Converted: <span className="font-bold">${ngn(ngnVal)}</span></p>
  <//>`;

function MoneyView({ store, toast, openInvoice }) {
  const { data, settings, update, remove } = store;
  const [sub, setSub] = useState('invoices');
  const [paying, setPaying] = useState(null);
  const [text, setText] = useState(null);
  const [ledgerOpen, setLedgerOpen] = useState(false);
  const [period, setPeriod] = useState('h2');
  const [ledgerBrand, setLedgerBrand] = useState('all');
  const s = useMemo(() => computeSnapshot(data, settings, period), [data, settings, period]);
  const invoices = [...data.invoices].sort((a, b) => String(b.issueDate).localeCompare(String(a.issueDate)));
  const ledger = data.ledger.filter(l => ledgerBrand === 'all' || l.brand === ledgerBrand).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const paidInPeriod = data.invoices.filter(i => i.status === 'paid' && inPeriod(i.paidDate, period));
  const vatCollected = paidInPeriod.reduce((a, i) => a + invTotals(i, settings).vat, 0);
  const whtCredits = paidInPeriod.reduce((a, i) => a + invTotals(i, settings).wht, 0);
  const allocTotal = settings.alloc.reduce((a, b) => a + num(b.pct), 0);
  const allocBase = Math.max(0, s.net - vatCollected);

  const copy = async t => { try { await navigator.clipboard.writeText(t); toast('Copied'); } catch (e) { toast('Copy blocked — select the text and copy it manually'); } };
  // Reverses one payment: removes it from the ledger and reopens the invoice for what it covered.
  const undoPayment = async (inv, entry) => {
    const left = entry ? Math.max(0, num(inv.paidNgn) - num(entry.ngn)) : 0;
    const msg = left > 0
      ? `Undo the ${ngn(entry.ngn)} payment on ${inv.number}? It is removed from the ledger; the ${ngn(left)} received before it stays.`
      : `Undo the payment on ${inv.number}? It goes back to unpaid${entry ? ' and the payment is removed from the ledger' : ''}.`;
    if (!confirm(msg)) return;
    if (entry) await remove('ledger', entry.id);
    await update('invoices', inv.id, { status: inv.status === 'paid' ? 'sent' : inv.status, paidDate: '', paidNgn: left });
    toast(left > 0 ? `Payment removed · ${ngn(invBalance({ ...inv, status: 'sent', paidNgn: left }, settings))} now due on ${inv.number}` : `${inv.number} is unpaid again`);
  };
  // "Undo paid" on an invoice reverses its latest payment.
  const unpay = inv => undoPayment(inv, data.ledger.filter(l => l.invoiceId === inv.id).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)))[0]);
  const delEntry = async l => {
    const inv = l.invoiceId && data.invoices.find(i => i.id === l.invoiceId);
    if (inv) return undoPayment(inv, l);
    if (!sure('this entry')) return;
    await remove('ledger', l.id);
    toast('Entry deleted');
  };

  return html`<div className="space-y-5">
    <${Section} title="Money" sub="Invoice it, collect it, convert it, allocate it." action=${html`<${Chips} value=${sub} onChange=${setSub} options=${[{ v: 'invoices', l: 'Invoices' }, { v: 'ledger', l: 'Ledger' }, { v: 'alloc', l: 'Allocate & tax' }]} />`} />

    ${sub === 'invoices' && html`<div className="space-y-3">
      <div className="flex justify-between items-center"><p className=${'text-sm ' + muted}>${ngn(s.outstanding)} outstanding across ${s.openInvoices} invoice${s.openInvoices === 1 ? '' : 's'}</p><${Btn} small onClick=${() => openInvoice(null)}>+ Invoice</${Btn}></div>
      ${invoices.length === 0 ? html`<${Card}><${Empty} title="No invoices yet">Win a deal in the pipeline or tap + Invoice.<//><//>` : invoices.map(inv => {
        const st = invStatus(inv); const t = invTotals(inv, settings);
        return html`<${Card} key=${inv.id}>
          <div className="flex items-start justify-between gap-2">
            <div className="min-w-0"><p className="font-semibold text-sm truncate">${inv.number}</p><p className=${'text-xs ' + muted}>${inv.client} · due ${fmtDate(inv.dueDate)}</p><div className="flex gap-1.5 mt-1"><${BrandChip} id=${inv.brand} /><${Pill} tone=${st === 'paid' ? 'green' : st === 'overdue' ? 'red' : st === 'sent' ? 'blue' : 'slate'}>${st}</${Pill}></div></div>
            <div className="text-right shrink-0"><p className="font-bold">${ngn(t.total)}</p>${t.wht > 0 && html`<p className=${'text-[11px] ' + muted}>net ${ngn(t.net)}</p>`}${inv.vat && html`<p className=${'text-[11px] ' + muted}>incl. VAT ${ngn(t.vat)}</p>`}${partPaid(inv) && html`<p className="text-[11px] font-medium text-amber-700 dark:text-amber-300">${ngn(inv.paidNgn)} paid · ${ngn(invBalance(inv, settings))} due</p>`}</div>
          </div>
          <div className="flex gap-2 mt-3 flex-wrap">
            ${st === 'draft' && html`<${Btn} small onClick=${() => update('invoices', inv.id, { status: 'sent' })}>Mark sent</${Btn}>`}
            ${st !== 'paid' && html`<${Btn} small kind="good" onClick=${() => setPaying(inv)}>Mark paid</${Btn}>`}
            <${Btn} small kind="ghost" onClick=${() => { if (!printInvoice(inv, settings)) toast('Allow pop-ups for Soulvee OS to open the PDF'); }}>PDF</${Btn}>
            <${Btn} small kind="ghost" onClick=${() => setText(invoiceText(inv, settings))}>Invoice text</${Btn}>
            <${Btn} small kind="ghost" onClick=${() => openInvoice(inv)}>Edit</${Btn}>
            ${(st === 'paid' || partPaid(inv)) && html`<${Btn} small kind="ghost" onClick=${() => unpay(inv)}>${st === 'paid' ? 'Undo paid' : 'Undo payment'}</${Btn}>`}
            ${st !== 'paid' && !partPaid(inv) && html`<${Btn} small kind="danger" onClick=${() => sure(inv.number) && remove('invoices', inv.id)}>Delete</${Btn}>`}
          </div>
        <//>`;
      })}
    </div>`}

    ${sub === 'ledger' && html`<div className="space-y-3">
      <div className="flex justify-between items-center gap-2"><${Chips} value=${ledgerBrand} onChange=${setLedgerBrand} options=${[{ v: 'all', l: 'All' }, ...BRANDS.map(b => ({ v: b.id, l: b.short }))]} /><${Btn} small onClick=${() => setLedgerOpen(true)}>+ Entry</${Btn}></div>
      <${Card} className="!p-0 overflow-hidden">
        ${ledger.length === 0 ? html`<${Empty} title="Ledger is empty">Paid invoices land here automatically. Log Selar, Spreadshop or gig cash with + Entry.<//>` : ledger.map(l => html`<div key=${l.id} className="flex items-center justify-between gap-2 px-4 py-3 border-b last:border-0 border-slate-100 dark:border-white/5">
          <div className="min-w-0"><p className="text-sm font-medium truncate">${l.note || l.method}</p><p className=${'text-[11px] ' + muted}>${fmtDate(l.date)} · ${brandOf(l.brand).short} · ${l.method}${l.currency !== 'NGN' ? ` · ${l.currency} ${num(l.amount).toLocaleString()} @ ₦${num(l.fx).toLocaleString()}` : ''}</p></div>
          <div className="flex items-center gap-2 shrink-0"><span className=${'font-semibold text-sm ' + (l.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400')}>${l.type === 'income' ? '+' : '−'}${ngn(l.ngn)}</span><button className="text-xs text-rose-500 px-1" aria-label="Delete entry" title=${l.invoiceId ? 'Undo this payment' : 'Delete entry'} onClick=${() => delEntry(l)}>✕</button></div>
        </div>`)}
      <//>
    </div>`}

    ${sub === 'alloc' && html`<div className="space-y-4">
      <${Chips} value=${period} onChange=${setPeriod} options=${Object.entries(PERIODS).map(([v, p]) => ({ v, l: p.label }))} />
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <${Stat} label="Collected" value=${ngnShort(s.income)} grad="from-emerald-500 to-teal-600" />
        <${Stat} label="Costs" value=${ngnShort(s.expenses)} grad="from-rose-500 to-pink-600" />
        <${Stat} label="VAT to remit" value=${ngnShort(vatCollected)} sub="Collected on paid invoices" grad="from-amber-500 to-orange-600" />
        <${Stat} label="WHT credits" value=${ngnShort(whtCredits)} sub="Credit notes to collect" grad="from-sky-500 to-blue-600" />
      </div>
      <${Card}>
        <div className="flex justify-between items-center mb-3"><p className="font-semibold text-sm">Allocate ${ngn(allocBase)}</p><span className=${'text-[11px] ' + muted}>Net collected minus VAT owed</span></div>
        ${allocTotal !== 100 && html`<p className="text-xs text-amber-600 dark:text-amber-400 mb-2">Your buckets add up to ${allocTotal}% — adjust them in Setup.</p>`}
        <div className="space-y-2">${settings.alloc.map((a, i) => html`<div key=${i} className="flex items-center gap-3"><span className="w-32 sm:w-40 text-sm truncate">${a.name}</span><div className="flex-1 h-2 rounded-full bg-slate-100 dark:bg-white/10 overflow-hidden"><div className="h-full bg-gradient-to-r from-violet-600 to-fuchsia-500" style=${{ width: Math.min(100, num(a.pct)) + '%' }}></div></div><span className=${'w-10 text-right text-xs ' + muted}>${num(a.pct)}%</span><span className="w-28 text-right text-sm font-semibold">${ngn(allocBase * num(a.pct) / 100)}</span></div>`)}</div>
      <//>
      <${Card} className="!p-0 overflow-hidden">
        <div className="px-4 py-3 font-semibold text-sm border-b border-slate-100 dark:border-white/5">Brand P&L · ${s.period}</div>
        <div className=${'grid grid-cols-4 gap-2 px-4 py-2 text-[11px] uppercase tracking-wide border-b border-slate-100 dark:border-white/5 ' + muted}><span>Brand</span><span className="text-right">In</span><span className="text-right">Out</span><span className="text-right">Net</span></div>
        ${s.byBrand.map(b => html`<div key=${b.id} className="grid grid-cols-4 gap-2 px-4 py-2.5 text-sm border-b last:border-0 border-slate-100 dark:border-white/5"><span className="truncate">${b.name}</span><span className="text-right text-emerald-600 dark:text-emerald-400">${ngnShort(b.income)}</span><span className="text-right text-rose-600 dark:text-rose-400">${ngnShort(b.expenses)}</span><span className="text-right font-semibold">${ngnShort(b.income - b.expenses)}</span></div>`)}
      <//>
      <p className=${'text-[11px] ' + muted}>Tax figures are working estimates from your own records, not filing advice — confirm with your accountant before remitting.</p>
    </div>`}

    ${paying && html`<${PaidModal} inv=${paying} store=${store} toast=${toast} onClose=${() => setPaying(null)} />`}
    ${ledgerOpen && html`<${LedgerModal} store=${store} toast=${toast} onClose=${() => setLedgerOpen(false)} />`}
    ${text && html`<${Modal} title="Invoice text" onClose=${() => setText(null)} footer=${html`<${Btn} onClick=${() => copy(text)}>Copy</${Btn}>`}><textarea readOnly rows="16" className=${inputCls + ' font-mono text-xs'} value=${text} onFocus=${e => e.target.select()}></textarea><//>`}
  </div>`;
}

function parseSender(s) {
  if (!s) return { name: '', email: '' };
  if (typeof s === 'object') return { name: s.displayName || s.name || s.email || '', email: s.email || s.emailAddress || '' };
  const m = String(s).match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>/);
  if (m) return { name: m[1] || m[2], email: m[2] };
  return { name: s, email: String(s).includes('@') ? s : '' };
}
function parseThreads(p) {
  const arr = (p && (p.threads || p.items)) || (Array.isArray(p) ? p : []);
  return arr.map(t => {

    return { id: t.id, subject: first.subject || last.subject || t.subject || '(no subject)', from: parseSender(last.sender || first.sender || t.sender), date: last.date || first.date || '', snippet: last.snippet || first.snippet || t.snippet || '', url: t.viewUrl || last.viewUrl || first.viewUrl || '' };
  });
}

  const arr = (p && (p.events || p.items)) || (Array.isArray(p) ? p : []);

}

function WorkspaceView({ caps, toast, openDeal }) {
  const [radar, setRadar] = useState('leads');
  const [custom, setCustom] = useState('');
  const [mail, setMail] = useState({ state: 'idle', items: [], error: '' });
  const [cal, setCal] = useState({ state: 'idle', items: [], error: '' });
  const [booking, setBooking] = useState(null);

  const loadMail = async () => {
    if (!caps.mcp) return;

  };
  const loadCal = async () => {
    if (!caps.mcp) return;
    setCal(c => ({ ...c, state: 'loading', error: '' }));
    const res = await mcpCall(caps.mcp, 'Google Calendar', 'list_events', { orderBy: 'startTime', pageSize: 12 });
    if (res.ok) setCal({ state: 'ok', items: parseEvents(res.payload), error: '' });

      ${radar === 'custom' && html`<div className="mt-2"><${Input} value=${custom} onChange=${e => setCustom(e.target.value)} placeholder='Gmail search, e.g. from:flaky OR "Su Chau"' /></div>`}

      <div className="mt-3 space-y-2">
        ${mail.state === 'idle' && html`<p className=${'text-xs ' + muted}>Pick a radar and scan. The first scan asks you to allow Gmail for this page.</p>`}
        ${mail.state === 'ok' && mail.items.length === 0 && html`<${Empty} title="Nothing matched">Try another radar or a custom search.<//>`}
        ${mail.items.map(t => html`<div key=${t.id} className="p-3 rounded-xl bg-slate-50 dark:bg-white/5">
          <div className="flex justify-between gap-2"><p className="text-sm font-medium truncate">${t.subject}</p><span className=${'text-[11px] shrink-0 ' + muted}>${fmtDateTime(t.date)}</span></div>
          <p className=${'text-xs ' + muted}>${t.from.name}${t.from.email && t.from.email !== t.from.name ? ' · ' + t.from.email : ''}</p>
          <p className="text-xs mt-1 line-clamp-2">${t.snippet}</p>
          <div className="flex gap-2 mt-2">

      <div className="flex items-center justify-between gap-2 mb-3 flex-wrap"><p className="font-semibold text-sm">📅 Next 7 days</p><div className="flex gap-2"><${Btn} small kind="ghost" onClick=${() => setBooking({ summary: '' })}>+ Event</${Btn}><${Btn} small onClick=${loadCal} disabled=${cal.state === 'loading'}>${cal.state === 'loading' ? 'Loading…' : cal.state === 'idle' ? 'Load calendar' : 'Refresh'}</${Btn}></div></div>

      execute: async a => { const posts = (a.posts || []).slice(0, 14); for (const p of posts) await ref.current.add('content', { brand: p.brand, title: p.title || 'Post idea', text: [String(p.caption || '').trim(), tagLine(p.hashtags)].filter(Boolean).join('\n\n'), platforms: p.platforms && p.platforms.length ? p.platforms : ['instagram'], media: [], status: 'draft', scheduledAt: p.day !== undefined || p.time ? slotFor(p.day || 0, p.time) : '', visual: p.visual || '', script: p.script || '', igType: '', ytCategory: YT_CATEGORY[p.brand] || '22', firstComment: '', notes: 'Added by assistant', aiAssisted: true }); setActs(x => [...x, `Added ${posts.length} post draft${posts.length === 1 ? '' : 's'} to Content`]); return { ok: true, added: posts.length }; } },
  ];

  const preamble = () => `${voiceFor(voice)}
You are also Soulvee's operations sub-agent inside Soulvee OS, the Soulveetainment Media Consults control unit, which runs four brands (DJ Soulvee, Soulveetainment Media Consults, Soulvee's Emporium, EFR) plus digital products. Philosophy: systems over hustle.
Today is ${fmtDate(localDate())}, Lagos. Money is NGN-first; format like ₦1,500,000. Lead with decisions and numbers, keep it skimmable.
Use the tools to read real figures before answering money or pipeline questions — never invent numbers. Look people up with search_contacts or get_contact before answering questions about a client or writing to them. Use list_conversations and read_conversation to see what people have written in the inbox; you can draft replies, but only Soulvee sends them. Only create deals, offers, draft invoices, post drafts, contacts, activities or tasks when explicitly asked. Post drafts go to the Content tab for Soulvee to approve; you can't publish anything yourself. Check get_social_results before planning posts, so new drafts build on what is working. When asked to reply to a client or fan message, write the reply in the brand voice above, ready to paste, and don't invent prices or dates that aren't in the catalogue or the message.
Plain text with short lines; simple dashes for lists; no markdown headers or tables.`;

  const send = async text => {
    const q = (text || input).trim();
    if (!q || !caps.sample || busy) return;
    const history = [...msgs, { role: 'user', content: q }];
    setMsgs([...history, { role: 'assistant', content: '' }]); setInput(''); setBusy(true); setActs([]);
    const ctl = new AbortController(); abortRef.current = ctl;
    try {
      const r = await caps.sample(history, { system: preamble(), tools, effort: 'medium', signal: ctl.signal, onText: ({ text }) => setMsgs(m => { const c = [...m]; c[c.length - 1] = { role: 'assistant', content: text }; return c; }) });
      setMsgs(m => { const c = [...m]; c[c.length - 1] = { role: 'assistant', content: (r.text || '').trim() || '(no answer)' }; return c; });
    } catch (e) {
      const t = e && e.text ? e.text : sampleMessage(e);
      setMsgs(m => { const c = [...m]; c[c.length - 1] = { role: 'assistant', content: t }; return c; });
    }
    setBusy(false); abortRef.current = null;
  };
  const copy = async t => { try { await navigator.clipboard.writeText(t); toast('Copied'); } catch (e) { toast('Copy blocked — long-press to copy'); } };

  if (caps.sample === null) return html`<${Section} title="AI sub-agent"><${Card}><${Empty} title="AI isn't available">${aiOffText()}<//><//><//>`;

  const prompts = ['Where is my revenue this H2 — what should I chase first?', 'Which deals need a follow-up this week?', 'Who are my best clients, and who has gone quiet?', 'Draft a reply to a fan asking how to book DJ Soulvee for a December wedding', 'Turn my Google Workspace automation skill into an offer and save it', 'Draft three Instagram posts for DJ Soulvee about this weekend', 'What is working best on my socials right now?'];
  return html`<div className="space-y-4">
    <${Section} title="AI sub-agent" sub="Reads your live numbers, drafts replies in your voice, and logs deals, offers and draft invoices when you ask." action=${html`<div className="w-44"><${Select} value=${voice} onChange=${setVoice} options=${[{ v: 'dj', l: 'Voice: DJ Soulvee' }, { v: 'smc', l: 'Voice: SMC' }, { v: 'emporium', l: 'Voice: Emporium' }]} /></div>`} />
    <${Card} className="!p-0 overflow-hidden">
      <div className="h-[52vh] sm:h-[56vh] overflow-y-auto p-4 space-y-3">
        ${msgs.length === 0 && html`<div className="space-y-2"><p className=${'text-sm ' + muted}>Try one:</p>${prompts.map(p => html`<button key=${p} onClick=${() => send(p)} className="block w-full text-left text-sm p-3 rounded-xl bg-slate-50 hover:bg-slate-100 dark:bg-white/5 dark:hover:bg-white/10">${p}</button>`)}</div>`}
        ${msgs.map((m, i) => html`<div key=${i} className=${'flex ' + (m.role === 'user' ? 'justify-end' : 'justify-start')}>
          <div className=${'max-w-[88%] rounded-2xl px-4 py-2.5 text-sm whitespace-pre-wrap ' + (m.role === 'user' ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white' : 'bg-slate-100 dark:bg-white/10')}>
            ${m.content || (busy && i === msgs.length - 1 ? html`<span className=${muted}>Thinking…</span>` : '')}
            ${m.role === 'assistant' && m.content && !(busy && i === msgs.length - 1) && html`<div className="mt-2"><button onClick=${() => copy(m.content)} className="text-[11px] font-medium text-violet-600 dark:text-violet-300">Copy</button></div>`}
          </div>
        </div>`)}
        ${acts.length > 0 && html`<div className="text-[11px] text-emerald-600 dark:text-emerald-400">${acts.map((a, i) => html`<p key=${i}>✓ ${a}</p>`)}</div>`}
        <div ref=${endRef}></div>
      </div>
      <form className="flex items-end gap-2 p-3 border-t border-slate-100 dark:border-white/10" onSubmit=${e => { e.preventDefault(); send(); }}>
        <textarea rows=${Math.min(6, input.split('\n').length)} className=${inputCls + ' resize-none'} value=${input} onChange=${e => setInput(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && !e.shiftKey && !touch && !(e.nativeEvent && e.nativeEvent.isComposing)) { e.preventDefault(); send(); } }} placeholder=${touch ? 'Ask about money, deals, or paste a message to reply to…' : 'Ask about money, deals, or paste a message to reply to… (Shift+Enter for a new line)'}></textarea>
        ${busy ? html`<${Btn} type="button" kind="ghost" onClick=${() => abortRef.current && abortRef.current.abort()}>Stop</${Btn}>` : html`<${Btn} type="submit" disabled=${!input.trim()}>Send</${Btn}>`}
      </form>
    <//>
    ${msgs.length > 0 && !busy && html`<button className=${'text-xs ' + muted} onClick=${() => setMsgs([])}>Clear conversation</button>`}
  </div>`;
}

// Links a deal to its contact, adding the client to the CRM when they aren't in it yet.
async function withContact(store, deal) {
  if (deal.contactId || !String(deal.client || '').trim()) return deal;
  const found = findContact(store.data.contacts, '', deal.email, deal.client);
  if (found) return { ...deal, contactId: found.id };
  const made = await store.add('contacts', { ...blankContact(), name: String(deal.client).trim(), email: deal.email || '', brands: deal.brand ? [deal.brand] : [], source: deal.source || 'Direct', stage: 'lead' });
  return { ...deal, contactId: made.id };
}

function App() {
  const [toastMsg, setToastMsg] = useState(null);
  const toastTimer = useRef(null);
  const toast = m => { setToastMsg(m); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToastMsg(null), 3000); };
  const store = useStore(toast);
  const [tab, setTab] = useState(() => (tabFromHash() || ['command'])[0]);
  const [crmSub, setCrmSub] = useState(() => (tabFromHash() || [])[1] || 'people');
  const [caps, setCaps] = useState({ sample: undefined, mcp: undefined });
  const [dealEdit, setDealEdit] = useState(null);
  const [invEdit, setInvEdit] = useState(null);
  const [contentPrefill, setContentPrefill] = useState(null);
  const [unread, setUnread] = useState(0);
  const [inboxKey, setInboxKey] = useState(null);
  const [contactToOpen, setContactToOpen] = useState(null);
  // After signing in on a platform, the server sends the browser back with what was connected.
  useEffect(() => {
    const q = new URLSearchParams(location.search);
    if (!q.has('connected') && !q.has('connect_error')) return;
    const n = Number(q.get('count')) || 0;
    toast(q.has('connect_error') ? q.get('connect_error') : `Connected ${n} account${n === 1 ? '' : 's'}`);
    history.replaceState(null, '', location.pathname + location.hash);
  }, []);

  useEffect(() => { document.documentElement.classList.toggle('dark', store.settings.theme !== 'light'); }, [store.settings.theme]);
  useEffect(() => {
    const onHash = () => { const t = tabFromHash(); if (!t) return; setTab(t[0]); if (t[1]) setCrmSub(t[1]); };
    window.addEventListener('hashchange', onHash); return () => window.removeEventListener('hashchange', onHash);
  }, []);
  useEffect(() => { (async () => { const [s, m] = await Promise.all([getCap('sample'), getCap('mcp')]); setCaps({ sample: s, mcp: m }); })(); }, []);
  // Gmail and Calendar need claude.ai connectors; without them the Google tab would be a dead end.
  const tabs = TABS.filter(t => t.id !== 'workspace' || caps.mcp !== null);
  useEffect(() => { if (!tabs.some(t => t.id === tab)) setTab('command'); }, [caps.mcp, tab]);
  // On a phone the menu scrolls sideways: keep the open tab in view.
  useEffect(() => { const el = document.querySelector('nav [data-active="true"]'); if (el && el.scrollIntoView) el.scrollIntoView({ inline: 'center', block: 'nearest' }); }, [tab]);

  const go = target => { const [id, sub] = TAB_ALIAS[target] || [target, null]; if (sub) setCrmSub(sub); setTab(id); try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; } window.scrollTo({ top: 0 }); };
  const openDeal = d => setDealEdit(d || {});
  const openInvoice = (inv, deal) => setInvEdit({ inv: inv || null, deal: deal || null });
  const startDeal = o => { const t = (o.tiers || []).find(t => num(t.price) > 0); setDealEdit({ brand: o.brand, offerId: o.id, value: t ? t.price : '', stage: 'lead', nextStep: o.firstMove || '' }); };
  // Autopilot drafts wait on the server until this device brings them into the content plan.
  const storeRef = useRef(store);
  storeRef.current = store;
  const [pilot, setPilot] = useState(null);
  const importInbox = async () => {
    const st = await window.SoulveeOS.autopilot.status().catch(() => null);
    if (!st || !st.allowed) return 0;
    setPilot(st);
    if (!st.inbox) return 0;
    const box = await window.SoulveeOS.autopilot.inbox().catch(() => ({ drafts: [] }));
    const drafts = box.drafts || [];
    for (const d of drafts) await storeRef.current.add('content', d);
    if (drafts.length) {
      await window.SoulveeOS.autopilot.ack(drafts.map(d => d.id)).catch(() => {});
      toast(`Autopilot drafted ${drafts.length} post${drafts.length === 1 ? '' : 's'} — review them in Content`);
    }
    return drafts.length;
  };
  useEffect(() => {
    if (store.mode !== 'db') return undefined;
    importInbox();
    const timer = setInterval(importInbox, 60000);
    return () => clearInterval(timer);
  }, [store.mode]);
  // Unread messages for the Inbox badge (the Inbox itself refreshes faster while open).
  useEffect(() => {
    const check = () => window.SoulveeOS.inbox.list().then(r => setUnread(r.unread), () => {});
    const timer = { id: null };
    window.SoulveeOS.allowed().then(ok => { if (!ok) return; check(); timer.id = setInterval(check, 60000); });
    return () => clearInterval(timer.id);
  }, []);
  const openConversation = key => { setInboxKey(key); go('inbox'); };
  const showContact = c => { setContactToOpen(c.id); go('crm'); };
  // While autopilot is on, keep its copy of the offers and recent post titles up to date.
  const ctxKey = pilot && pilot.enabled ? JSON.stringify([store.data.offers.map(o => [o.id, o.name, o.status, o.brand, (o.tiers || []).map(t => num(t.price))]), store.data.content.length]) : '';
  useEffect(() => {
    if (!ctxKey) return undefined;
    const timer = setTimeout(() => window.SoulveeOS.autopilot.context(autopilotContext(storeRef.current)).catch(() => {}), 1500);
    return () => clearTimeout(timer);
  }, [ctxKey]);
  const reviewCount = store.data.content.filter(p => p.status === 'draft' && p.autopilot).length;
  const promote = o => { setContentPrefill({ brand: o.brand, offerId: o.id, goal: `Promote ${o.name}` }); go('content'); };
  const saveDeal = async v => { const rec = await withContact(store, v); if (dealEdit && dealEdit.id) await store.update('deals', dealEdit.id, rec); else await store.add('deals', rec); setDealEdit(null); toast('Deal saved'); };

  const dark = store.settings.theme !== 'light';
  const view = {
    command: html`<${CommandView} store=${store} caps=${caps} go=${go} openDeal=${openDeal} openInvoice=${openInvoice} />`,
    skills: html`<${SkillsView} store=${store} caps=${caps} toast=${toast} startDeal=${startDeal} promote=${promote} />`,
    crm: html`<${CRMView} store=${store} caps=${caps} toast=${toast} sub=${crmSub} setSub=${setCrmSub} openDeal=${openDeal} openInvoice=${openInvoice} openId=${contactToOpen} clearOpen=${() => setContactToOpen(null)} openConversation=${openConversation} />`,
    inbox: html`<${InboxView} store=${store} caps=${caps} toast=${toast} openKey=${inboxKey} setOpenKey=${setInboxKey} onUnread=${setUnread} go=${go} openContact=${showContact} />`,
    accounts: html`<${AccountsView} store=${store} toast=${toast} unread=${unread} />`,
    content: html`<${ContentView} store=${store} caps=${caps} toast=${toast} prefill=${contentPrefill} clearPrefill=${() => setContentPrefill(null)} onImport=${importInbox} />`,
    money: html`<${MoneyView} store=${store} toast=${toast} openInvoice=${openInvoice} />`,
    workspace: html`<${WorkspaceView} caps=${caps} toast=${toast} openDeal=${openDeal} />`,
    assistant: html`<${AssistantView} store=${store} caps=${caps} toast=${toast} />`,
    learn: html`<${LearnView} store=${store} caps=${caps} toast=${toast} />`,
    setup: html`<${SetupView} store=${store} caps=${caps} toast=${toast} />`,
  }[tab];

  const shellBg = 'min-h-screen ' + (dark ? 'bg-[radial-gradient(ellipse_at_top,_#2a1450_0%,_#0b0715_55%)]' : 'bg-[radial-gradient(ellipse_at_top,_#ede9fe_0%,_#f8fafc_55%)]');
  return html`<div className=${shellBg}>
    <header className="sticky top-0 z-40 backdrop-blur-xl border-b bg-white/75 border-slate-200 dark:bg-[#0b0715]/75 dark:border-white/10">
      <div className="max-w-6xl mx-auto px-4 pt-3 pb-2">
        <div className="flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center text-white font-extrabold glow shrink-0">S</div>
            <div className="min-w-0"><p className="text-[10px] uppercase tracking-[0.18em] font-bold text-violet-600 dark:text-violet-300">Soulveetainment Media Consults</p><h1 className="text-base sm:text-lg font-extrabold tracking-tight truncate">Soulvee OS</h1></div>
          </div>
          <div className="flex items-center gap-2">
            ${store.mode === 'local' && html`<span className="hidden sm:inline text-[11px] px-2 py-1 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300">Not saving</span>`}
            ${store.stale && html`<span className="text-[11px] px-2 py-1 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300">Reconnecting…</span>`}
            <button onClick=${() => store.saveSettings({ ...store.settings, theme: dark ? 'light' : 'dark' })} className="w-10 h-10 rounded-xl bg-slate-100 dark:bg-white/10 text-lg" aria-label="Toggle day and night mode">${dark ? '☀️' : '🌙'}</button>
          </div>
        </div>
        <nav className="flex gap-1.5 overflow-x-auto no-scrollbar mt-3 -mx-1 px-1">${tabs.map(t => html`<button key=${t.id} data-active=${tab === t.id ? 'true' : 'false'} onClick=${() => go(t.id)} className=${'whitespace-nowrap flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium transition ' + (tab === t.id ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/10')}><span>${t.icon}</span>${t.label}${t.id === 'content' && reviewCount ? html`<span className="ml-0.5 px-1.5 rounded-full text-[10px] font-bold bg-amber-400 text-slate-900" aria-label=${reviewCount + ' autopilot drafts to review'}>${reviewCount}</span>` : null}${t.id === 'inbox' && unread ? html`<span className="ml-0.5 px-1.5 rounded-full text-[10px] font-bold bg-emerald-400 text-slate-900" aria-label=${unread + ' unread messages'}>${unread}</span>` : null}</button>`)}</nav>
      </div>
    </header>
    <main className="max-w-6xl mx-auto px-4 py-5 pb-24">
      ${store.mode === 'local' && html`<div className="mb-4 p-3 rounded-xl text-xs bg-amber-50 text-amber-800 border border-amber-200 dark:bg-amber-500/10 dark:text-amber-200 dark:border-amber-500/20">This browser won't let Soulvee OS save data (private browsing?), so changes here won't be kept.</div>`}
      ${store.readOnly && html`<div className="mb-4 p-3 rounded-xl text-xs bg-sky-50 text-sky-800 dark:bg-sky-500/10 dark:text-sky-200">You're viewing Soulvee OS read-only.</div>`}
      ${view}
    </main>
    ${dealEdit && html`<${DealModal} deal=${dealEdit} offers=${store.data.offers} contacts=${store.data.contacts} onClose=${() => setDealEdit(null)} onSave=${saveDeal} />`}
    ${invEdit && html`<${InvoiceModal} invoice=${invEdit.inv} deal=${invEdit.deal} store=${store} toast=${toast} onClose=${() => setInvEdit(null)} />`}
    ${toastMsg && html`<div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] max-w-[92vw] px-4 py-3 rounded-xl text-sm font-medium text-white bg-gradient-to-r from-violet-600 to-fuchsia-600 shadow-2xl">${toastMsg}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
