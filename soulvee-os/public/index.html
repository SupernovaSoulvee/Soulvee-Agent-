<script>
(function () {
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);
// Store errors are already shown as a toast; don't report them again as unhandled.
window.addEventListener('unhandledrejection', e => { if (e.reason && e.reason.__toasted) e.preventDefault(); });
const sure = what => confirm(`Delete ${what}? This can't be undone.`);
const touch = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
const aiOffText = () => (window.SoulveeOS && window.SoulveeOS.aiOffReason && window.SoulveeOS.aiOffReason()) || 'AI is off.';

/* ---------------- constants ---------------- */
const BRANDS = [
  { id: 'smc', name: 'Soulveetainment Media Consults', short: 'SMC', grad: 'from-sky-500 to-blue-600', dot: 'bg-sky-500' },
  { id: 'dj', name: 'DJ Soulvee', short: 'DJ Soulvee', grad: 'from-violet-600 to-fuchsia-600', dot: 'bg-fuchsia-500' },
  { id: 'emporium', name: "Soulvee's Emporium", short: 'Emporium', grad: 'from-amber-500 to-orange-600', dot: 'bg-amber-500' },
  { id: 'efr', name: 'EFR', short: 'EFR', grad: 'from-emerald-500 to-teal-600', dot: 'bg-emerald-500' },
  { id: 'digital', name: 'Digital Products', short: 'Digital', grad: 'from-rose-500 to-pink-600', dot: 'bg-rose-500' },
];
const brandOf = id => BRANDS.find(b => b.id === id) || BRANDS[0];

const VOICE = {
  dj: 'You are DJ Soulvee (Supernova Soulvee), an Afro-urban DJ and radio broadcaster on Raypower 100.5FM and Metro 97.7FM. Tone: energetic, premium Afro-fusion, confident, visionary — Lagos-rooted with global crossover appeal.',
  smc: 'You are Soulveetainment Media Consults, a creative and technical media powerhouse doing B2B hospitality-tech and AI-automation consulting from Lagos. Tone: professional, innovative, reliable — clear and persuasive.',
  emporium: "You are Soulvee's Emporium, a premium African lifestyle and zodiac-themed merch brand. Tone: stylish, aspirational, lifestyle-driven.",
};
const voiceFor = b => VOICE[b === 'efr' ? 'dj' : b === 'digital' ? 'smc' : b] || VOICE.smc;

const STAGES = [
  { id: 'lead', name: 'Lead', p: 10 },
  { id: 'qualified', name: 'Qualified', p: 25 },
  { id: 'proposal', name: 'Proposal', p: 50 },
  { id: 'negotiation', name: 'Negotiation', p: 75 },
  { id: 'won', name: 'Won', p: 100 },
  { id: 'lost', name: 'Lost', p: 0 },
];
const stageOf = id => STAGES.find(s => s.id === id) || STAGES[0];
const OFFER_STATUS = ['idea', 'packaging', 'live', 'retired'];
const MODELS = ['project', 'retainer', 'booking', 'product', 'course', 'licence'];
const SOURCES = ['Direct', 'Referral', 'WhatsApp', 'Instagram', 'TikTok', 'LinkedIn', 'Email', 'Radio', 'Event', 'Fiverr', 'Upwork', 'Freelancer.com', 'SoundBetter'];
const METHODS = ['Moniepoint', 'Bank transfer', 'Paystack', 'Flutterwave', 'Stripe', 'PayPal', 'Cash', 'Selar', 'Gumroad', 'Spreadshop', 'Printify', 'TeePublic'];
const CURRENCIES = ['NGN', 'USD', 'GBP', 'EUR'];
const COLS = ['offers', 'deals', 'invoices', 'ledger', 'learning'];

const DEFAULT_SETTINGS = {
  theme: 'dark',
  company: { name: 'Soulveetainment Media Consults', bn: 'BN 2782266', address: 'Lagos Island East, Lagos, Nigeria', phone: '+2348069769446', email: 'djsoulvee@gmail.com', payment: 'Moniepoint' },
  h2Target: 0,
  vatRate: 7.5,
  whtDefault: 5,
  fx: { USD: 0, GBP: 0, EUR: 0 },
  alloc: [
    { name: 'Tax reserve', pct: 15 },
    { name: 'Operations', pct: 25 },
    { name: 'Growth & reinvest', pct: 25 },
    { name: 'Savings', pct: 20 },
    { name: 'Owner pay', pct: 15 },
  ],
  invoiceSeq: 2,
};
const mergeSettings = s => ({ ...DEFAULT_SETTINGS, ...s, company: { ...DEFAULT_SETTINGS.company, ...(s && s.company) }, fx: { ...DEFAULT_SETTINGS.fx, ...(s && s.fx) }, alloc: (s && Array.isArray(s.alloc) && s.alloc.length) ? s.alloc : DEFAULT_SETTINGS.alloc });

/* ---------------- helpers ---------------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const localDate = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return localDate(d); };
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const ngn = n => { const v = Math.round(num(n)); return (v < 0 ? '−' : '') + '₦' + Math.abs(v).toLocaleString('en-NG'); };
const ngnShort = n => {
  const v = num(n); const a = Math.abs(v); const sign = Math.round(v) < 0 ? '−' : '';
  if (a >= 999995000) return sign + '₦' + (a / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (a >= 999500) return sign + '₦' + (a / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
  if (a >= 1e3) return sign + '₦' + Math.round(a / 1e3) + 'K';
  return ngn(v);
};
const fmtDate = iso => { if (!iso) return '—'; const d = new Date(String(iso).length <= 10 ? iso + 'T12:00:00' : iso); return isNaN(d) ? String(iso) : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
const fmtDateTime = iso => { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return String(iso); return String(iso).length <= 10 ? fmtDate(iso) : d.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const year = new Date().getFullYear();
const PERIODS = {
  h2: { label: 'H2 ' + year, from: year + '-07-01', to: year + '-12-31' },
  year: { label: String(year), from: year + '-01-01', to: year + '-12-31' },
  all: { label: 'All time', from: '0000-01-01', to: '9999-12-31' },
};
const inPeriod = (d, p) => !!d && d >= PERIODS[p].from && d <= PERIODS[p].to;

function invTotals(inv, settings) {
  const sub = (inv.items || []).reduce((a, it) => a + num(it.amount), 0);
  const rate = settings.vatRate === '' || settings.vatRate == null ? 7.5 : num(settings.vatRate);
  const vat = inv.vat ? sub * rate / 100 : 0;
  const wht = sub * num(inv.wht) / 100;
  return { sub, vat, total: sub + vat, wht, net: sub + vat - wht };
}
const invStatus = inv => (inv.status === 'sent' && inv.dueDate && inv.dueDate < localDate()) ? 'overdue' : (inv.status || 'draft');
const clientCode = c => (String(c || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 8) || 'CLIENT');
const invNumber = (client, seq) => `INV-SMC-${clientCode(client)}-${String(seq).padStart(3, '0')}`;

function computeSnapshot(data, settings, period = 'h2') {
  const inc = data.ledger.filter(l => l.type === 'income' && inPeriod(l.date, period));
  const exp = data.ledger.filter(l => l.type === 'expense' && inPeriod(l.date, period));
  const income = inc.reduce((a, l) => a + num(l.ngn), 0);
  const expenses = exp.reduce((a, l) => a + num(l.ngn), 0);
  const byBrand = BRANDS.map(b => ({ id: b.id, name: b.short, income: inc.filter(l => l.brand === b.id).reduce((a, l) => a + num(l.ngn), 0), expenses: exp.filter(l => l.brand === b.id).reduce((a, l) => a + num(l.ngn), 0) }));
  const openInv = data.invoices.filter(i => ['sent', 'overdue'].includes(invStatus(i)));
  const outstanding = openInv.reduce((a, i) => a + invTotals(i, settings).net, 0);
  const overdue = data.invoices.filter(i => invStatus(i) === 'overdue');
  const openDeals = data.deals.filter(d => !['won', 'lost'].includes(d.stage));
  const pipeline = openDeals.reduce((a, d) => a + num(d.value), 0);
  const weighted = openDeals.reduce((a, d) => a + num(d.value) * (d.prob != null ? num(d.prob) : stageOf(d.stage).p) / 100, 0);
  const h2Income = data.ledger.filter(l => l.type === 'income' && inPeriod(l.date, 'h2')).reduce((a, l) => a + num(l.ngn), 0);
  return { period: PERIODS[period].label, income, expenses, net: income - expenses, byBrand, outstanding, openInvoices: openInv.length, overdueCount: overdue.length, overdue, pipeline, weighted, openDeals: openDeals.length, h2Income, h2Target: num(settings.h2Target) };
}

async function getCap(name) {
  for (let i = 0; i < 40 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
  if (!(window.claude && window.claude.use)) return null;
  try { return await window.claude.use(name); } catch (e) { return null; }
}

function mcpMessage(e, server) {
  const s = (e && e.server) || server;
  switch (e && e.code) {
    case 'needs_reauth': return `Reconnect ${s} in claude.ai Settings → Connectors.`;
    case 'server_not_connected': return `Add ${s} in claude.ai Settings → Connectors, then try again.`;
    case 'selection_required': return `Choose which ${s} account to use in the claude.ai prompt, then try again.`;
    case 'approval_required': return `This needs your approval — tap the button again and allow it.`;
    case 'not_in_manifest': return `${s} is turned off for this page. Re-enable it from the page's connector settings.`;
    case 'blocked_by_policy': return `Your organisation's policy blocks this ${s} action.`;
    case 'server_unavailable': return `${s} isn't answering right now. Try again in a moment.`;
    case 'tool_error': return `${s} reported an error: ${e.message || 'unknown'}`;
    default: return (e && e.message) || `Something went wrong talking to ${s}.`;
  }
}
async function mcpCall(mcp, server, tool, input) {
  try { const r = await mcp.callTool(server, tool, input); return { ok: true, payload: r && r.payload !== undefined ? r.payload : r }; }
  catch (e) { return { ok: false, error: mcpMessage(e, server), code: e && e.code }; }
}
function sampleMessage(e) {
  if (!e) return 'The assistant could not answer.';
  if (e.code === 'not_granted') return 'AI is not enabled for this view.';
  if (e.code === 'rate_limited') return 'Too many AI requests just now — wait a minute and try again.';
  return e.message || 'The assistant could not answer.';
}
async function askJSON(sample, prompt) {
  if (typeof sample.json === 'function') {
    try { const v = await sample.json(prompt); if (v && typeof v === 'object') return v; } catch (e) { if (e && e.code) throw e; }
  }
  const r = await sample(prompt);
  const m = (r.text || '').match(/\{[\s\S]*\}/);
  if (!m) throw { message: 'The AI did not return a usable offer. Try again.' };
  return JSON.parse(m[0]);
}

/* ---------------- data store ---------------- */
function useStore(toast) {
  const [mode, setMode] = useState('connecting');
  const [stale, setStale] = useState(false);
  const [readOnly, setReadOnly] = useState(false);
  const [data, setData] = useState(() => Object.fromEntries(COLS.map(c => [c, []])));
  const [settings, setSettings] = useState(() => {
    let s = DEFAULT_SETTINGS;
    try { const t = localStorage.getItem('cu-theme'); if (t) s = { ...s, theme: t }; } catch (e) {}
    return s;
  });
  const dbRef = useRef(null);
  const settingsRef = useRef(settings);
  settingsRef.current = settings;

  useEffect(() => {
    let alive = true; const unsubs = [];
    (async () => {
      const db = await getCap('db');
      if (!alive) return;
      if (!db) { setMode('local'); return; }
      dbRef.current = db; setMode('db');
      const timer = setTimeout(() => setStale(true), 10000);
      COLS.forEach(c => {
        unsubs.push(db.collection(c).onSnapshot(snap => {
          setData(p => ({ ...p, [c]: snap.docs.map(d => ({ ...d.data(), id: d.id })) }));
          if (!snap.metadata.fromCache) { clearTimeout(timer); setStale(false); }
        }, err => { clearTimeout(timer); setStale(false); if (err && err.code === 'revoked') setMode('local'); }));
      });
      unsubs.push(db.doc('settings/main').onSnapshot(snap => {
        if (snap.exists) setSettings(prev => ({ ...mergeSettings(snap.data()), theme: prev.theme }));
      }, () => {}));
      const user = await getCap('user');
      if (user && typeof user.can === 'function') {
        try { const w = await user.can('data.write'); if (w === false) setReadOnly(true); } catch (e) {}
      }
    })();
    return () => { alive = false; unsubs.forEach(u => { try { u(); } catch (e) {} }); };
  }, []);

  const fail = e => {
    if (e && e.code === 'invalid_argument') { setReadOnly(true); toast('You can view this unit but not change it.'); }
    else if (e && e.code === 'quota_exceeded') toast('Storage is full — delete old records to add more.');
    else toast('Could not save: ' + ((e && e.message) || 'try again'));
    if (e && typeof e === 'object') e.__toasted = true;
    throw e;
  };
  const add = async (c, obj) => {
    const id = obj.id || uid();
    const doc = { ...obj, id, createdAt: obj.createdAt || new Date().toISOString() };
    if (dbRef.current) { try { await dbRef.current.collection(c).doc(id).set(doc); } catch (e) { fail(e); } }
    else setData(p => ({ ...p, [c]: [...p[c], doc] }));
    return doc;
  };
  const update = async (c, id, patch) => {
    if (dbRef.current) { try { await dbRef.current.collection(c).doc(id).update(patch); } catch (e) { fail(e); } }
    else setData(p => ({ ...p, [c]: p[c].map(x => x.id === id ? { ...x, ...patch } : x) }));
  };
  const remove = async (c, id) => {
    if (dbRef.current) { try { await dbRef.current.collection(c).doc(id).delete(); } catch (e) { fail(e); } }
    else setData(p => ({ ...p, [c]: p[c].filter(x => x.id !== id) }));
  };
  const saveSettings = async s => {
    settingsRef.current = s;
    setSettings(s);
    try { localStorage.setItem('cu-theme', s.theme); } catch (e) {}
    if (dbRef.current) { try { const { theme, ...rest } = s; await dbRef.current.doc('settings/main').set(rest); } catch (e) { fail(e); } }
  };
  return { mode, stale, readOnly, data, settings, setSettings, latestSettings: () => settingsRef.current, add, update, remove, saveSettings };
}

/* ---------------- UI atoms ---------------- */
const inputCls = 'w-full rounded-xl px-3 py-2 text-sm bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-violet-500 placeholder-slate-400 dark:placeholder-slate-500';
const muted = 'text-slate-500 dark:text-slate-400';

function Card({ children, className = '' }) {
  return html`<div className=${'rounded-2xl p-4 sm:p-5 border bg-white border-slate-200 shadow-sm dark:bg-white/[0.04] dark:border-white/10 dark:shadow-none ' + className}>${children}</div>`;
}
function Btn({ kind = 'primary', small, className = '', ...p }) {
  const base = small ? 'px-3 py-1.5 text-xs' : 'px-4 py-2 text-sm';
  const k = {
    primary: 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white hover:opacity-90 shadow-sm',
    ghost: 'bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-white/10 dark:text-slate-200 dark:hover:bg-white/15',
    good: 'bg-emerald-600 text-white hover:bg-emerald-700',
    danger: 'bg-rose-50 text-rose-700 hover:bg-rose-100 dark:bg-rose-500/15 dark:text-rose-300 dark:hover:bg-rose-500/25',
  }[kind];
  return html`<button ...${p} className=${`${base} ${k} rounded-xl font-medium transition disabled:opacity-40 disabled:cursor-not-allowed ${className}`}>${p.children}</button>`;
}
function Field({ label, hint, children, className = '' }) {
  return html`<label className=${'block ' + className}><span className=${'block text-xs font-medium mb-1 ' + muted}>${label}</span>${children}${hint && html`<span className=${'block text-[11px] mt-1 ' + muted}>${hint}</span>`}</label>`;
}
function Input(p) { return html`<input ...${p} className=${inputCls + ' ' + (p.className || '')} />`; }
function Area(p) { return html`<textarea ...${p} className=${inputCls + ' ' + (p.className || '')} />`; }
function Select({ value, onChange, options, className = '' }) {
  const opts = options.map(o => typeof o === 'string' ? { v: o, l: o } : o);
  if (options.every(o => typeof o === 'string') && value != null && value !== '' && !opts.some(o => o.v === value)) opts.push({ v: value, l: String(value) });
  return html`<select value=${value == null ? '' : value} onChange=${e => onChange(e.target.value)} className=${inputCls + ' ' + className}>${opts.map(o => html`<option key=${o.v} value=${o.v}>${o.l}</option>`)}</select>`;
}
const brandOptions = BRANDS.map(b => ({ v: b.id, l: b.name }));
function BrandChip({ id }) {
  const b = brandOf(id);
  return html`<span className="inline-flex items-center gap-1.5 text-[11px] font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-200"><span className=${'w-1.5 h-1.5 rounded-full ' + b.dot}></span>${b.short}</span>`;
}
function Pill({ tone = 'slate', children }) {
  const t = {
    slate: 'bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-300',
    green: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300',
    amber: 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300',
    red: 'bg-rose-100 text-rose-800 dark:bg-rose-500/15 dark:text-rose-300',
    blue: 'bg-sky-100 text-sky-800 dark:bg-sky-500/15 dark:text-sky-300',
    violet: 'bg-violet-100 text-violet-800 dark:bg-violet-500/15 dark:text-violet-300',
  }[tone];
  return html`<span className=${'text-[11px] font-semibold px-2 py-0.5 rounded-full capitalize ' + t}>${children}</span>`;
}
function Modal({ title, onClose, children, footer, wide }) {
  const downOnBackdrop = useRef(false);
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') closeRef.current(); };
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, []);
  // Rendered into <body> so parent spacing (space-y-*) can't offset the overlay and leave the header clickable.
  return ReactDOM.createPortal(html`<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/55 backdrop-blur-sm" role="dialog" aria-modal="true" onMouseDown=${e => { downOnBackdrop.current = e.target === e.currentTarget; }} onClick=${e => { if (downOnBackdrop.current && e.target === e.currentTarget) onClose(); downOnBackdrop.current = false; }}>
    <div className=${'w-full ' + (wide ? 'sm:max-w-2xl' : 'sm:max-w-lg') + ' max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-2xl bg-white dark:bg-[#150d26] border border-slate-200 dark:border-white/10 p-5'}>
      <div className="flex items-center justify-between mb-4">
        <h3 className="font-semibold text-base">${title}</h3>
        <button onClick=${onClose} className="w-8 h-8 rounded-full bg-slate-100 dark:bg-white/10 text-sm" aria-label="Close">✕</button>
      </div>
      ${children}
      ${footer && html`<div className="mt-5 flex flex-wrap gap-2 justify-end">${footer}</div>`}
    </div>
  </div>`, document.body);
}
function Empty({ title, children }) {
  return html`<div className="text-center py-8 px-4"><p className="font-medium text-sm">${title}</p>${children && html`<div className=${'text-xs mt-1 ' + muted}>${children}</div>`}</div>`;
}
function Section({ title, sub, action, children }) {
  return html`<section className="space-y-3">
    <div className="flex items-end justify-between gap-3 flex-wrap">
      <div><h2 className="text-lg sm:text-xl font-bold tracking-tight">${title}</h2>${sub && html`<p className=${'text-xs sm:text-sm ' + muted}>${sub}</p>`}</div>
      ${action}
    </div>
    ${children}
  </section>`;
}
function Stat({ label, value, sub, grad }) {
  return html`<div className=${'rounded-2xl p-4 text-white bg-gradient-to-br relative overflow-hidden ' + grad}>
    <div className="absolute -right-6 -top-6 w-20 h-20 rounded-full bg-white/10"></div>
    <p className="text-[11px] uppercase tracking-wider text-white/80 font-semibold">${label}</p>
    <p className="text-xl sm:text-2xl font-extrabold mt-1">${value}</p>
    ${sub && html`<p className="text-[11px] text-white/80 mt-0.5">${sub}</p>`}
  </div>`;
}
function Chips({ value, onChange, options }) {
  return html`<div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">${options.map(o => html`<button key=${o.v} onClick=${() => onChange(o.v)} className=${'whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium transition ' + (value === o.v ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white' : 'bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-300')}>${o.l}</button>`)}</div>`;
}

/* ---------------- Command ---------------- */
function CommandView({ store, caps, go, openDeal, openInvoice }) {
  const { data, settings } = store;
  const [period, setPeriod] = useState('h2');
  const s = useMemo(() => computeSnapshot(data, settings, period), [data, settings, period]);
  const maxBrand = Math.max(1, ...s.byBrand.map(b => b.income));
  const usd = num(settings.fx.USD);

      <p className=${'text-xs mt-2 ' + muted}>${s.h2Target > 0 ? `${ngn(s.h2Income)} of ${ngn(s.h2Target)} collected · ${ngn(Math.max(0, s.h2Target - s.h2Income))} to go` : 'Your combined H2 target is still unconfirmed — set it in Setup so progress tracks here.'}</p>
    <//>

    <div className="grid lg:grid-cols-2 gap-4">
      <${Card}>

        <div className="space-y-2.5">${s.byBrand.map(b => html`<div key=${b.id}>

          <div className="h-2 rounded-full bg-slate-100 dark:bg-white/10 overflow-hidden"><div className=${'h-full rounded-full bg-gradient-to-r ' + brandOf(b.id).grad} style=${{ width: (b.income / maxBrand * 100) + '%' }}></div></div>

function OfferModal({ offer, onClose, onSave }) {

    ...(offer || {}),
    channels: Array.isArray(offer && offer.channels) ? offer.channels.join(', ') : ((offer && offer.channels) || ''),
    tiers: (offer && offer.tiers && offer.tiers.length ? offer.tiers : [{ name: '', price: '', deliverables: '' }]).map(t => ({ ...t, deliverables: Array.isArray(t.deliverables) ? t.deliverables.join(', ') : (t.deliverables || '') })),
  }));
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const setTier = (i, k, v) => setF(p => ({ ...p, tiers: p.tiers.map((t, j) => j === i ? { ...t, [k]: v } : t) }));

    if (!f.name.trim()) return;

    });

      <div className="space-y-2">${f.tiers.map((t, i) => html`<div key=${i} className="grid grid-cols-12 gap-2 p-2 rounded-xl bg-slate-50 dark:bg-white/5">

        <input className=${inputCls + ' col-span-5'} placeholder="Price ₦" inputMode="numeric" value=${t.price} onChange=${e => { setTier(i, 'price', e.target.value); setTier(i, '_touched', true); }} />

  const [draft, setDraft] = useState(null);
  const [editing, setEditing] = useState(null);

  const earned = useMemo(() => {
    const m = {};
    data.ledger.forEach(l => { if (l.type === 'income' && l.offerId) m[l.offerId] = (m[l.offerId] || 0) + num(l.ngn); });
    return m;
  }, [data.ledger]);
  const offers = data.offers.filter(o => brand === 'all' || o.brand === brand).sort((a, b) => OFFER_STATUS.indexOf(a.status) - OFFER_STATUS.indexOf(b.status) || String(a.name).localeCompare(b.name));
  const counts = OFFER_STATUS.map(st => ({ st, n: data.offers.filter(o => o.status === st).length }));

  const convert = async () => {
    if (!caps.sample) return;
    setBusy(true); setDraft(null);
    try {
      const prompt = `${voiceFor(conv.brand)}
You are packaging one of Soulvee's skills into a sellable offer for the Nigerian (Lagos-first) market, with global reach where it fits.
Skill: ${conv.skill}
Target client: ${conv.audience || 'best-fit buyers you identify'}
Brand: ${brandOf(conv.brand).name}
Return ONLY a JSON object, no prose:
{"name": string (short offer name), "pitch": string (2 sentences in the brand voice), "model": one of ${JSON.stringify(MODELS)}, "tiers": [3 objects {"name": string, "price": number (Naira, whole number, realistic for Lagos SMEs/creatives in ${year}), "deliverables": [3-5 short strings]}], "channels": [2-4 strings: where to sell it], "firstMove": string (one concrete action to land the first paying client this week)}`;
      const v = await askJSON(caps.sample, prompt);
      setDraft({ brand: conv.brand, status: 'packaging', name: v.name || 'New offer', pitch: v.pitch || '', model: MODELS.includes(v.model) ? v.model : 'project', channels: Array.isArray(v.channels) ? v.channels : [], firstMove: v.firstMove || '', tiers: (v.tiers || []).map(t => ({ name: t.name || '', price: num(t.price), deliverables: Array.isArray(t.deliverables) ? t.deliverables : [], suggested: true })), source: 'ai', skill: conv.skill });
    } catch (e) { toast(sampleMessage(e)); }

  return html`<div className="space-y-6">
    <${Section} title="Skills → Revenue" sub="Turn what you can do into priced offers, then push them into the pipeline.">

      ${caps.sample === null ? html`<p className="text-sm text-amber-600 dark:text-amber-400">${aiOffText()} You can still add offers by hand.</p>` : html`
      <div className="grid sm:grid-cols-3 gap-3">
        <${Field} label="Brand"><${Select} value=${conv.brand} onChange=${v => setConv({ ...conv, brand: v })} options=${brandOptions} /><//>
        <${Field} label="Skill" className="sm:col-span-2"><${Input} value=${conv.skill} onChange=${e => setConv({ ...conv, skill: e.target.value })} placeholder="e.g. I build MCP servers that connect a business's tools to Claude" /><//>
        <${Field} label="Who pays for it (optional)" className="sm:col-span-3"><${Input} value=${conv.audience} onChange=${e => setConv({ ...conv, audience: e.target.value })} placeholder="e.g. Lagos restaurants, event planners, creatives" /><//>
      </div>
      <div className="mt-3 flex gap-2 flex-wrap">
        <${Btn} onClick=${convert} disabled=${busy || !conv.skill.trim()}>${busy ? 'Packaging…' : 'Convert to offer'}</${Btn}>

      </div>`}
      ${draft && html`<div className="mt-4 p-4 rounded-xl border border-violet-300 dark:border-violet-500/40 bg-violet-50/60 dark:bg-violet-500/10">
        <div className="flex items-center gap-2 flex-wrap"><p className="font-semibold">${draft.name}</p><${BrandChip} id=${draft.brand} /><${Pill} tone="violet">${draft.model}</${Pill}></div>

      ${offers.length === 0 ? html`<${Card}><${Empty} title="No offers yet">Convert a skill above or add one by hand.<//><//>` : html`<div className="grid md:grid-cols-2 gap-3">${offers.map(o => {

            <div className="text-right shrink-0"><p className=${'text-[10px] uppercase ' + muted}>Earned</p><p className="font-bold text-emerald-600 dark:text-emerald-400 text-sm">${ngnShort(earned[o.id] || 0)}</p></div>
          </div>
          ${o.pitch && html`<p className=${'text-xs mt-2 ' + muted}>${o.pitch}</p>`}
          <div className="mt-3 space-y-1">${priced.length ? priced.map((t, i) => html`<div key=${i} className="flex justify-between text-sm"><span>${t.name}${t.suggested ? html` <span className="text-[10px] text-amber-600 dark:text-amber-400">(suggested)</span>` : ''}</span><span className="font-semibold">${ngn(t.price)}</span></div>`) : html`<p className="text-xs text-amber-600 dark:text-amber-400">No price set yet — tap Edit to add your rate card.</p>`}</div>
          ${o.firstMove && html`<p className="text-[11px] mt-2"><span className="font-semibold">Next:</span> ${o.firstMove}</p>`}
          <div className="flex gap-2 mt-3 flex-wrap">
            <${Btn} small onClick=${() => startDeal(o)}>Start deal</${Btn}>
            <${Btn} small kind="ghost" onClick=${() => setEditing(o)}>Edit</${Btn}>
            <select className=${inputCls + ' !w-auto !py-1.5 text-xs'} value=${o.status} onChange=${e => update('offers', o.id, { status: e.target.value })}>${OFFER_STATUS.map(st => html`<option key=${st} value=${st}>${st}</option>`)}</select>

  </div>`;
}

function DealModal({ deal, offers, onClose, onSave }) {
  const [f, setF] = useState(() => ({ client: '', email: '', brand: 'smc', offerId: '', value: '', stage: 'lead', prob: '', source: 'Direct', nextStep: '', nextDue: '', notes: '', ...(deal || {}) }));
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const brandOffers = offers.filter(o => o.brand === f.brand);
  const setBrand = v => setF(p => ({ ...p, brand: v, offerId: v === p.brand ? p.offerId : '' }));
  // A win chance still on the old stage's default follows the new stage; a custom one is kept.
  const setStage = v => setF(p => ({ ...p, stage: v, prob: p.prob === '' || p.prob == null || num(p.prob) === stageOf(p.stage).p ? '' : p.prob }));
  return html`<${Modal} title=${deal && deal.id ? 'Edit deal' : 'New deal'} onClose=${onClose} footer=${html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} disabled=${!String(f.client).trim()} onClick=${() => onSave({ ...f, client: String(f.client).trim(), value: num(f.value), prob: f.prob === '' ? stageOf(f.stage).p : num(f.prob) })}>Save deal</${Btn}>`}>
    <div className="grid grid-cols-2 gap-3">
      <${Field} label="Client" className="col-span-2"><${Input} value=${f.client} onChange=${e => set('client', e.target.value)} placeholder="Business or person" /><//>
      <${Field} label="Client email" className="col-span-2" hint="Used for follow-up emails and calendar invites"><${Input} type="email" value=${f.email} onChange=${e => set('email', e.target.value)} /><//>
      <${Field} label="Brand"><${Select} value=${f.brand} onChange=${setBrand} options=${brandOptions} /><//>
      <${Field} label="Offer"><${Select} value=${f.offerId} onChange=${v => { const o = offers.find(x => x.id === v); set('offerId', v); if (o && !num(f.value)) { const t = (o.tiers || []).find(t => num(t.price) > 0); if (t) set('value', t.price); } }} options=${[{ v: '', l: '— none —' }, ...brandOffers.map(o => ({ v: o.id, l: o.name }))]} /><//>
      <${Field} label="Value (₦)"><${Input} inputMode="numeric" value=${f.value} onChange=${e => set('value', e.target.value)} /><//>
      <${Field} label="Stage"><${Select} value=${f.stage} onChange=${setStage} options=${STAGES.map(s => ({ v: s.id, l: s.name }))} /><//>
      <${Field} label="Win chance %"><${Input} inputMode="numeric" value=${f.prob} placeholder=${String(stageOf(f.stage).p)} onChange=${e => set('prob', e.target.value)} /><//>
      <${Field} label="Source"><${Select} value=${f.source} onChange=${v => set('source', v)} options=${SOURCES} /><//>
      <${Field} label="Next step" className="col-span-2"><${Input} value=${f.nextStep} onChange=${e => set('nextStep', e.target.value)} placeholder="e.g. Send Option 2 proposal" /><//>
      <${Field} label="Next step due"><${Input} type="date" value=${f.nextDue} onChange=${e => set('nextDue', e.target.value)} /><//>
      <${Field} label="Notes" className="col-span-2"><${Area} rows="2" value=${f.notes} onChange=${e => set('notes', e.target.value)} /><//>
    </div>
  <//>`;
}

function FollowUpModal({ deal, offers, caps, toast, onClose, onDone }) {
  const [subject, setSubject] = useState(`Following up — ${deal.client}`);
  const [body, setBody] = useState('');
  const [busy, setBusy] = useState('');
  const offer = offers.find(o => o.id === deal.offerId);
  const write = async () => {
    if (!caps.sample) return;
    setBusy('write');
    try {
      const r = await caps.sample(`${voiceFor(deal.brand)}
Write a short follow-up email (under 150 words) from Soulvee to ${deal.client} about ${offer ? offer.name : 'our proposal'} worth ${ngn(deal.value)}. Stage: ${stageOf(deal.stage).name}. Next step we want: ${deal.nextStep || 'agree on next steps'}. Notes: ${deal.notes || 'none'}.
Plain text only, no markdown, no subject line. Sign off as "Soulvee" with "Soulveetainment Media Consults · +2348069769446" on the line below. Do not invent prices or dates not given here.`, { cache: false });
      setBody((r.text || '').trim());
    } catch (e) { toast(sampleMessage(e)); }
    setBusy('');
  };
  const save = async () => {
    if (!caps.mcp) return;
    setBusy('save');
    const res = await mcpCall(caps.mcp, 'Gmail', 'create_draft', { to: deal.email ? [deal.email] : [], subject, body });
    setBusy('');
    if (res.ok) { toast('Draft saved in Gmail — review and send it there'); onDone(res.payload && res.payload.viewUrl); }
    else toast(res.error);
  };
  const ready = !!body.trim();
  const mailto = 'mailto:' + String(deal.email || '').replace(/[^A-Za-z0-9@._+-]/g, '') + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  const copy = async () => { try { await navigator.clipboard.writeText(`Subject: ${subject}\n\n${body}`); toast('Copied'); } catch (e) { toast('Copy blocked — select the text and copy it manually'); } };
  return html`<${Modal} title="Follow-up email" onClose=${onClose} footer=${html`<${Btn} kind="ghost" onClick=${write} disabled=${!caps.sample || !!busy}>${busy === 'write' ? 'Writing…' : body ? 'Rewrite with AI' : 'Write with AI'}</${Btn}>${caps.mcp ? html`<${Btn} onClick=${save} disabled=${!ready || !!busy}>${busy === 'save' ? 'Saving…' : 'Save as Gmail draft'}</${Btn}>` : html`<${Btn} kind="ghost" onClick=${copy} disabled=${!ready}>Copy</${Btn}><a href=${ready ? mailto : undefined} aria-disabled=${!ready} className=${'px-4 py-2 text-sm rounded-xl font-medium bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white hover:opacity-90 shadow-sm' + (ready ? '' : ' opacity-40 pointer-events-none')}>Open in email app</a>`}`}>
    ${!deal.email && html`<p className="text-xs text-amber-600 dark:text-amber-400 mb-3">No client email on this deal — the draft will have no recipient. Add one via Edit.</p>`}

function CalendarModal({ prefill, caps, toast, onClose }) {
  const [f, setF] = useState({ summary: prefill.summary || '', date: addDays(localDate(), 1), time: '11:00', mins: '30', email: prefill.email || '', meet: true, location: '' });
  const [busy, setBusy] = useState(false);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const create = async () => {
    if (!caps.mcp) return;
    const start = `${f.date}T${f.time}:00`;
    const end = new Date(new Date(start).getTime() + num(f.mins) * 60000);
    const endIso = localDate(end) + 'T' + String(end.getHours()).padStart(2, '0') + ':' + String(end.getMinutes()).padStart(2, '0') + ':00';
    const input = { summary: f.summary, startTime: start, endTime: endIso, addGoogleMeetUrl: !!f.meet };
    if (f.location) input.location = f.location;
    if (f.email) input.attendees = [{ email: f.email }];
    setBusy(true);
    const res = await mcpCall(caps.mcp, 'Google Calendar', 'create_event', input);
    setBusy(false);
    if (res.ok) { toast('Event added to Google Calendar'); onClose(); } else toast(res.error);
  };
  const startAt = new Date(`${f.date}T${f.time}:00`);
  const ok = !!f.summary.trim() && !isNaN(startAt.getTime());
  const endAt = new Date(startAt.getTime() + (num(f.mins) || 30) * 60000);
  const stamp = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const gcalUrl = () => {
    const q = new URLSearchParams({ action: 'TEMPLATE', text: f.summary.trim(), dates: stamp(startAt) + '/' + stamp(endAt) });
    if (f.location) q.set('location', f.location);
    if (f.email) q.set('add', f.email);
    return 'https://calendar.google.com/calendar/render?' + q.toString();
  };
  const downloadIcs = () => {
    const esc = v => String(v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    const fold = line => line.length <= 74 ? line : line.match(/.{1,73}/g).join('\r\n ');
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Soulvee OS//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
      `UID:${uid()}@soulvee-os`, `DTSTAMP:${stamp(new Date())}`, `DTSTART:${stamp(startAt)}`, `DTEND:${stamp(endAt)}`, `SUMMARY:${esc(f.summary.trim())}`];
    if (f.location) lines.push(`LOCATION:${esc(f.location)}`);
    if (f.email) lines.push(`ATTENDEE;RSVP=TRUE:mailto:${f.email}`);
    lines.push('END:VEVENT', 'END:VCALENDAR');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.map(fold).join('\r\n') + '\r\n'], { type: 'text/calendar' }));
    a.download = (f.summary.replace(/[^\w\- ]+/g, '').trim() || 'event') + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Calendar file downloaded — open it to add the event'); onClose();
  };
  return html`<${Modal} title=${caps.mcp ? 'Book on Google Calendar' : 'Book a call'} onClose=${onClose} footer=${caps.mcp ? html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} onClick=${create} disabled=${busy || !ok}>${busy ? 'Booking…' : 'Create event'}</${Btn}>` : html`<${Btn} kind="ghost" onClick=${downloadIcs} disabled=${!ok}>Download .ics</${Btn}><a href=${ok ? gcalUrl() : undefined} target="_blank" rel="noopener" aria-disabled=${!ok} onClick=${() => { if (ok) setTimeout(onClose, 0); }} className=${'px-4 py-2 text-sm rounded-xl font-medium bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white hover:opacity-90 shadow-sm' + (ok ? '' : ' opacity-40 pointer-events-none')}>Open in Google Calendar</a>`}>
    ${!caps.mcp && html`<p className=${'text-xs mb-3 ' + muted}>Opens Google Calendar with the details filled in, or download a calendar file for any calendar app.</p>`}
    <div className="grid grid-cols-2 gap-3">
      <${Field} label="Title" className="col-span-2"><${Input} value=${f.summary} onChange=${e => set('summary', e.target.value)} /><//>
      <${Field} label="Date"><${Input} type="date" value=${f.date} onChange=${e => set('date', e.target.value)} /><//>
      <${Field} label="Time"><${Input} type="time" value=${f.time} onChange=${e => set('time', e.target.value)} /><//>
      <${Field} label="Length (mins)"><${Input} inputMode="numeric" value=${f.mins} onChange=${e => set('mins', e.target.value)} /><//>
      <${Field} label="Invite (email)"><${Input} type="email" value=${f.email} onChange=${e => set('email', e.target.value)} /><//>
      <${Field} label="Location" className="col-span-2"><${Input} value=${f.location} onChange=${e => set('location', e.target.value)} placeholder="Optional" /><//>
      ${caps.mcp && html`<label className="col-span-2 flex items-center gap-2 text-sm"><input type="checkbox" checked=${f.meet} onChange=${e => set('meet', e.target.checked)} /> Add a Google Meet link</label>`}
    </div>
  <//>`;
}

function parseSender(s) {
  if (!s) return { name: '', email: '' };
  if (typeof s === 'object') return { name: s.displayName || s.name || s.email || '', email: s.email || s.emailAddress || '' };
  const m = String(s).match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>/);
  if (m) return { name: m[1] || m[2], email: m[2] };
  return { name: s, email: String(s).includes('@') ? s : '' };
}
function parseThreads(p) {
  const arr = (p && (p.threads || p.items)) || (Array.isArray(p) ? p : []);
  return arr.map(t => {
    const msgs = t.messages || [];
    const first = msgs[0] || {}; const last = msgs[msgs.length - 1] || first;
    return { id: t.id, subject: first.subject || last.subject || t.subject || '(no subject)', from: parseSender(last.sender || first.sender || t.sender), date: last.date || first.date || '', snippet: last.snippet || first.snippet || t.snippet || '', url: t.viewUrl || last.viewUrl || first.viewUrl || '' };
  });
}
function parseEvents(p) {
  const arr = (p && (p.events || p.items)) || (Array.isArray(p) ? p : []);
  return arr.map(e => {
    const st = e.start || e.startTime; const start = typeof st === 'object' && st ? (st.dateTime || st.date) : st;
    return { id: e.id || uid(), title: e.summary || '(untitled)', start, location: e.location || '', url: e.htmlLink || e.viewUrl || '', meet: e.hangoutLink || e.googleMeetUrl || '' };
  });
}

];

      const payload = history.map((m, i) => i === 0 ? { role: 'user', content: preamble() + '\n\n---\n' + m.content } : m);
      const r = await caps.sample(payload, { tools, cache: false, signal: ctl.signal, onText: ({ text }) => setMsgs(m => { const c = [...m]; c[c.length - 1] = { role: 'assistant', content: text }; return c; }) });
      setMsgs(m => { const c = [...m]; c[c.length - 1] = { role: 'assistant', content: (r.text || '').trim() || '(no answer)' }; return c; });
    } catch (e) {
      const t = e && e.text ? e.text : sampleMessage(e);
      setMsgs(m => { const c = [...m]; c[c.length - 1] = { role: 'assistant', content: t }; return c; });
    }
    setBusy(false); abortRef.current = null;
  };
  const copy = async t => { try { await navigator.clipboard.writeText(t); toast('Copied'); } catch (e) { toast('Copy blocked — long-press to copy'); } };

  if (caps.sample === null) return html`<${Section} title="AI sub-agent"><${Card}><${Empty} title="AI isn't available">${aiOffText()}<//><//><//>`;

  const prompts = ['Where is my revenue this H2 — what should I chase first?', 'Which deals need a follow-up this week?', 'Draft a reply to a fan asking how to book DJ Soulvee for a December wedding', 'Turn my Google Workspace automation skill into an offer and save it'];
  return html`<div className="space-y-4">
    <${Section} title="AI sub-agent" sub="Reads your live numbers, drafts replies in your voice, and logs deals, offers and draft invoices when you ask." action=${html`<div className="w-44"><${Select} value=${voice} onChange=${setVoice} options=${[{ v: 'dj', l: 'Voice: DJ Soulvee' }, { v: 'smc', l: 'Voice: SMC' }, { v: 'emporium', l: 'Voice: Emporium' }]} /></div>`} />
    <${Card} className="!p-0 overflow-hidden">
      <div className="h-[52vh] sm:h-[56vh] overflow-y-auto p-4 space-y-3">
        ${msgs.length === 0 && html`<div className="space-y-2"><p className=${'text-sm ' + muted}>Try one:</p>${prompts.map(p => html`<button key=${p} onClick=${() => send(p)} className="block w-full text-left text-sm p-3 rounded-xl bg-slate-50 hover:bg-slate-100 dark:bg-white/5 dark:hover:bg-white/10">${p}</button>`)}</div>`}
        ${msgs.map((m, i) => html`<div key=${i} className=${'flex ' + (m.role === 'user' ? 'justify-end' : 'justify-start')}>
          <div className=${'max-w-[88%] rounded-2xl px-4 py-2.5 text-sm whitespace-pre-wrap ' + (m.role === 'user' ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white' : 'bg-slate-100 dark:bg-white/10')}>
            ${m.content || (busy && i === msgs.length - 1 ? html`<span className=${muted}>Thinking…</span>` : '')}
            ${m.role === 'assistant' && m.content && !(busy && i === msgs.length - 1) && html`<div className="mt-2"><button onClick=${() => copy(m.content)} className="text-[11px] font-medium text-violet-600 dark:text-violet-300">Copy</button></div>`}
          </div>
        </div>`)}
        ${acts.length > 0 && html`<div className="text-[11px] text-emerald-600 dark:text-emerald-400">${acts.map((a, i) => html`<p key=${i}>✓ ${a}</p>`)}</div>`}
        <div ref=${endRef}></div>
      </div>
      <form className="flex items-end gap-2 p-3 border-t border-slate-100 dark:border-white/10" onSubmit=${e => { e.preventDefault(); send(); }}>
        <textarea rows=${Math.min(6, input.split('\n').length)} className=${inputCls + ' resize-none'} value=${input} onChange=${e => setInput(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && !e.shiftKey && !touch && !(e.nativeEvent && e.nativeEvent.isComposing)) { e.preventDefault(); send(); } }} placeholder=${touch ? 'Ask about money, deals, or paste a message to reply to…' : 'Ask about money, deals, or paste a message to reply to… (Shift+Enter for a new line)'}></textarea>
        ${busy ? html`<${Btn} type="button" kind="ghost" onClick=${() => abortRef.current && abortRef.current.abort()}>Stop</${Btn}>` : html`<${Btn} type="submit" disabled=${!input.trim()}>Send</${Btn}>`}
      </form>
    <//>
    ${msgs.length > 0 && !busy && html`<button className=${'text-xs ' + muted} onClick=${() => setMsgs([])}>Clear conversation</button>`}
  </div>`;
}

function TrackModal({ track, offers, onClose, onSave }) {

  return html`<${Modal} title=${track && track.id ? 'Edit track' : 'New learning track'} onClose=${onClose} footer=${html`<${Btn} kind="ghost" onClick=${onClose}>Cancel</${Btn}><${Btn} disabled=${!String(f.title).trim()} onClick=${() => onSave({ ...f, level: Math.max(0, Math.min(5, num(f.level))) })}>Save</${Btn}>`}>
    <div className="grid grid-cols-2 gap-3">
      <${Field} label="Skill to learn" className="col-span-2"><${Input} value=${f.title} onChange=${e => set('title', e.target.value)} placeholder="e.g. Building MCP servers" /><//>
      <${Field} label="Brand it earns for"><${Select} value=${f.brand} onChange=${v => set('brand', v)} options=${brandOptions} /><//>
      <${Field} label="Levels done (0–5)"><${Input} inputMode="numeric" value=${f.level} onChange=${e => set('level', e.target.value)} /><//>
      <${Field} label="Unlocks offer" className="col-span-2"><${Select} value=${f.offerId} onChange=${v => set('offerId', v)} options=${[{ v: '', l: '— none —' }, ...offers.map(o => ({ v: o.id, l: o.name }))]} /><//>
      <${Field} label="Goal" className="col-span-2"><${Input} value=${f.goal} onChange=${e => set('goal', e.target.value)} placeholder="What being good at this lets you sell" /><//>
      <${Field} label="Notes" className="col-span-2"><${Area} rows="2" value=${f.notes} onChange=${e => set('notes', e.target.value)} /><//>

  <//>`;
}

function LearnView({ store, caps, toast }) {
  const { data, add, update, remove } = store;
  const [editing, setEditing] = useState(null);
  const [lesson, setLesson] = useState(null);
  const offerOf = id => data.offers.find(o => o.id === id);
  const tracks = [...data.learning].sort((a, b) => num(a.level) - num(b.level));

  const teach = async t => {
    if (!caps.sample) return;
    const o = offerOf(t.offerId); const lvl = Math.min(5, num(t.level) + 1);
    setLesson({ track: t, level: lvl, text: '', busy: true });
    try {
      const r = await caps.sample(`You are a practical tutor for Soulvee, a Lagos-based solo founder (DJ, radio broadcaster, hospitality-tech and AI-automation consultant) who learns by doing and prefers systems over hustle.
Teach Level ${lvl} of 5 in: ${t.title}.
${t.goal ? 'His goal: ' + t.goal + '.' : ''} ${o ? `This skill powers the offer "${o.name}"${(o.tiers || []).some(x => num(x.price) > 0) ? ' priced from ' + ngn(Math.min(...o.tiers.filter(x => num(x.price) > 0).map(x => num(x.price)))) : ''}.` : ''} ${t.notes ? 'Notes so far: ' + t.notes : ''}
Levels: 1 foundations, 2 core workflow, 3 real project, 4 client-ready delivery, 5 productise and scale. Pitch it exactly at Level ${lvl}.
Format as plain text with these labels on their own lines: GOAL, KEY IDEAS (3-5 dashes), DO THIS NOW (one 30-60 minute hands-on task with steps), TURN IT INTO MONEY (how this level makes the offer more sellable, NGN angle), CHECK YOURSELF (3 short questions). Under 350 words. No markdown symbols.`, { cache: false, onText: ({ text }) => setLesson(l => l && { ...l, text }) });
      setLesson(l => l && { ...l, text: (r.text || '').trim(), busy: false });
    } catch (e) { setLesson(l => l && { ...l, text: sampleMessage(e), busy: false }); }
  };

  return html`<div className="space-y-5">
    <${Section} title="Learn → Earn" sub="Every skill you level up is tied to an offer it makes sellable." action=${html`<${Btn} small onClick=${() => setEditing({})}>+ Track</${Btn}>`} />
    ${tracks.length === 0 ? html`<${Card}><${Empty} title="No learning tracks yet">Add the skills you're building — MCP servers, Google Workspace automation, SambaPOS — and link each to the offer it unlocks.<//><//>` : html`<div className="grid md:grid-cols-2 gap-3">${tracks.map(t => {
      const o = offerOf(t.offerId); const lvl = num(t.level);
      return html`<${Card} key=${t.id}>
        <div className="flex items-start justify-between gap-2"><div className="min-w-0"><p className="font-semibold">${t.title}</p><div className="flex gap-1.5 mt-1 flex-wrap"><${BrandChip} id=${t.brand} />${lvl >= 5 ? html`<${Pill} tone="green">mastered</${Pill}>` : html`<${Pill} tone="violet">Level ${lvl}/5</${Pill}>`}</div></div></div>
        <div className="flex gap-1 mt-3">${[1, 2, 3, 4, 5].map(n => html`<div key=${n} className=${'h-1.5 flex-1 rounded-full ' + (n <= lvl ? 'bg-gradient-to-r from-violet-600 to-fuchsia-500' : 'bg-slate-200 dark:bg-white/10')}></div>`)}</div>
        ${t.goal && html`<p className=${'text-xs mt-2 ' + muted}>${t.goal}</p>`}
        ${o && html`<p className="text-xs mt-1">Unlocks: <span className="font-medium">${o.name}</span></p>`}
        <div className="flex gap-2 mt-3 flex-wrap">
          ${lvl < 5 && caps.sample && html`<${Btn} small onClick=${() => teach(t)}>Level ${lvl + 1} lesson</${Btn}>`}
          ${lvl < 5 && html`<${Btn} small kind="good" onClick=${() => { update('learning', t.id, { level: lvl + 1 }); toast(`${t.title}: Level ${lvl + 1} done`); }}>Mark level done</${Btn}>`}
          <${Btn} small kind="ghost" onClick=${() => setEditing(t)}>Edit</${Btn}>
          <${Btn} small kind="danger" onClick=${() => sure(`the "${t.title}" track`) && remove('learning', t.id)}>Delete</${Btn}>
        </div>
      <//>`;
    })}</div>`}
    ${lesson && html`<${Modal} title=${`${lesson.track.title} · Level ${lesson.level}`} wide onClose=${() => setLesson(null)} footer=${html`<${Btn} kind="ghost" onClick=${() => setLesson(null)}>Close</${Btn}>${!lesson.busy && html`<${Btn} kind="good" onClick=${() => { update('learning', lesson.track.id, { level: lesson.level }); toast('Level completed'); setLesson(null); }}>I've done it — mark Level ${lesson.level}</${Btn}>`}`}>
      <div className="text-sm whitespace-pre-wrap leading-relaxed">${lesson.text || html`<span className=${muted}>Preparing your lesson…</span>`}</div>
    <//>`}
    ${editing && html`<${TrackModal} track=${editing} offers=${data.offers} onClose=${() => setEditing(null)} onSave=${async v => { if (editing.id) await update('learning', editing.id, v); else await add('learning', v); setEditing(null); toast('Track saved'); }} />`}
  </div>`;
}

        <${Field} label="VAT rate %"><${Input} inputMode="decimal" value=${f.vatRate} onChange=${e => setF({ ...f, vatRate: e.target.value })} /><//>

      <${Btn} onClick=${save} disabled=${readOnly}>Save setup</${Btn}>

}

const TABS = [
  { id: 'command', label: 'Command', icon: '◎' },
  { id: 'skills', label: 'Skills → Revenue', icon: '✦' },
  { id: 'pipeline', label: 'Pipeline', icon: '▤' },
  { id: 'money', label: 'Money', icon: '₦' },
  { id: 'workspace', label: 'Google', icon: '✉' },
  { id: 'assistant', label: 'AI Agent', icon: '✧' },
  { id: 'learn', label: 'Learn', icon: '◈' },
  { id: 'setup', label: 'Setup', icon: '⚙' },
];

function App() {
  const [toastMsg, setToastMsg] = useState(null);
  const toastTimer = useRef(null);
  const toast = m => { setToastMsg(m); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToastMsg(null), 3000); };
  const store = useStore(toast);
  const [tab, setTab] = useState(() => { const h = (location.hash || '').slice(1); return TABS.some(t => t.id === h) ? h : 'command'; });
  const [caps, setCaps] = useState({ sample: undefined, mcp: undefined });
  const [dealEdit, setDealEdit] = useState(null);
  const [invEdit, setInvEdit] = useState(null);

  useEffect(() => { document.documentElement.classList.toggle('dark', store.settings.theme !== 'light'); }, [store.settings.theme]);
  useEffect(() => {
    const onHash = () => { const h = (location.hash || '').slice(1); if (TABS.some(t => t.id === h)) setTab(h); };
    window.addEventListener('hashchange', onHash); return () => window.removeEventListener('hashchange', onHash);
  }, []);
  useEffect(() => { (async () => { const [s, m] = await Promise.all([getCap('sample'), getCap('mcp')]); setCaps({ sample: s, mcp: m }); })(); }, []);
  // Gmail and Calendar need claude.ai connectors; without them the Google tab would be a dead end.
  const tabs = TABS.filter(t => t.id !== 'workspace' || caps.mcp !== null);
  useEffect(() => { if (!tabs.some(t => t.id === tab)) setTab('command'); }, [caps.mcp, tab]);

  const go = id => { setTab(id); try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; } window.scrollTo({ top: 0 }); };
  const openDeal = d => setDealEdit(d || {});
  const openInvoice = (inv, deal) => setInvEdit({ inv: inv || null, deal: deal || null });
  const startDeal = o => { const t = (o.tiers || []).find(t => num(t.price) > 0); setDealEdit({ brand: o.brand, offerId: o.id, value: t ? t.price : '', stage: 'lead', nextStep: o.firstMove || '' }); };
  const saveDeal = async v => { if (dealEdit && dealEdit.id) await store.update('deals', dealEdit.id, v); else await store.add('deals', v); setDealEdit(null); toast('Deal saved'); };

  const dark = store.settings.theme !== 'light';
  const view = {
    command: html`<${CommandView} store=${store} caps=${caps} go=${go} openDeal=${openDeal} openInvoice=${openInvoice} />`,
    skills: html`<${SkillsView} store=${store} caps=${caps} toast=${toast} startDeal=${startDeal} />`,
    pipeline: html`<${PipelineView} store=${store} caps=${caps} toast=${toast} openDeal=${openDeal} openInvoice=${openInvoice} />`,
    money: html`<${MoneyView} store=${store} toast=${toast} openInvoice=${openInvoice} />`,
    workspace: html`<${WorkspaceView} caps=${caps} toast=${toast} openDeal=${openDeal} />`,
    assistant: html`<${AssistantView} store=${store} caps=${caps} toast=${toast} />`,
    learn: html`<${LearnView} store=${store} caps=${caps} toast=${toast} />`,
    setup: html`<${SetupView} store=${store} caps=${caps} toast=${toast} />`,
  }[tab];

  const shellBg = 'min-h-screen ' + (dark ? 'bg-[radial-gradient(ellipse_at_top,_#2a1450_0%,_#0b0715_55%)]' : 'bg-[radial-gradient(ellipse_at_top,_#ede9fe_0%,_#f8fafc_55%)]');
  return html`<div className=${shellBg}>
    <header className="sticky top-0 z-40 backdrop-blur-xl border-b bg-white/75 border-slate-200 dark:bg-[#0b0715]/75 dark:border-white/10">
      <div className="max-w-6xl mx-auto px-4 pt-3 pb-2">
        <div className="flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center text-white font-extrabold glow shrink-0">S</div>
            <div className="min-w-0"><p className="text-[10px] uppercase tracking-[0.18em] font-bold text-violet-600 dark:text-violet-300">Soulveetainment Media Consults</p><h1 className="text-base sm:text-lg font-extrabold tracking-tight truncate">Soulvee OS</h1></div>
          </div>
          <div className="flex items-center gap-2">
            ${store.mode === 'local' && html`<span className="hidden sm:inline text-[11px] px-2 py-1 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300">Not saving</span>`}
            ${store.stale && html`<span className="text-[11px] px-2 py-1 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300">Reconnecting…</span>`}
            <button onClick=${() => store.saveSettings({ ...store.settings, theme: dark ? 'light' : 'dark' })} className="w-10 h-10 rounded-xl bg-slate-100 dark:bg-white/10 text-lg" aria-label="Toggle day and night mode">${dark ? '☀️' : '🌙'}</button>
          </div>
        </div>
        <nav className="flex gap-1.5 overflow-x-auto no-scrollbar mt-3 -mx-1 px-1">${tabs.map(t => html`<button key=${t.id} onClick=${() => go(t.id)} className=${'whitespace-nowrap flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium transition ' + (tab === t.id ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/10')}><span>${t.icon}</span>${t.label}</button>`)}</nav>
      </div>
    </header>
    <main className="max-w-6xl mx-auto px-4 py-5 pb-24">
      ${store.mode === 'local' && html`<div className="mb-4 p-3 rounded-xl text-xs bg-amber-50 text-amber-800 border border-amber-200 dark:bg-amber-500/10 dark:text-amber-200 dark:border-amber-500/20">This browser won't let Soulvee OS save data (private browsing?), so changes here won't be kept.</div>`}
      ${store.readOnly && html`<div className="mb-4 p-3 rounded-xl text-xs bg-sky-50 text-sky-800 dark:bg-sky-500/10 dark:text-sky-200">You're viewing Soulvee OS read-only.</div>`}
      ${view}
    </main>
    ${dealEdit && html`<${DealModal} deal=${dealEdit} offers=${store.data.offers} onClose=${() => setDealEdit(null)} onSave=${saveDeal} />`}
    ${invEdit && html`<${InvoiceModal} invoice=${invEdit.inv} deal=${invEdit.deal} store=${store} toast=${toast} onClose=${() => setInvEdit(null)} />`}
    ${toastMsg && html`<div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] max-w-[92vw] px-4 py-3 rounded-xl text-sm font-medium text-white bg-gradient-to-r from-violet-600 to-fuchsia-600 shadow-2xl">${toastMsg}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
